<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meal Planner — Discover</title>
<meta name="theme-color" content="#1c1410" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Meals" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="nav">
  <span class="brand">🍽 Meal Planner</span>
  <div class="nav-links hscroll">
    <a href="plan.html"><svg class="tab-ic" aria-hidden="true"><use href="nav-icons.svg#i-tonight"/></svg><span class="tab-l">Tonight</span></a>
    <a href="index.html"><svg class="tab-ic" aria-hidden="true"><use href="nav-icons.svg#i-browse"/></svg><span class="tab-l">Browse</span></a>
    <a href="discover.html" class="active"><svg class="tab-ic" aria-hidden="true"><use href="nav-icons.svg#i-disc"/></svg><span class="tab-l">Discover</span></a>
    <a href="shopping.html"><svg class="tab-ic" aria-hidden="true"><use href="nav-icons.svg#i-shop"/></svg><span class="tab-l">Shopping</span></a>
    <a href="eaten.html"><svg class="tab-ic" aria-hidden="true"><use href="nav-icons.svg#i-eaten"/></svg><span class="tab-l">Eaten</span></a>
  </div>
  <button id="theme-toggle" class="icon-btn" title="Toggle dark/light mode">🌓</button>
</nav>

<main>
  <section class="section" style="margin-top:1rem;">
    <h1 style="color:#fff6ea;font-size:1.6rem;margin:0 0 4px;text-align:center;">Pin up something good</h1>
    <p class="muted" style="text-align:center;">Swipe right to add, left to dismiss, tap for details.</p>
    <div id="discover-filters" class="chip-row hscroll">
      <button class="chip active" data-cat="">All</button>
      <button class="chip" data-cat="Chicken">Chicken</button>
      <button class="chip" data-cat="Beef">Beef</button>
      <button class="chip" data-cat="Seafood">Seafood</button>
      <button class="chip" data-cat="Pasta">Pasta</button>
      <button class="chip" data-cat="Pork">Pork</button>
      <button class="chip" data-cat="Lamb">Lamb</button>
      <button class="chip" data-cat="Vegetarian">Vegetarian</button>
      <button class="chip" data-filter="pantry" aria-pressed="false">Using what's left</button>
    </div>
    <p class="muted" id="gap-note" style="text-align:center;"></p>
    <div class="fan-wrap">
      <div class="fan-progress" id="fan-progress"></div>
      <div class="fan-deck" id="fan-deck"></div>
      <div class="fan-controls">
        <button class="fan-btn skip" id="fan-skip" aria-label="Dismiss (left arrow)">✕ Dismiss</button>
        <button class="fan-btn" id="fan-details" aria-label="Details (up arrow)">Details</button>
        <button class="fan-btn like" id="fan-like" aria-label="Add to library (right arrow)">♥ Add</button>
        <button class="fan-btn" id="fan-undo" aria-label="Undo (Z)" disabled>↶ Undo</button>
      </div>
      <p class="keys-hint">← dismiss · → add · ↑ or Enter details · Z undo</p>
    </div>
  </section>

  <section class="section">
    <h2>Saved for later</h2>
    <div id="saved-grid" class="card-grid"></div>
  </section>
</main>

<div id="toast-root"></div>

<script src="data.js"></script>
<script src="prefs.js"></script>
<script src="ratings.js"></script>
<script src="nutrition.js"></script>
<script src="exclusions.js"></script>
<script src="mealdb.js"></script>
<script src="shopping-list.js"></script>
<script src="shelf-life.js"></script>
<script src="hermes-sync.js"></script>
<script src="plan-chat.js"></script>
<script src="bar-chat.js"></script>
<script src="ate-box.js"></script>
<script src="meal-sheet.js"></script>
<script src="discover.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
