<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meal Planner — Discover</title>
<meta name="theme-color" content="#1c1410" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Meals" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="nav">
  <span class="brand">🍽 Meal Planner</span>
  <div class="nav-links hscroll">
    <a href="index.html">Browse & Add</a>
    <a href="discover.html" class="active">Discover</a>
    <a href="plan.html">2-Week Plan</a>
    <a href="shopping.html">Shopping</a>
  </div>
  <button id="theme-toggle" class="icon-btn" title="Toggle dark/light mode">🌓</button>
</nav>

<main>
  <section class="section" style="margin-top:1rem;">
    <h1 style="color:#fff6ea;font-size:1.6rem;margin:0 0 4px;text-align:center;">Pin up something good</h1>
    <p class="muted" style="text-align:center;">Swipe right to like, left to pass, up to save for later.</p>
    <div id="discover-filters" class="chip-row hscroll">
      <button class="chip active" data-cat="">All</button>
      <button class="chip" data-cat="Chicken">Chicken</button>
      <button class="chip" data-cat="Beef">Beef</button>
      <button class="chip" data-cat="Seafood">Seafood</button>
      <button class="chip" data-cat="Pasta">Pasta</button>
      <button class="chip" data-cat="Pork">Pork</button>
      <button class="chip" data-cat="Lamb">Lamb</button>
      <button class="chip" data-cat="Vegetarian">Vegetarian</button>
      <button class="chip" data-cat="Breakfast">Breakfast</button>
      <button class="chip" data-filter="pantry" aria-pressed="false">Using what's left</button>
    </div>
    <p class="muted" id="gap-note" style="text-align:center;"></p>
    <div class="fan-wrap">
      <div class="fan-progress" id="fan-progress"></div>
      <div class="fan-deck" id="fan-deck"></div>
      <div class="fan-controls">
        <button class="fan-btn skip" id="fan-skip" title="Pass">✕</button>
        <button class="fan-btn super" id="fan-super" title="Save for later">★</button>
        <button class="fan-btn like" id="fan-like" title="Like">♥</button>
      </div>
      <p class="swipe-hint">Drag the card — or use the buttons</p>
      <div class="fan-filmstrip-title">Up next</div>
      <div class="fan-filmstrip" id="fan-filmstrip"></div>
    </div>
  </section>

  <section class="section">
    <h2>Saved for later</h2>
    <div id="saved-grid" class="card-grid"></div>
  </section>
</main>

<div id="toast-root"></div>

<script src="data.js"></script>
<script src="nutrition.js"></script>
<script src="exclusions.js"></script>
<script src="mealdb.js"></script>
<script src="shopping-list.js"></script>
<script src="hermes-sync.js"></script>
<script src="discover.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
