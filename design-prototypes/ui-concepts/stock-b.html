$('#theme').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};
const money=n=>'£'+n.toFixed(2);

const BUD=60,AISLES=['Fruit & veg','Meat & fish','Dairy & eggs','Bakery','Tins & dry','Frozen','Household'];
let nid=1;const I=(a,n,q,p,h)=>({id:nid++,a,n,q,p,have:!!h,force:false,got:false,adhoc:false});
let items=[I(0,'Sweet potatoes','1 kg',1.4),I(0,'Baby spinach','240 g',1.5),I(0,'Broccoli','1 head',.85),I(0,'Onions','1 kg',1.1,1),I(0,'Garlic','2 bulbs',.6,1),I(0,'Carrots','1 kg',.7),I(0,'Lemons','3',.95),
I(1,'Chicken thighs','1.2 kg',4.8),I(1,'Chorizo','225 g',2.2),I(1,'Beef mince','500 g',3.75),I(1,'Salmon fillets','2',4.5),I(1,'Smoked haddock','300 g',3.4),
I(2,'Mozzarella','2 x 125 g',1.8),I(2,'Mature cheddar','400 g',3),I(2,'Semi-skimmed milk','2 L',1.55),I(2,'Butter','250 g',2.1,1),
I(3,'Pizza dough balls','2',1.1),I(3,'Wholemeal wraps','6',1.2),
I(4,'Chopped tomatoes','4 tins',2),I(4,'Chickpeas','2 tins',1),I(4,'Wholewheat pasta','500 g',.95),I(4,'Coconut milk','400 ml',1.05),I(4,'Basmati rice','1 kg',2.2,1),
I(5,'Garden peas','1 kg',1.6),I(5,'Fish pie mix','320 g',3.2),
I(6,'Kitchen foil','1 roll',1.2),I(6,'Washing-up liquid','1',1.1)];
const adh=I(4,'Tea bags','80',1.45);adh.adhoc=true;items.push(adh);
[0,1,5,7,8].forEach(k=>items[k].got=true);
let pid=1;const PP=(n,q)=>({id:pid++,n,q,store:'cupboard',weeks:0});
const PPS=(n,q,store,weeks)=>({id:pid++,n,q,store,weeks});
let pantry=[PPS('Frozen peas','400 g','freezer',4),PPS('Beef mince','500 g','freezer',11),PPS('Fish fingers','8','freezer',2),PPS('Mixed berries','300 g','freezer',15),PP('Onions','5'),PP('Garlic','2 bulbs'),PP('Basmati rice','800 g'),PP('Butter','180 g'),PP('Olive oil','half a bottle'),PP('Plain flour','1 kg'),PP('Stock cubes','8'),PP('Soy sauce','1 bottle'),PP('Cheddar','150 g')];
const st={tab:'list',edit:null,open:new Set([0,1]),aisle:0,just:null,fin:null,dis:false};
const need=()=>items.filter(i=>!i.have||i.force);
const total=()=>need().reduce((s,i)=>s+i.p,0);

`<li class="ln ${i.got?'got':''} ${st.just===i.id?'just':''}"><button class="tkb" role="checkbox" aria-checked="${i.got}" data-k="t${i.id}" data-t="${i.id}"><span class="box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span class="nm">${esc(i.n)}${i.adhoc?' <em class="adh">added</em>':''}</span><span class="q">${esc(i.q)}</span><span class="pr">${money(i.p)}</span></button></li>`;
const addForm=()=>`<form class="add" id="addf"><input class="in" name="n" required maxlength="40" placeholder="Add an item, e.g. bin bags" aria-label="Item name"><select class="in" name="a" aria-label="Aisle">${AISLES.map((a,k)=>`<option value="${k}" ${k===(st.aisle)?'selected':''}>${a}</option>`).join('')}</select><input class="in p" name="p" inputmode="decimal" placeholder="£ est." aria-label="Estimated price"><button class="btn pri">Add item</button></form>`;
function drawBanner(){$('#banner').innerHTML=st.dis||st.tab!=='list'?'':`<div class="shopbn" role="status"><b>Shop day: Sat 31 Oct</b><span>Asda click &amp; collect, 10:00 &middot; ${need().length} items for 14 dinners</span><button class="btn sm" data-dis>Got it</button></div>`}
function drawPantry(){const P=pantry;$('#panel').innerHTML=`<p class="pnote">Tick an item when it is used up. Tap a quantity to edit it.</p><ul class="pl">${P.length?P.map((p,i)=>`<li class="pn" style="--i:${Math.min(i,7)}" data-pid="${p.id}"><button class="pbox" role="checkbox" aria-checked="false" aria-label="Used up: ${esc(p.n)}" data-k="u${p.id}" data-used="${p.id}"><span class="box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></button><span class="nm">${esc(p.n)}</span>${st.edit===p.id?`<input class="in qin" data-k="e${p.id}" data-qin="${p.id}" value="${esc(p.q)}" maxlength="24" aria-label="Quantity of ${esc(p.n)}">`:`<button class="qb" data-k="q${p.id}" data-pe="${p.id}" aria-label="Edit quantity of ${esc(p.n)}: ${esc(p.q)}">${esc(p.q)}</button>`}<button class="rm" data-k="r${p.id}" data-pr="${p.id}" aria-label="Remove ${esc(p.n)}">&times;</button></li>`).join(''):'<p class="emp">Pantry is empty. Add what you have in.</p>'}</ul><form class="add" id="addp"><input class="in" name="n" required maxlength="40" placeholder="Add to pantry" aria-label="Pantry item"><input class="in p" name="q" maxlength="24" placeholder="Qty" aria-label="Quantity"><button class="btn pri">Add</button></form>`}
function drawDock(){const d=$('#dock'),t=total(),b=inTrolley(),N=need(),g=N.filter(i=>i.got).length,over=t>BUD;d.hidden=st.tab!=='list';
d.innerHTML=`<div class="dk-in"><div class="dk-l"><span><b>${money(t)}</b> <span class="xs">week total of ${money(BUD)} budget${over?' &middot; <b>'+money(t-BUD)+' over</b>':' &middot; '+money(BUD-t)+' left'}</span></span><div class="bud" role="img" aria-label="${Math.round(t/BUD*100)} percent of budget"><i class="${over?'over':''}" style="transform:scaleX(${Math.min(1,t/BUD)})"></i></div><small>In trolley ${money(b)} &middot; ${g} of ${N.length} ticked</small></div><div class="dk-r">${dockExtra(g===N.length)}</div></div>`}
function render(){const f=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.k;
$$('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===st.tab));
drawBanner();st.tab==='list'?drawList():drawPantry();drawDock();st.just=null;st.fin=null;
if(f){const e=document.querySelector(`[data-k="${f}"]`);e&&e.focus()}}
function tick(id){const i=items.find(x=>x.id==id),was=aisleStat(i.a);i.got=!i.got;st.just=i.got?i.id:null;const now=aisleStat(i.a);
if(i.got&&now.g===now.n&&was.g<was.n){st.fin=i.a;toast(AISLES[i.a]+' done')}render()}
document.addEventListener('click',e=>{const c=e.target.closest('button');if(!c)return;const d=c.dataset;
if(d.tab){st.tab=d.tab;st.edit=null;render();return}
if(d.t){tick(d.t);return}
if(d.dis!==undefined){st.dis=true;render();return}
if(d.need){const i=items.find(x=>x.id==d.need);i.force=true;render();toast(i.n+' added to the shop');return}
if(d.ai!==undefined){const k=+d.ai;st.open.has(k)?st.open.delete(k):st.open.add(k);render();return}
if(d.fin!==undefined){openRv();return}
if(d.pe){st.edit=+d.pe;render();const x=document.querySelector('[data-qin]');x&&(x.focus(),x.select());return}
if(d.pr){const p=pantry.find(x=>x.id==d.pr),k=pantry.indexOf(p);pantry.splice(k,1);render();toast('Removed '+p.n,()=>{pantry.splice(k,0,p);render()});return}
if(d.used){const li=c.closest('.pn'),p=pantry.find(x=>x.id==d.used);li.classList.add('got','just');c.setAttribute('aria-checked','true');setTimeout(()=>li.classList.add('out'),380);setTimeout(()=>{const k=pantry.indexOf(p);pantry.splice(k,1);render();toast(p.n+' used up',()=>{pantry.splice(k,0,p);render()})},680);return}
vclick&&vclick(c,d)});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.qin){const p=pantry.find(x=>x.id==e.target.dataset.qin);if(p&&st.edit===p.id){p.q=e.target.value.trim()||p.q;st.edit=null;render();toast('Updated '+p.n+' to '+p.q)}}});
document.addEventListener('keydown',e=>{if(e.target.dataset&&e.target.dataset.qin){if(e.key==='Enter')e.target.blur();if(e.key==='Escape'){st.edit=null;render()}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);
if(e.target.id==='addf'){const a=+f.get('a'),p=parseFloat(f.get('p'))||1.5,it=I(a,f.get('n').trim(),'1',p);it.adhoc=true;items.push(it);st.open.add(a);st.aisle=a;st.just=it.id;e.target.reset();render();toast('Added '+it.n+' to '+AISLES[a])}
if(e.target.id==='addp'){const p=PP(f.get('n').trim(),f.get('q').trim()||'1');pantry.push(p);render();toast('Added '+p.n+' to pantry')}});
let vclick=null;

function drawList(){$('#panel').innerHTML=AISLES.map((a,ai)=>{const L=items.filter(i=>i.a===ai);if(!L.length)return'';const s=aisleStat(ai),open=st.open.has(ai);
return `<section class="card aisle ${open?'open':''} ${s.n&&s.g===s.n?'done':''} ${st.fin===ai?'fin':''}"><button class="ah" data-k="a${ai}" data-ai="${ai}" aria-expanded="${open}"><span class="an">${a}</span><span class="ap">${s.g}/${s.n}</span><span class="pb"><i style="transform:scaleX(${s.n?s.g/s.n:0})"></i></span><span class="chev" aria-hidden="true">&#9662;</span></button><div class="ab"><div><ul>${L.map(row).join('')}</ul></div></div></section>`}).join('')+addForm()}
function dockExtra(all){return `<button class="btn pri" data-fin ${all?'':'disabled'}>Finish shop</button>`}


const stp=(i,k,w)=>`<div class="stp"><button type="button" data-sb="${i}:${k}-" aria-label="Less ${w}">&minus;</button><output data-o="${k}"></output><button type="button" data-sb="${i}:${k}+" aria-label="More ${w}">+</button></div>`;
const splitHTML=(r,i)=>`<div class="sB"><div class="col"><span class="cl">Use this week</span>${stp(i,'U','to use this week of '+esc(r.n))}</div><span class="ar" aria-hidden="true">&#8644;</span><div class="col z"><span class="cl">To freezer</span>${stp(i,'F','to freeze of '+esc(r.n))}</div></div><p class="xs dim">Freezer use-by about <b>${fub}</b> (3 months). The two always add up to ${f(r,r.amt)}.</p>`;
const splitSync=(li,r)=>{const u=r.amt-r.frz;li.querySelector('[data-o=U]').textContent=f(r,u);li.querySelector('[data-o=F]').textContent=f(r,r.frz);
li.querySelector('[data-sb$=":U-"]').disabled=r.frz>=r.amt;li.querySelector('[data-sb$=":U+"]').disabled=r.frz<=0;li.querySelector('[data-sb$=":F-"]').disabled=r.frz<=0;li.querySelector('[data-sb$=":F+"]').disabled=r.frz>=r.amt;
li.querySelectorAll('output').forEach(o=>o.setAttribute('aria-live','polite'))};
const vc=d=>{if(d.sb){const[i,k]=d.sb.split(':'),r=rows[i];r.frz=Math.max(0,Math.min(r.amt,r.frz+(k==='U-'||k==='F+'?r.step:-r.step)));sync(+i)}};

const SNOW='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg>';
const dt=d=>new Date(Date.UTC(2026,9,31+d)),iso=d=>dt(d).toISOString().slice(0,10),human=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const f=(r,v)=>r.unit==='pcs'?v+(v===1?' pc':' pcs'):(v>=1000&&v%100===0?v/1000+' kg':v+' g'),fub=human(iso(90));
const RR=(n,amt,unit,store,ub,need,note,pre)=>{const r={n,amt,unit,store,ub0:ub,useby:iso(ub),need,note,open:false,frz:0,step:unit==='pcs'?1:amt>=800?100:50};if(pre){r.open=true;r.frz=amt-need}return r};
const mk=()=>[RR('Chicken thighs',1200,'g','fridge',3,400,'Plan needs 400 g',1),RR('Beef mince',500,'g','fridge',3,500,"Won't be used by "+human(iso(3))),RR('Salmon fillets',2,'pcs','fridge',2,2,''),RR('Baby spinach',240,'g','fridge',4,240,"Won't be used by "+human(iso(4))),RR('Mature cheddar',400,'g','fridge',30,150,'Plan needs 150 g',1),RR('Chorizo',225,'g','fridge',21,225,''),RR('Carrots',1000,'g','fridge',14,1000,''),RR('Sweet potatoes',1000,'g','cupboard',10,1000,''),RR('Wholewheat pasta',500,'g','cupboard',365,500,''),RR('Garden peas',1000,'g','freezer',90,300,'Already frozen')];
let rows=mk(),shopDone=false,opener=null;
items.forEach(i=>{i.got=mk().some(r=>r.n===i.n)});
const rowHTML=(r,i)=>`<li class="rr" data-r="${i}" style="--i:${i}"><div><b>${esc(r.n)}</b>${r.note?`<span class="tg">${esc(r.note)}</span>`:''}</div><div class="rr-g"><label class="fld"><span class="lb">Amount (${r.unit})</span><input class="in" type="number" inputmode="numeric" min="1" data-amt="${i}"></label><label class="fld"><span class="lb">Use by</span><input class="in" type="date" data-ub="${i}"></label><div class="fld wide" role="radiogroup" aria-label="Store ${esc(r.n)} in"><span class="lb" aria-hidden="true">Store in</span><div class="seg2">${['fridge','freezer','cupboard'].map(k=>`<button type="button" role="radio" data-st="${i}:${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div></div></div><button type="button" class="fchip" data-fz="${i}" aria-pressed="false">${SNOW}<span></span></button><div class="split"><div><div class="split-in">${splitHTML(r,i)}</div></div></div></li>`;
function sum(){const z=rows.filter(r=>r.open&&r.frz>0).length;$('#rvsum').textContent=rows.length+' lines'+(z?' · '+z+' split to the freezer':'')}
function sync(i){const r=rows[i],li=$(`.rr[data-r="${i}"]`);li.classList.toggle('on',r.open);li.classList.toggle('isf',r.store==='freezer');
const a=li.querySelector('[data-amt]');if(document.activeElement!==a)a.value=r.amt;li.querySelector('[data-ub]').value=r.useby;
li.querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-checked',b.dataset.st.split(':')[1]===r.store));
const c=li.querySelector('.fchip');c.setAttribute('aria-pressed',r.open);c.lastChild.textContent=r.open?(r.frz?'Freezing '+f(r,r.frz):'Not freezing'):'Freeze some';
splitSync(li,r);sum()}
function openRv(){rows=mk();opener=document.activeElement;const L=need().filter(i=>!i.got).map(i=>i.n);
$('#rl').innerHTML=rows.map(rowHTML).join('');rows.forEach((_,i)=>sync(i));
$('#left').textContent='Left out, not ticked: '+L.slice(0,3).join(', ')+(L.length>3?' and '+(L.length-3)+' more':'')+'.';
const s=$('#rv');s.classList.add('on');s.setAttribute('aria-hidden','false');setTimeout(()=>s.querySelector('.ib').focus(),50)}
function closeRv(){const s=$('#rv');s.classList.remove('on');s.setAttribute('aria-hidden','true');const o=opener&&opener.isConnected?opener:$('[data-fin]');o&&o.focus()}
function confirmRv(){const add=[],mkp=(r,q,store,ub)=>({id:pid++,n:r.n,q,store,weeks:0,useby:ub});
rows.forEach(r=>{if(r.store==='freezer')add.push(mkp(r,f(r,r.amt),'freezer',r.useby));else{const m=r.amt-(r.open?r.frz:0);if(m>0)add.push(mkp(r,f(r,m),r.store,r.useby));if(r.open&&r.frz>0)add.push(mkp(r,f(r,r.frz),'freezer',iso(90)))}});
pantry.push(...add);shopDone=true;closeRv();st.tab='pantry';render();const z=add.filter(p=>p.store==='freezer').length;
toast(add.length+' entries added to the pantry, '+z+' in the freezer',()=>{pantry=pantry.filter(p=>!add.includes(p));shopDone=false;render()})}
function dockExtra(){return shopDone?'<button class="btn pri" disabled>Shop finished</button>':'<button class="btn pri" data-fin>Finish shop</button>'}
function prow(p){const fz=p.store==='freezer',tag=fz?` <em class="adh ${p.weeks>=8?'soon':''}">${p.weeks?p.weeks+' wk':'just frozen'}${p.weeks>=8?' &middot; use soon':''}</em>`:(p.useby?` <em class="adh">by ${human(p.useby)}</em>`:'');
return `<li class="pn" data-pid="${p.id}"><button class="pbox" role="checkbox" aria-checked="false" aria-label="Used up: ${esc(p.n)}" data-k="u${p.id}" data-used="${p.id}"><span class="box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></button><span class="nm">${esc(p.n)}${tag}</span>${st.edit===p.id?`<input class="in qin" data-k="e${p.id}" data-qin="${p.id}" value="${esc(p.q)}" maxlength="24" aria-label="Quantity of ${esc(p.n)}">`:`<button class="qb" data-k="q${p.id}" data-pe="${p.id}" aria-label="Edit quantity of ${esc(p.n)}: ${esc(p.q)}">${esc(p.q)}</button>`}<button class="rm" data-k="r${p.id}" data-pr="${p.id}" aria-label="Remove ${esc(p.n)}">&times;</button></li>`}
function drawPantry(){const F=pantry.filter(p=>p.store==='freezer').sort((a,b)=>b.weeks-a.weeks),O=pantry.filter(p=>p.store!=='freezer'),soon=F.filter(p=>p.weeks>=8).length;
$('#panel').innerHTML=`<p class="pnote">Tick an item when it is used up. Tap a quantity to edit it.</p><section class="pg"><h2 class="gh">${SNOW} In the freezer <span class="gc">${F.length}</span>${soon?`<span class="tg soon">${soon} to use soon</span>`:''}</h2>${F.length?`<ul class="pl">${F.map(prow).join('')}</ul><button class="btn sm ghost" data-clr>Empty freezer (demo)</button>`:`<div class="fempty card"><b>The freezer is empty</b><p class="dim xs">Freeze part of a bulk buy at Finish shop and it shows up here with how many weeks it has been in.</p></div>`}</section><section class="pg"><h2 class="gh">Fridge &amp; cupboard <span class="gc">${O.length}</span></h2><ul class="pl">${O.map(prow).join('')}</ul></section><form class="add" id="addp"><input class="in" name="n" required maxlength="40" placeholder="Add to pantry" aria-label="Pantry item"><input class="in p" name="q" maxlength="24" placeholder="Qty" aria-label="Quantity"><button class="btn pri">Add</button></form>`}
function toggleFz(i){const r=rows[i];r.open=!r.open;if(r.open)r.frz=r.frz||(r.need<r.amt?r.amt-r.need:Math.round(r.amt/2/r.step)*r.step);else r.frz=0;sync(i)}
function setStore(i,k){const r=rows[i];r.store=k;if(k==='freezer'){r.frz=0;r.open=false;r.useby=iso(90)}else r.useby=iso(r.ub0);sync(i)}
vclick=(c,d)=>{if(d.rvx!==undefined)return closeRv();if(d.rvok!==undefined)return confirmRv();if(d.fz!==undefined)return toggleFz(+d.fz);
if(d.st){const[i,k]=d.st.split(':');return setStore(+i,k)}
if(d.clr!==undefined){const old=pantry.slice();pantry=pantry.filter(p=>p.store!=='freezer');render();return toast('Freezer emptied',()=>{pantry=old;render()})}
vc(d)};
document.body.insertAdjacentHTML('beforeend',`<div class="scrim" id="rv" aria-hidden="true"><aside class="rv" role="dialog" aria-modal="true" aria-labelledby="rvt"><header class="rv-h"><div><h2 id="rvt">Review your shop</h2><p class="xs dim">Check amounts, where each goes and when to use it by.</p></div><button class="ib" data-rvx aria-label="Close review">&times;</button></header><div class="rv-b"><div class="photo"><button class="btn sm" disabled aria-describedby="phn">Fill from order photo</button><span class="tg">Later</span><p class="xs dim" id="phn">Optional. Hermes will read a photo of your order and fill this in. Not built yet.</p></div><ul class="rl" id="rl"></ul><p class="xs dim" id="left" style="margin-top:.8rem"></p></div><footer class="rv-f"><span id="rvsum" class="xs"></span><button class="btn ghost" data-rvx>Cancel</button><button class="btn pri" data-rvok>Confirm</button></footer></aside></div>`);
$('#rv').addEventListener('click',e=>{if(e.target.id==='rv')closeRv()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#rv').classList.contains('on'))closeRv()});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.amt!==undefined){const r=rows[d.amt];let v=+e.target.value||r.amt;r.amt=Math.max(1,r.unit==='pcs'?Math.round(v):v);r.frz=Math.min(r.frz,r.amt);sync(+d.amt)}if(d.ub!==undefined&&e.target.value){rows[d.ub].useby=e.target.value;sync(+d.ub)}});

render();
</script></body></html>
