// ---- fake data: one entry per meal. ing drives "reuses the mince/rice" shaping.

 if(plain&&!placed.length&&!S.seen.has('dal'))picked=['dal','chilli','gnocchi'].map(i=>M.find(m=>m.id==i));
 else{const fresh=pool.filter(m=>!S.seen.has(m.id));if(plain&&fresh.length>=3)pool=fresh;
  const sc=m=>m.ing.filter(x=>have.has(x)).length*2+(hit(m)?10:0)+(quick?(60-m.mins)/10:0)+(cheap?10-m.cost:0)+(plain&&S.seen.has(m.id)?-1:0);
  let nw=0;picked=[...pool].sort((a,b)=>sc(b)-sc(a)).filter(m=>m.kind!='new'||nw++<1).slice(0,3)}
 picked.forEach(m=>S.seen.add(m.id));
 const opts=picked.map(m=>{const sh=m.ing.filter(x=>have.has(x)).slice(0,2),src=sh.length&&placed.find(n=>n.ing.includes(sh[0]));
  return{...m,state:'idle',ctx,at:typeof ctx=='number'?ctx:null,why:sh.length?`Reuses the ${sh.join('/')} from ${src.short} on ${dn(src.at)}`:m.why}});
 const L=S.last!=null&&S.nights[S.last],pre=S.target!=null&&!S.nights[S.target]?dl(S.target)+': ':(typeof ctx=='number'?dl(ctx)+': ':'');
 let t;
 if(words.length)t=hits?`${words[0][0].toUpperCase()+words[0].slice(1)} it is. Three ideas:`:`Nothing in the library says "${raw.trim().slice(0,30)}". Closest three:`;
 else if(quick)t='Quickest first:';else if(cheap)t='Cheapest first:';
 else if(L){const u=new Set(opts.flatMap(o=>o.ing)),sh=L.ing.filter(x=>u.has(x)).slice(0,2);t=sh.length?`Since you have ${L.short} on ${dn(S.last)}, how about these that reuse the ${sh.join('/')}?`:'Three more:'}
 else t='Here are three to start with.';
 return{text:pre+t,opts}}
function send(ctx,text){text=text.trim();if(!text)return;add(ctx,{t:'u',text});const r=round(text,ctx);hermes(ctx,r.text,r.opts)}
function setTarget(i,ctx){S.target=i;ev('mp-change');const n=S.nights[i],r=round('',ctx);
 hermes(ctx,n?`${dl(i)} is ${n.short} now. Three alternatives:`:r.text,r.opts)}
S.afterPlace=o=>{if(nFilled()==S.days)return hermes(o.ctx,'Every night is filled. Save when you are happy.');
 const over=S.budget&&spent()>S.budget&&!S.warned;if(over)S.warned=true;const r=round('',o.ctx);hermes(o.ctx,(over?'That passes your reminder, no problem. ':'')+r.text,r.opts)};
// ---- option cards
const tier=c=>c<5?1:c<7?2:3,dst=o=>o.at!=null?o.at:(S.target!=null?S.target:firstEmpty());
function cardEl(o){const c=el('article','mc card');o.el=c;paint(o);
 c.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){act(o,b.dataset.a);paint(o);const f=$('.acts button',c);f&&f.focus()}});return c}
function paint(o){const d=o.state=='idle'?dst(o):o.d,n=d>=0?S.nights[d]:null;let a;
 if(o.state=='add')a=`<span class="q">Save "${esc(o.name)}" to your library as a draft?</span><button class="btn pri sm" data-a="add">Add</button><button class="btn sm" data-a="no">No</button>`;
 else if(o.state=='rep')a=`<span class="q">Replace ${esc(n?n.short:'')} on ${dl(d)}?</span><button class="btn pri sm" data-a="rep">Replace</button><button class="btn sm" data-a="keep">Keep</button>`;
 else if(o.state=='placed')a=`<span class="ok">${ic('check')} Placed on ${dl(o.d)}</span><button class="btn ghost sm" data-a="undo">Undo</button>`;
 else if(o.state=='no')a='<span class="dim">Not added</span>';
 else a=`<button class="btn pri" data-a="place" aria-label="Place ${esc(o.name)}${d>=0?' on '+dl(d):''}">Place</button>`;
 o.el.dataset.st=o.state;
 o.el.innerHTML=`<div class="mh"><span class="chip ${o.kind}">${esc(o.tag||TG[o.kind])}</span><span class="cb c${tier(o.cost)}" aria-label="Cost £${o.cost.toFixed(2)}">£${o.cost.toFixed(2)}</span><span>${ic('clock')}</span><span style="margin-left:-.3rem">${o.mins} min</span>${o.state=='idle'&&d>=0?`<span class="dest">to ${dl(d)}</span>`:''}</div><h3>${esc(o.name)}</h3><p class="why">${esc(o.why)}</p><div class="acts">${a}</div>`;
 $$('.mh .ic',o.el).forEach(i=>i.style.cssText='width:1rem;height:1rem')}
function go(o){const d=dst(o);if(d<0){hermes(o.ctx,'Every night is filled. Tap one to replace it.');return}o.d=d;if(S.nights[d])o.state='rep';else commit(o,d)}
function commit(o,d){const old=S.nights[d];if(old&&old.opt){old.opt.state='idle';paint(old.opt)}
 S.nights[d]={id:o.id,name:o.name,short:o.short,ing:o.ing,cost:o.cost,mins:o.mins,kind:o.kind,tag:o.tag,at:d,opt:o};
 Object.assign(o,{state:'placed',d});S.last=d;S.target=null;S.placed=d;ev('mp-change');ev('mp-placed');S.afterPlace(o)}
function act(o,a){
 if(a=='place')o.kind=='new'?o.state='add':go(o);
 else if(a=='add')go(o);else if(a=='no')o.state='no';else if(a=='keep')o.state='idle';
 else if(a=='rep')commit(o,o.d);
 else if(a=='undo'){S.nights[o.d]=null;o.state='idle';ev('mp-change')}}
// ---- meters, dialogs, header actions
function meters(){const s=spent(),b=S.budget,over=b&&s>b;
 $$('[data-cost]').forEach(e=>{e.className='cost'+(over?' over':'');e.innerHTML=`<b>£${Math.round(s)}</b>`+(over?` of £${b} · £${Math.round(s-b)} over`:b?` of £${b} reminder`:' planned')});
 $$('[data-prog]').forEach(e=>e.textContent=nFilled()+' of '+S.days+' nights');
 $$('[data-pbar]').forEach(e=>e.firstElementChild.style.width=nFilled()/S.days*100+'%')}
document.addEventListener('mp-change',()=>{meters();Object.values(S.th).flat().forEach(m=>(m.opts||[]).forEach(o=>o.state=='idle'&&o.el&&paint(o)))});
function dlg(html,btns){const ov=el('div','ov'),d=el('div','dlg card');d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.innerHTML=html+'<div class="acts"></div>';ov.append(d);
 btns.forEach(([t,c,fn])=>{const b=el('button','btn '+c,t);b.onclick=()=>{ov.remove();fn&&fn()};$('.acts',d).append(b)});
 ov.addEventListener('keydown',e=>e.key=='Escape'&&ov.remove());document.body.append(ov);$('.btn.pri',d).focus()}
const wrap=()=>{const f=nFilled(),e=S.days-f,s=Math.round(spent()),b=S.budget;return`${f} of ${S.days} nights planned${e?`, ${e} left empty`:''}. £${s}${b?` of your £${b} reminder${s>b?` (£${s-b} over, only a reminder)`:''}`:' planned'}.`};
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]'),q=e.target.closest('[data-q]');
 if(q)send(S.ctx,q.dataset.q);
 if(!a)return;const k=a.dataset.act;
 if(k=='theme'){const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;sessionStorage.th=t}
 if(k=='exit')dlg('<h2>Leave without saving?</h2><p>Nothing from this chat is kept.</p>',[['Stay',''],['Leave','pri',()=>location.reload()]]);
 if(k=='save')dlg(`<h2>Save this plan?</h2><p>${wrap()}</p>`,[['Keep planning',''],['Save','pri',()=>dlg('<h2>Saved</h2><p>Hermes has your plan. Happy cooking.</p>',[['Done','pri',()=>location.reload()]])]])});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-comp]');if(!f)return;e.preventDefault();const i=$('input',f);send(S.ctx,i.value);i.value=''});
if(sessionStorage.th)document.documentElement.dataset.theme=sessionStorage.th;
// ---- setup screen (the only form: start date, days, budget reminder)
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const tm=new Date();tm.setDate(tm.getDate()+1);
$('#setup').innerHTML=`<form class="setup card" id="sf" novalidate><h2>Plan a block of dinners</h2>
<div class="fld"><label for="sd">Start date</label><input class="inp" id="sd" type="date" min="${iso(new Date())}" value="${iso(tm)}"></div>
<div class="fld"><label for="sn">Number of days</label><div class="step"><button type="button" class="ib" data-s="-1" aria-label="One fewer day">${ic('minus')}</button><input class="inp" id="sn" type="number" min="1" max="28" value="14" inputmode="numeric"><button type="button" class="ib" data-s="1" aria-label="One more day">${ic('plus')}</button></div><small>1 to 28 nights.</small></div>
<div class="fld"><label for="sb">Budget reminder</label><div class="money"><span>£</span><input class="inp" id="sb" type="number" min="0" step="5" value="75" inputmode="decimal"></div><small>A reminder for Hermes, not a limit. Nothing is ever blocked.</small></div>
<div class="err" id="se" role="alert"></div><button class="btn pri lg" type="submit">Continue</button></form>`;
const clampN=()=>{const i=$('#sn');let v=Math.round(+i.value);const bad=!(v>=1&&v<=28);v=Math.min(28,Math.max(1,v||14));i.value=v;$('#se').textContent=bad?'Days must be 1 to 28, set to '+v+'.':'';return v};
$('#sf').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){$('#sn').value=+$('#sn').value+ +b.dataset.s;clampN()}});
$('#sn').addEventListener('change',clampN);
$('#sf').addEventListener('submit',e=>{e.preventDefault();const n=clampN();let d=new Date($('#sd').value+'T12:00');const t=new Date();t.setHours(0,0,0,0);if(isNaN(d)||d<t)d=new Date();
 S.start=d;S.days=n;S.budget=Math.max(0,+$('#sb').value||0);S.nights=Array(n).fill(null);
 document.body.classList.add('building');$('#setup').hidden=true;$('#build').hidden=false;meters();ev('mp-start')});


let opener=null;
function open(ctx,title){$('#st').textContent=title;S.target=ctx=='week'?null:ctx;mount($('#thread'),ctx);
 if(!S.th[ctx]){ctx=='week'?greet(ctx):(()=>{const n=S.nights[ctx],r=round('',ctx);hermes(ctx,n?`${dl(ctx)} is ${n.short} now. Three alternatives:`:r.text,r.opts)})()}
 document.body.classList.add('sheet-open');$('#sheet').inert=false;setTimeout(()=>$('#sx').focus(),50)}
function close(){document.body.classList.remove('sheet-open');$('#sheet').inert=true;S.view=null;S.target=null;opener&&opener.focus()}
function paintList(){const h=[];for(let i=0;i<S.days;i++){if(i%7==0)h.push(`<h2>Week ${i/7+1}</h2>`);const n=S.nights[i];
 h.push(`<button class="nb ${n?'':'empty'} ${S.placed==i&&n?'flash':''}" data-i="${i}"><span class="d"><small>${dn(i)}</small><b>${day(i).getDate()}</b></span><span class="m">${n?`<b>${esc(n.name)}</b><small>${n.mins} min · £${n.cost.toFixed(2)} · ${esc(n.tag||TG[n.kind])}</small>`:'<b>Empty night</b><small>Ask Hermes for ideas</small>'}</span><span class="go">${n?'Change':'Plan'} &rsaquo;</span></button>`)}
 $('#list').innerHTML=h.join('');S.placed=null}
document.addEventListener('mp-change',paintList);
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){opener=b;const i=+b.dataset.i;open(i,dl(i)+(S.nights[i]?' - '+S.nights[i].short:''))}});
$('#fab').onclick=e=>{opener=e.currentTarget;open('week','Whole week')};
$('#sx').onclick=close;$('#scrim').onclick=close;
$('#sheet').addEventListener('keydown',e=>e.key=='Escape'&&close());
S.afterPlace=o=>{if(typeof o.ctx=='number'){const d=o.d;setTimeout(()=>{close();toast(`Placed ${o.short} on ${dl(d)}`)},600)}else{const r=round('',o.ctx);hermes(o.ctx,nFilled()==S.days?'Every night is filled. Save when you are happy.':r.text,nFilled()==S.days?undefined:r.opts)}};
document.addEventListener('mp-start',paintList);
</script></body></html>
