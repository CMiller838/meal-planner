<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinner board A: Tonight hero and timeline</title>
<style>
:root,[data-theme="dark"]{--bg:#1c1410;--bg-2:#26190f;--surface:#241a13;--surface-alt:#2c2018;--text:#f3e6d4;--text-dim:#c9b79f;--accent:#d4633b;--accent-2:#7a9a6b;--butter:#e8b74a;--danger:#ff6b4a;--border:#4a382b;--shadow:rgba(15,9,5,.45);--radius:18px;--on-accent:#fff;--on-butter:#3a2a10;--accent-hover:#b94f2c;--accent-glow:rgba(212,99,59,.5);--on-cork:#fff6ea;--scrim:rgba(0,0,0,.55);--motion-base:180ms;--motion-exit:120ms;--ease-lift:cubic-bezier(.2,.9,.3,1.4);--tabbar-h:3.5rem;--ph-l:34%}
[data-theme="light"]{--bg:#6b4f3a;--bg-2:#7a5c44;--surface:#fdf6ec;--surface-alt:#f7ecda;--text:#2b1d14;--text-dim:#6b5847;--accent:#d4633b;--accent-2:#5c8a4c;--butter:#e8b74a;--danger:#c1421a;--border:#e3d3ba;--shadow:rgba(43,29,20,.18);--ph-l:62%}
*{box-sizing:border-box}

@media(max-width:639px){.nav{backdrop-filter:none}.tabs{position:fixed;inset:auto 0 0 0;height:var(--tabbar-h);z-index:40;justify-content:space-around;align-items:center;background:var(--bg-2);border-top:1px solid var(--border);padding:0 .25rem env(safe-area-inset-bottom)}.tabs a{padding:.5rem .5rem;font-size:.82rem;min-height:44px;display:flex;align-items:center}}

.mrow .l{display:flex;justify-content:space-between}
.bar{height:.55rem;border-radius:99px;background:var(--surface-alt);border:1px solid var(--border);overflow:hidden}

.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

.swapnote .btn{min-height:36px;padding:.1rem .6rem}
[data-pick]{scroll-margin-top:5rem}[data-drag]{cursor:grab}[data-drag].dragging{opacity:.4}[data-drag].over{outline:3px dashed var(--butter);outline-offset:3px}
.swapping [data-pick]{cursor:copy}
.swapsrc{outline:3px solid var(--butter);outline-offset:2px}
.grip{color:var(--text-dim);letter-spacing:-.1em;user-select:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-property:opacity,background,color!important;transition-duration:.15s!important;scroll-behavior:auto!important}.btn:hover,.ib:hover{transform:none!important}}

.wrap{display:grid;gap:1.25rem}
@media(min-width:900px){.wrap{grid-template-columns:420px 1fr;align-items:start}.side{position:sticky;top:4.5rem}}
.side{display:grid;gap:1rem}
.hero{position:relative;overflow:hidden;animation:rise .4s var(--ease-lift) both}
.hero .ph{height:210px}
.hero .tag{position:absolute;left:.8rem;top:.8rem;background:var(--accent);color:var(--on-accent);font-weight:800;padding:.25rem .7rem;border-radius:999px;font-size:.8rem}
.hero .hb{padding:1rem;display:grid;gap:.6rem}
.hero h2{font-size:1.5rem;line-height:1.15}
.hero .mt{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:center;font-weight:700}
.hero .note{background:var(--surface-alt);border-left:4px solid var(--butter);padding:.5rem .7rem;border-radius:.5rem;font-size:.9rem}
.hero .acts .btn{flex:1 1 auto}.hero .acts .pri{flex-basis:100%;font-size:1.05rem}
.mcard{padding:1rem}.mcard h3{font-size:1rem;margin-bottom:.6rem}
.tl{position:relative;display:grid;gap:.6rem}
.tl::before{content:"";position:absolute;left:1.35rem;top:0;bottom:0;border-left:2px dashed color-mix(in srgb,var(--on-cork) 40%,transparent)}
.tl li{position:relative;padding-left:3.6rem;animation:rise .3s ease-out both;animation-delay:calc(var(--i,0)*30ms)}
.node{position:absolute;left:0;top:.55rem;width:2.7rem;height:2.7rem;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface);border:3px solid var(--border);z-index:1;transition:transform var(--motion-base) var(--ease-lift)}
.tl li:hover .node{transform:scale(1.08)}
.st-eaten .node{border-color:var(--accent-2)}.st-skipped .node{border-color:var(--danger);color:var(--danger)}.st-out .node{border-color:var(--butter)}
.today .node{background:var(--accent);color:var(--on-accent);border-color:var(--pin-hi,var(--accent))}
.lk::after{content:"";position:absolute;left:1.15rem;width:.45rem;top:3rem;bottom:-1.1rem;background:var(--butter);border-radius:4px;z-index:0}
.tc{overflow:hidden;transition:transform var(--motion-base),box-shadow var(--motion-base)}
.tc:hover{transform:translateX(3px);box-shadow:0 8px 18px var(--shadow)}
.past{opacity:.7}
.tc-h{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr;gap:.1rem .6rem;width:100%;padding:.7rem .85rem;cursor:pointer;min-height:44px}
.tc-h:focus-visible{outline:3px solid var(--butter);outline-offset:-3px}
.tc-h .d{grid-column:2;font-size:.8rem;color:var(--text-dim);display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.tc-h .d b{color:var(--text)}
.tc-h .grip{grid-row:1/4;align-self:center}
.tc-h .n{grid-column:2;font-weight:800}
.st-skipped .n{text-decoration:line-through}
.tc-h .m{grid-column:2;font-size:.85rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.tc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease-out}
.tc-b>div{overflow:hidden;min-height:0}
.open .tc-b{grid-template-rows:1fr}
.tc-b .in{padding:0 .85rem .85rem;display:grid;gap:.5rem}
.cl{color:var(--accent-2);font-weight:800;font-size:.8rem}
.empty-sw{font-size:.85rem}
</style></head><body>

<header class="nav"><a class="brand" href="#">Meal Planner</a>
<nav class="tabs" aria-label="Main"><a href="#">Browse</a><a href="#">Discover</a><a href="#" aria-current="page">Plan</a><a href="#" data-go="shop">Shopping</a><a href="#">Eaten</a></nav>
<button class="ib" id="theme" aria-label="Toggle dark or light theme">&#9680;</button></header>

<main>
<div class="top"><div><h1>Dinners, 14 nights</h1><p>Thu 29 Oct to Wed 11 Nov &middot; one dinner per night</p></div>
<div class="top-actions"><button class="btn pri" data-go="hermes">Plan with Hermes</button><button class="btn" data-go="gen">Generate</button><button class="btn" data-go="shop">Shopping list</button></div></div>
<div class="swapnote" role="status"><span id="swaptxt">Pick the night to swap with</span><button class="btn sm" data-cancel>Cancel</button></div>

<div class="wrap"><div class="side"><section id="hero" aria-label="Tonight"></section>
<section class="card mcard" aria-labelledby="mh"><h3 id="mh">This week's nutrient coverage <span class="dim">(Sun 1 to Sat 7)</span></h3><div class="meter"></div></section></div>
<section aria-labelledby="tlh"><h2 class="sr" id="tlh">All 14 nights</h2><ol class="tl" id="tl"></ol></section></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const START=new Date(2026,9,29),TODAY=3,BUSY=[5,11],SHOP=[0,7];
const D=i=>{const d=new Date(START);d.setDate(d.getDate()+i);return d};
const wd=i=>D(i).toLocaleDateString('en-GB',{weekday:'short'}),wdl=i=>D(i).toLocaleDateString('en-GB',{weekday:'long'}),dt=i=>D(i).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
// [id,name,min,cost,servings,tags,hue,from]
const RAW=[[0,'Chicken & chorizo traybake',45,3,4,['Protein','Vit C','Iron'],20],[1,'Traybake leftovers',10,1,1,['Protein','Vit C'],20,0],[2,'Veg lasagne',55,2,4,['Calcium','Fibre'],45],
[3,'Beef ragu & wholewheat pasta',75,2,4,['Iron','Fibre','Protein'],10],[4,'Ragu leftovers',10,1,1,['Iron','Fibre'],10,3],[5,'Ragu leftovers',10,1,1,['Iron','Fibre'],10,3],
[6,'Salmon, sweet potato & greens',30,2,2,['Omega-3','Vit C','Fibre'],170],[7,'Chickpea & spinach curry',35,1,4,['Fibre','Iron','Calcium'],95],[8,'Curry leftovers',10,1,1,['Fibre','Iron'],95,7],
[9,'Homemade pizza night',45,2,2,['Calcium','Protein'],35],[10,'Roast chicken & veg',90,3,4,['Protein','Vit C'],50],[11,'Roast chicken & veg soup',20,1,1,['Protein','Vit C'],50,10],
[12,'Veg stir-fry noodles',20,1,2,['Vit C','Fibre'],130],[13,'Fish pie',50,2,2,['Omega-3','Calcium','Protein'],210]];
const mk=r=>({id:r[0],n:r[1],m:r[2],c:r[3],s:r[4],t:r[5],h:r[6],from:r[7]});
let N=RAW.map(r=>({m:mk(r),st:'plan',lock:false}));
N[0].st='eaten';N[1].st='eaten';N[2].st='out';N[2].o='Pizza with Sam';N[6].lock=true;N[12].st='skipped';
const CN=['','Budget','Mid','Treat'];
const src=i=>N[i].m.from??N[i].m.id,srcIdx=i=>N.findIndex(x=>x.m.id===src(i)),mem=i=>N.map((x,k)=>k).filter(k=>src(k)===src(i));
const lkNext=i=>i<13&&mem(i).length>1&&src(i+1)===src(i);
const nm=i=>N[i].st==='out'?(N[i].o||'Eating out'):N[i].m.n;
const eff=m=>m<=20?'Quick':m<=50?'Medium':'Project';
const orphan=i=>N[i].m.from!==undefined&&['skipped','out'].includes(N[srcIdx(i)].st);
const chainLbl=i=>{const m=N[i].m,k=mem(i).length-1;if(N[i].st==='out')return'';if(m.from!==undefined)return orphan(i)?'No cook: source night skipped':'Leftover of '+wd(srcIdx(i))+' '+dt(srcIdx(i));return m.s>1&&k?'Batch x'+m.s+' &middot; '+k+' leftover night'+(k>1?'s':''):''};
const noteTxt=i=>{const m=N[i].m;if(N[i].st==='out')return'Estimate logged when you tell Hermes what you had.';if(m.from!==undefined)return orphan(i)?'The cook night was skipped, so this has nothing to reheat.':'Leftovers from '+wdl(srcIdx(i))+' '+dt(srcIdx(i))+'. Reheat 10 min, nothing to buy.';const k=mem(i).filter(x=>x!==i).map(x=>wd(x)+' '+dt(x));return k.length?'Batch cook: makes '+m.s+' portions. Leftovers on '+k.join(' and ')+'.':'Cooked fresh, no leftovers planned.'};
const plate='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26"/><circle cx="32" cy="32" r="16"/><path d="M4 8v18M9 8v18M14 8v18M9 26v30"/></svg>';
const ph=(i,cls='')=>`<div class="ph ${cls} ${N[i].st==='out'?'out':''}" style="--h:${N[i].m.h}" role="img" aria-label="Photo placeholder for ${nm(i)}">${plate}</div>`;
const costB=c=>`<span class="cost" title="${CN[c]}">${'£'.repeat(c)}<span class="sr"> ${CN[c]}</span></span>`;
const stBd=i=>{const n=N[i],o=[];if(n.st==='eaten')o.push('<span class="bd eaten">Eaten</span>');if(n.st==='skipped')o.push('<span class="bd skipped">Skipped</span>');if(n.st==='out')o.push('<span class="bd out">Eating out</span>');if(n.lock)o.push('<span class="bd locked">Locked</span>');if(orphan(i))o.push('<span class="bd warn">No cook</span>');return o.join(' ')};
const markers=i=>(SHOP.includes(i)?'<span class="bd shop">Shop day</span> ':'')+(BUSY.includes(i)?'<span class="bd busy">Busy day</span> ':'');
const chips=i=>N[i].st==='out'?'':`<span class="chips">${N[i].m.t.map(t=>`<span class="chip">${t}</span>`).join('')}</span>`;
const actsHTML=(i,sm='sm')=>{const n=N[i];if(n.st!=='plan')return`<button class="btn ${sm}" data-act="again" data-i="${i}">${n.st==='eaten'?'Mark not eaten':'Plan this night again'}</button>`+(n.st!=='eaten'?'':'')
 +`<button class="btn ${sm}" data-act="lock" data-i="${i}" aria-pressed="${n.lock}">${n.lock?'Locked':'Lock'}</button>`;
 return`<button class="btn pri ${sm}" data-act="cook" data-i="${i}" ${i!==TODAY?'disabled title="Only tonight can be cooked now"':''}>Cook now</button>`
 +`<button class="btn ${sm}" data-act="swap" data-i="${i}">Swap</button><button class="btn ${sm}" data-act="skip" data-i="${i}">Skip</button><button class="btn ${sm}" data-act="out" data-i="${i}">Eating out</button>`
 +`<button class="btn ${sm}" data-act="ate" data-i="${i}" ${i>TODAY?'disabled title="Not eaten yet"':''}>I ate it</button><button class="btn ${sm}" data-act="lock" data-i="${i}" aria-pressed="${n.lock}">${n.lock?'Locked':'Lock'}</button>`};
/* meter: display-only, nights today..+6 with 3 hits = covered */
const NUT=['Protein','Fibre','Iron','Vit C','Omega-3','Calcium'];
$$('.meter').forEach(m=>m.innerHTML=NUT.map((t,k)=>`<div class="mrow"><div class="l"><span>${t}</span><span data-v="${k}"></span></div><div class="bar" role="progressbar" aria-label="${t} coverage" aria-valuemin="0" aria-valuemax="100"><i data-b="${k}"></i></div></div>`).join(''));
function updMeter(){NUT.forEach((t,k)=>{let c=0;for(let i=TODAY;i<TODAY+7;i++)if(['plan','eaten'].includes(N[i].st)&&N[i].m.t.includes(t))c++;const p=Math.min(100,Math.round(c/3*100));$$(`[data-b="${k}"]`).forEach(b=>{b.style.width=p+'%';b.classList.toggle('low',p<67);b.parentNode.setAttribute('aria-valuenow',p)});$$(`[data-v="${k}"]`).forEach(v=>v.textContent=p+'%'+(p<67?' gap':''))})}
/* state */
let snap=null,swapFrom=null,tt;
function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${msg}</span>`+(undo?'<button class="btn sm" data-undo>Undo</button>':'');t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),undo?6000:3200)}
function R(f){const a=document.activeElement,fi=f??a?.dataset?.pick;render();updMeter();document.body.classList.toggle('swapping',swapFrom!==null);if(fi!==undefined&&fi!==null)$(`[data-pick="${fi}"]`)?.focus({preventScroll:true})}
function mut(fn,msg){snap=JSON.stringify(N);fn();toast(msg,true);R()}
function trySwap(i,j){if(i===j)return;const bad=[i,j].find(k=>N[k].lock||N[k].st==='eaten'||N[k].st==='out');if(bad!==undefined){toast(wd(bad)+' is '+(N[bad].lock?'locked':N[bad].st==='out'?'eating out':'already eaten')+', so it stays put.');swapFrom=null;return R()}
 snap=JSON.stringify(N);[N[i],N[j]]=[N[j],N[i]];if(N.some((x,k)=>x.m.from!==undefined&&srcIdx(k)>k)){N=JSON.parse(snap);toast('Not swapped: a leftover cannot come before its cook night.');swapFrom=null;return R()}
 swapFrom=null;toast(wd(i)+' and '+wd(j)+' swapped. No re-flow, pantry untouched.',true);R(j)}
function doAct(a,i){const n=N[i];
 if(a==='cook')return toast('Cook mode: '+nm(i)+', step 1 of 7. Oven to 200C.');
 if(a==='swap'){swapFrom=i;$('#swaptxt').textContent='Swapping '+wd(i)+' '+dt(i)+'. Tap or drop on the other night (or Alt+Arrow keys).';toast('Pick the night to swap with');return R()}
 if(a==='skip')return mut(()=>n.st='skipped',wd(i)+' skipped.');
 if(a==='out')return mut(()=>{n.st='out';n.o=n.o||'Eating out'},wd(i)+' marked eating out.');
 if(a==='ate')return mut(()=>n.st='eaten',nm(i)+' logged as eaten.');
 if(a==='lock')return mut(()=>n.lock=!n.lock,wd(i)+(n.lock?' unlocked.':' locked.'));
 if(a==='again')return mut(()=>n.st='plan',wd(i)+' back in the plan.')}
const GO={hermes:'Opening Plan with Hermes (prototype: no chat here).',gen:'Generated: 9 free nights re-flowed, locked and eaten nights kept.',shop:'Shopping list: 23 items for the nights still to cook.'};
document.addEventListener('click',e=>{const a=e.target.closest('a[href="#"]');if(a)e.preventDefault();
 const g=e.target.closest('[data-go]');if(g){toast(GO[g.dataset.go]);if(g.dataset.go==='gen'){const m=$('main');m.style.animation='none';m.offsetWidth;m.style.animation=''}return}
 if(e.target.closest('[data-undo]')){if(snap){N=JSON.parse(snap);snap=null;$('#toast').classList.remove('on');R()}return}
 if(e.target.closest('[data-cancel]')){swapFrom=null;return R()}
 const b=e.target.closest('[data-act]');if(b){if(!b.disabled)doAct(b.dataset.act,+b.dataset.i);return}
 const t=e.target.closest('[data-pick]');if(t){const i=+t.dataset.pick;if(swapFrom!==null)trySwap(swapFrom,i);else onSelect(i)}});

 const t=e.target.closest?.('[data-pick]');if(t&&e.altKey&&e.key.startsWith('Arrow')){e.preventDefault();const i=+t.dataset.pick,s=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:(e.key==='ArrowUp'?-1:1)*(typeof VSTEP==='number'?VSTEP:1);if(i+s>=0&&i+s<14)trySwap(i,i+s)}});

document.addEventListener('dragover',e=>{const d=e.target.closest('[data-drag]');if(d&&dragI!==null){e.preventDefault();$$('.over').forEach(x=>x.classList.remove('over'));d.classList.add('over')}});
document.addEventListener('drop',e=>{const d=e.target.closest('[data-drag]');if(d&&dragI!==null){e.preventDefault();const j=+d.dataset.drag,i=dragI;dragI=null;trySwap(i,j)}});
document.addEventListener('dragend',()=>{dragI=null;$$('.over,.dragging').forEach(x=>x.classList.remove('over','dragging'))});

 first=false}
