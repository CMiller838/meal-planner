<style>

<script>

const e=h(`<div class="fin"><div class="card fc hd"><span class="okc">${CHECK}</span><h2>Nicely done</h2><p class="dim">${R.name}, serves ${R.serves}.</p></div>
<div class="card fc"><h3 id="h1">How much did you eat?</h3><div class="seg" role="group" aria-labelledby="h1">${[.5,1,1.5,2].map(v=>`<button type="button" data-p="${v}" aria-pressed="${v===1}">${v}</button>`).join('')}</div></div>
<div class="card fc"><h3>Keep the rest?</h3><button type="button" class="tg" id="kt" aria-pressed="true" style="justify-self:start">Keep leftovers</button><div class="fc" id="kb" style="padding:0;box-shadow:none"><p class="dim" id="kl"></p><div class="stp"><button type="button" class="ib" data-k="-1" aria-label="Keep one fewer portion">&minus;</button><output id="kn" aria-live="polite"></output><button type="button" class="ib" data-k="1" aria-label="Keep one more portion">+</button></div><div class="seg" role="group" aria-label="Where to keep it">${['Fridge','Freezer'].map(s=>`<button type="button" data-s="${s}" aria-pressed="${s==='Fridge'}">${s}</button>`).join('')}</div><p class="dim" id="ub"></p></div></div>
<button type="button" class="btn pri lg" id="ate">I ate it</button>${back?'<button type="button" class="btn lg ghost" id="fb">Back to the last step</button>':''}</div>`);
const q=s=>e.querySelector(s),pl=n=>n+' portion'+(n===1?'':'s'),useBy=()=>F.store==='Fridge'?'Use by Sun 1 Nov':'Freezer: use within 3 months';
const up=()=>{F.k=Math.min(Math.max(F.k,0),max());q('#kl').textContent=pl(max())+' left after your portion.';q('#kn').textContent=F.k;q('[data-k="-1"]').disabled=F.k<=0;q('[data-k="1"]').disabled=F.k>=max();q('#kb').hidden=!F.keep;q('#kt').setAttribute('aria-pressed',F.keep);q('#ub').textContent=useBy()+'. Opens a Cooks record.';e.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.p===F.p));e.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===F.store))};
e.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.p){F.p=+b.dataset.p;F.k=max()}if(b.dataset.k)F.k+=+b.dataset.k;if(b.dataset.s)F.store=b.dataset.s;if(b.id==='kt'){F.keep=!F.keep}if(b.id==='fb')back();if(b.id==='ate')done();up()};
function done(){const keep=F.keep&&F.k>0;host.textContent='';const d=h(`<div class="fin"><div class="card fc hd"><span class="okc">${CHECK}</span><h2>Logged</h2><p>${pl(F.p)} added to Eaten.</p>${keep?`<p>${pl(F.k)} kept in the ${F.store.toLowerCase()}. ${useBy()}. Hermes can plan them as leftovers.</p>`:'<p class="dim">Leftovers are not tracked.</p>'}</div><div class="acts2"><button type="button" class="btn lg" id="un">Undo</button><button type="button" class="btn pri lg" id="hm">Back to Tonight</button></div></div>`);host.append(d);
d.querySelector('#un').onclick=()=>showFinish(host,back);d.querySelector('#hm').onclick=()=>toast('Would return to Tonight in the real app')}
host.append(e);up()}
addEventListener('keydown',e=>{if(e.target.matches('textarea,input:not([type=checkbox])'))return;if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key==='Escape')closeAll()});
$('#exit').onclick=()=>toast('Would leave cook mode; nothing is logged');
let now=$('#now');
function render(){const s=R.steps[cur],p=R.steps[cur-1],n=R.steps[cur+1];$('#sc').textContent=`Step ${cur+1} of ${N}`;
$('#pk').hidden=!p;if(p)$('#pk').innerHTML=`${I('l')}<span><small>Step ${cur}</small>${p.h}</span>`;
$('#nk').hidden=!n;if(n)$('#nk').innerHTML=`<span><small>Next, step ${cur+2}</small>${n.h}</span>${I('r')}`;
now.innerHTML=`<p class="sn">Step ${cur+1} of ${N}</p><h1>${s.h}</h1><p class="sb">${s.b}</p>${needHTML(s)}${s.timer?`<div class="ringw"><div class="ring" id="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="rt" cx="60" cy="60" r="54"/><circle class="rp" id="rp" cx="60" cy="60" r="54" transform="rotate(-90 60 60)"/></svg><div class="rc"><output class="tv" id="tv"></output><span class="dim">${s.timer.label}</span></div></div><div class="tbt"><button type="button" class="btn pri lg" id="tgl"></button><button type="button" class="btn lg" id="more">+1 min</button><button type="button" class="btn lg ghost" id="rst">Reset</button></div></div>`:''}`;
now.style.setProperty('--dy',dir*26+'px');now.style.animation='none';void now.offsetWidth;now.style.animation='';
$('#prev').style.visibility=cur?'visible':'hidden';$('#next').textContent=cur===N-1?'Finish':'Next step';$('#il').innerHTML=ingHTML();onHave();
const rp=$('#rp');if(rp)rp.style.transition='none';renderT();if(rp){void rp.getBoundingClientRect();rp.style.transition=''}}
function renderT(){const t=R.steps[cur].timer&&tm(cur);if(!t||!$('#tv'))return;$('#tv').textContent=fmt(t.left);$('#tgl').textContent=tlabel(t);$('#rp').style.strokeDashoffset=339.3*(1-t.left/t.total);$('#ring').classList.toggle('done',t.done);$('#ring').classList.toggle('flashd',t.done)}
now.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='tgl')tgl(cur);if(b.id==='more')more(cur);if(b.id==='rst')rst(cur)};
function go(i){dir=i>cur?1:-1;cur=i;render()}
const fin=()=>$('#stack').dataset.fin;
function next(){if(fin())return;if(cur<N-1)go(cur+1);else{$('#stack').dataset.fin=1;$('#foot').hidden=true;$('#sc').textContent='Finished';showFinish($('#stack'),()=>{delete $('#stack').dataset.fin;$('#foot').hidden=false;$('#stack').innerHTML='<button type="button" class="peek" id="pk"></button><article class="card now" id="now" aria-live="polite"></article><button type="button" class="peek" id="nk"></button>';rebind();render()})}}
function prev(){if(!fin()&&cur>0)go(cur-1)}
function rebind(){$('#pk').onclick=prev;$('#nk').onclick=next;const nw=$('#now');nw.onclick=now.onclick;now=nw;swipe(nw,next,prev)}
$('#pk').onclick=prev;$('#nk').onclick=next;$('#next').onclick=next;$('#prev').onclick=prev;swipe(now,next,prev);
function onHave(){$('#gc').textContent=have.size+'/'+ING.length}
const sd=$('#side'),ov=$('#ov');function openD(){sd.classList.add('on');ov.classList.add('on');$('#dx').focus()}function closeAll(){sd.classList.remove('on');ov.classList.remove('on')}
$('#ingb').onclick=openD;ov.onclick=closeAll;$('#dx').onclick=()=>{closeAll();$('#ingb').focus()};sheetDrag($('#gh'),sd,closeAll);
wake(true);render();
</script></body></html>
