let M=[
{id:1,n:'Chicken & chorizo traybake',d:'One tray, smoky and crisp-edged. Cooks while you do something else, and the leftovers reheat well.',m:45,c:3,s:4,t:['Protein','Vit C','Iron'],h:20,vars:[['Standard',''],['Veggie','Swap chicken and chorizo for chickpeas and smoked paprika.'],['Lighter','Skip the chorizo, add extra peppers.']],lo:'Batch cook: 4 portions. Next two nights are leftovers (reheat 10 min).',ing:[['Chicken thighs','8',1],['Chorizo','150 g',0],['Baby potatoes','600 g',1],['Red peppers','3',0],['Red onion','2',1],['Olive oil','3 tbsp',1],['Smoked paprika','2 tsp',1]],steps:['Heat the oven to 200C (180C fan).','Chop potatoes into chunky halves and the peppers and onions into wedges. Tip everything onto a large tray.','Add chicken and sliced chorizo, drizzle with oil and paprika, season and toss.','Roast for 35 to 40 minutes, turning once, until the chicken is golden and cooked through.','Rest for 5 minutes and spoon the red oil from the tray over the top.']},

const plate='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26"/><circle cx="32" cy="32" r="16"/><path d="M4 8v18M9 8v18M14 8v18M9 26v30"/></svg>';
const photo=(m,cls='')=>`<div class="ph ${cls}" style="--h:${m.h}" role="img" aria-label="Photo placeholder for ${esc(m.n)}">${plate}</div>`;
const costB=c=>`<span class="cost" title="${CN[c]}">${'£'.repeat(c)}<span class="sr"> ${CN[c]}</span></span>`;
const tagsH=m=>`<span class="chips">${m.t.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</span>`;
const S={q:'',ing:[],tags:new Set(),ticks:{},vr:{},cur:null,cook:null,eaten:new Set(),tab:'ov'};
const SUG=['chicken','rice','spinach','chickpeas','salmon','potatoes'];
const TAGS=['Quick','Budget','Batch','Iron','Fibre','Protein','Omega-3','Calcium','Vit C'];
const hasT=(m,t)=>t==='Quick'?m.m<=30:t==='Budget'?m.c===1:t==='Batch'?m.s>=4:m.t.includes(t);
const hit=(m,w)=>m.ing.some(i=>i[0].toLowerCase().includes(w));
const filtered=()=>M.filter(m=>(!S.q||m.n.toLowerCase().includes(S.q)||hit(m,S.q))&&S.ing.every(w=>hit(m,w))&&[...S.tags].every(t=>hasT(m,t)));
const eatenBd=m=>S.eaten.has(m.id)?'<span class="bd">Eaten today</span>':'';
function render(){
 const f=filtered();$('#list').innerHTML=f.length?V.list(f):`<div class="empty"><strong>No dinners match</strong><span>Try removing a filter or ingredient.</span><button class="btn" data-act="clear">Clear filters</button></div>`;
 $('#count').textContent=f.length+' of '+M.length+' dinners';
 $$('#tokens').forEach(t=>t.innerHTML=S.ing.map(w=>`<button class="tok" data-act="rmtok" data-v="${esc(w)}" aria-label="Remove ingredient ${esc(w)}">${esc(w)} <b aria-hidden="true">&times;</b></button>`).join(''));
 $$('[data-tag]').forEach(b=>b.setAttribute('aria-pressed',S.tags.has(b.dataset.tag)));
 $$('[data-sug]').forEach(b=>b.setAttribute('aria-pressed',S.ing.includes(b.dataset.sug)));
 const n=$('#fcount');if(n)n.textContent=S.ing.length+S.tags.size||'';
 if(V.after)V.after();
}
let tt;function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>`+(undo?'<button data-act="undo">Undo</button>':'');t.onUndo=undo;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4500)}
const need=m=>m.ing.filter((i,k)=>!i[2]&&!(S.ticks[m.id]||{})[k]).length;
const vpick=m=>`<div><div class="pick" role="radiogroup" aria-label="Variant">${m.vars.map((v,k)=>`<button class="fchip" role="radio" aria-checked="${(S.vr[m.id]||0)===k}" aria-pressed="${(S.vr[m.id]||0)===k}" data-act="var" data-k="${k}">${esc(v[0])}</button>`).join('')}</div><p class="vnote" data-vnote>${esc(m.vars[S.vr[m.id]||0][1])}</p></div>`;
const loH=m=>m.lo?`<div class="lo"><strong>Leftovers:</strong> ${esc(m.lo)}</div>`:`<div class="lo"><strong>Cooked fresh.</strong> No leftovers planned.</div>`;
const ingH=m=>`<ul class="ings">${m.ing.map((i,k)=>`<li><label class="ing"><input type="checkbox" data-act="tick" data-k="${k}" ${(S.ticks[m.id]||{})[k]?'checked':''}><span class="nm">${esc(i[0])}</span>${i[2]?'<span class="hv">In pantry</span>':''}<span class="q">${esc(i[1])}</span></label></li>`).join('')}</ul>`;
const needH=m=>`<small data-need>${need(m)?need(m)+' to buy':'Everything covered'}</small>`;
const stepsH=m=>`<ol class="steps">${m.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>`;
const statsH=m=>`<div class="stats"><span>${m.m} min</span><span>${m.s} serving${m.s>1?'s':''}</span>${costB(m.c)}<span>${eff(m.m)}</span></div>`;
const sh=()=>$('#sh');
let opener=null;
function openSheet(html,from){opener=from||document.activeElement;sh().innerHTML=html;sh().classList.add('on');$('#ov').classList.add('on');document.body.classList.add('so');S.cook=null;const f=sh().querySelector('[data-act=close]');f&&f.focus({preventScroll:true})}
function closeSheet(){sh().classList.remove('on');$('#ov').classList.remove('on');document.body.classList.remove('so');S.cur=null;S.cook=null;opener&&opener.focus&&opener.focus({preventScroll:true})}
function openMeal(id,from){const m=M.find(x=>x.id==id);S.cur=m;S.tab='ov';openSheet(V.sheet(m),from)}
function drawCook(){const m=S.cur,n=m.steps.length,k=S.cook;let c=$('#cookv');if(!c){c=document.createElement('div');c.id='cookv';c.className='cookv';c.setAttribute('role','region');c.setAttribute('aria-label','Cook mode');sh().appendChild(c)}
 c.innerHTML=`<div class="sh-h"><h3>${esc(m.n)}</h3><button class="ib" data-act="cookx" aria-label="Exit cook mode">&times;</button></div><div class="ck"><div class="num">Step ${k+1} of ${n}</div><p class="big" aria-live="polite">${esc(m.steps[k])}</p><div class="bar"><i style="width:${(k+1)/n*100}%"></i></div></div><div class="row"><button class="btn" data-act="cookp" ${k?'':'disabled'}>Back</button><button class="btn pri" data-act="cookn">${k<n-1?'Next step':'Done cooking'}</button></div>`;
 c.querySelector('.pri').focus({preventScroll:true})}
const addH=()=>`<div class="grab"></div><div class="scr"><div class="sh-h"><h2 id="st">Add a dinner</h2><button class="ib" data-act="close" aria-label="Close">&times;</button></div><form class="form" id="addf"><label>Name<input class="inp" id="an" required placeholder="e.g. Sausage & bean casserole"></label><label>Ingredients, one per line<textarea class="inp" id="ai" placeholder="500 g sausages&#10;2 tins beans"></textarea></label><label>Method, one step per line<textarea class="inp" id="as"></textarea></label><div class="sec2"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri" type="submit">Save to library</button></div></form><p class="dim" style="font-size:.85rem">Or find ideas on <a href="#" style="color:var(--butter)">Discover</a>.</p></div>`;
document.addEventListener('submit',e=>{if(e.target.id!=='addf')return;e.preventDefault();const n=$('#an').value.trim();if(!n)return;const L=x=>$(x).value.split('\n').map(s=>s.trim()).filter(Boolean);
 M.unshift({id:Date.now(),n,d:'Added just now.',m:30,c:2,s:2,t:['Protein'],h:Math.floor(Math.random()*360),vars:[['Standard','']],lo:'',ing:L('#ai').map(s=>[s,'',0]),steps:L('#as').length?L('#as'):['No method yet.']});closeSheet();render();toast('Saved '+n)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value.trim().toLowerCase();render()}});
function addTok(){const i=$('#ing');const w=i.value.trim().toLowerCase().replace(/,$/,'');if(w&&!S.ing.includes(w))S.ing.push(w);i.value='';render()}
document.addEventListener('keydown',e=>{if(e.target.id==='ing'&&(e.key==='Enter'||e.key===',')){e.preventDefault();addTok()}
 if(e.target.id==='ing'&&e.key==='Backspace'&&!e.target.value&&S.ing.length){S.ing.pop();render()}
 if(e.key==='Escape'&&sh().classList.contains('on')){S.cook!==null?(S.cook=null,$('#cookv').remove()):closeSheet()}});
document.addEventListener('change',e=>{if(e.target.dataset.act!=='tick')return;const m=S.cur,t=S.ticks[m.id]=S.ticks[m.id]||{};t[e.target.dataset.k]=e.target.checked;$$('[data-need]').forEach(n=>n.textContent=need(m)?need(m)+' to buy':'Everything covered')});
document.addEventListener('click',e=>{
 if(e.target.id==='ov')return closeSheet();
 if(!e.target.closest('[data-more]')&&$('#more'))$('#more').hidden=true;
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.act,m=S.cur||M.find(x=>x.id==b.dataset.id);
 if(a==='open')openMeal(b.dataset.id,b);
 else if(a==='close')closeSheet();
 else if(a==='add')openSheet(addH(),b);
 else if(a==='addtok')addTok();
 else if(a==='rmtok'){S.ing=S.ing.filter(w=>w!==b.dataset.v);render()}
 else if(a==='sug'){const w=b.dataset.v;S.ing=S.ing.includes(w)?S.ing.filter(x=>x!==w):[...S.ing,w];render()}
 else if(a==='tag'){const t=b.dataset.v;S.tags.has(t)?S.tags.delete(t):S.tags.add(t);render()}
 else if(a==='clear'){S.q='';S.ing=[];S.tags.clear();$('#q').value='';render()}
 else if(a==='fp'){const p=$('#fp');const o=p.classList.toggle('open');b.setAttribute('aria-expanded',o)}
 else if(a==='eat'){const x=m;S.eaten.add(x.id);render();toast('Logged '+x.n+' for tonight',()=>{S.eaten.delete(x.id);render();toast('Undone')});if(S.cur)closeSheet()}
 else if(a==='plan'){toast('Added '+m.n+' to Fri 6 Nov');closeSheet()}
 else if(a==='swap'){toast('Pick a night to swap '+m.n+' into');closeSheet()}
 else if(a==='edit'){toast('Edit opens the meal form (prototype)')}
 else if(a==='var'){S.vr[m.id]=+b.dataset.k;$$('[data-act=var]').forEach(x=>{const on=+x.dataset.k===+b.dataset.k;x.setAttribute('aria-pressed',on);x.setAttribute('aria-checked',on)});$$('[data-vnote]').forEach(n=>n.textContent=m.vars[+b.dataset.k][1])}
 else if(a==='cook'){S.cook=0;drawCook()}
 else if(a==='cookn'){if(S.cook<m.steps.length-1){S.cook++;drawCook()}else{S.cook=null;$('#cookv').remove();toast('Nice. Mark it eaten when you sit down.')}}
 else if(a==='cookp'){S.cook--;drawCook()}
 else if(a==='cookx'){S.cook=null;$('#cookv').remove()}
 else if(a==='tab'){S.tab=b.dataset.v;$$('[data-act=tab]').forEach(x=>{x.setAttribute('aria-selected',x===b);x.tabIndex=x===b?0:-1});$$('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==b.dataset.v)}
 else if(a==='more'){const mo=$('#more');mo.hidden=!mo.hidden}
 else if(a==='undo'){const t=$('#toast');t.onUndo&&t.onUndo()}
});
$('#theme').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};

const sugH=()=>SUG.map(w=>`<button class="fchip" data-act="sug" data-v="${w}" data-sug="${w}" aria-pressed="false">${w}</button>`).join('');
const tagBtns=()=>TAGS.map(t=>`<button class="fchip" data-act="tag" data-v="${t}" data-tag="${t}" aria-pressed="false">${t}</button>`).join('');

$('#tagrow').innerHTML=tagBtns();$('#sugrow').innerHTML=sugH();
const V={list:f=>f.map((m,i)=>`<article class="mc card" style="--i:${Math.min(i,7)}"><button class="ph" style="--h:${m.h}" data-act="open" data-id="${m.id}" aria-label="Details for ${esc(m.n)}">${plate}${costB(m.c)}${eatenBd(m)}</button><div class="cb"><h3>${esc(m.n)}</h3><div class="mt">${m.m} min &middot; ${m.s} servings &middot; ${eff(m.m)}</div>${tagsH(m)}<div class="acts"><button class="btn pri" data-act="eat" data-id="${m.id}">Eat</button><button class="btn" data-act="open" data-id="${m.id}">Details</button></div></div></article>`).join(''),
sheet:m=>`<div class="grab"></div><div class="scr"><div class="sh-h"><h2 id="st">${esc(m.n)}</h2><button class="ib" data-act="close" aria-label="Close">&times;</button></div><p class="desc">${esc(m.d)}</p>${photo(m)}${statsH(m)}${tagsH(m)}${vpick(m)}${loH(m)}<h3 class="sec">Ingredients ${needH(m)}</h3>${ingH(m)}<h3 class="sec">Method</h3>${stepsH(m)}<div class="sec2"><button class="btn" data-act="swap">Swap</button><button class="btn" data-act="edit">Edit</button></div></div><div class="dock"><button class="btn pri" data-act="plan">Add to plan</button><button class="btn ok" data-act="eat">Eat</button><button class="btn" data-act="cook">Cook mode</button></div>`};

render();
</script></body></html>
