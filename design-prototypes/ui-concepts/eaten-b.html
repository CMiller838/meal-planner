<header class="nav"><a class="brand" href="#">Meal Planner</a>
<nav class="tabs" aria-label="Main"><a href="#">Browse</a><a href="#">Discover</a><a href="#">Plan</a><a href="#">Shopping</a><a href="#" aria-current="page">Eaten</a></nav>
<button class="ib" id="theme" aria-label="Toggle dark or light theme">&#9680;</button></header>
<main><div class="top"><div><h1>Eaten</h1><p>Mon 26 Oct to Sun 1 Nov &middot; dinners only</p></div></div><div id="panel"></div></main><div class="dock" id="dock"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;function toast(m,undo){const t=$('#toast');t.innerHTML='<span></span>';t.firstChild.textContent=m;if(undo){const b=document.createElement('button');b.className='btn sm';b.textContent='Undo';b.onclick=()=>{undo();t.classList.remove('on')};t.append(b)}t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4500)}
$('#theme').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};
const money=n=>'£'+n.toFixed(2);

const DAYS=['Mon 26 Oct','Tue 27 Oct','Wed 28 Oct','Thu 29 Oct','Fri 30 Oct','Sat 31 Oct','Sun 1 Nov'],TODAY=6;
const NUT=[['prot','Protein'],['fib','Fibre'],['iron','Iron'],['ca','Calcium'],['vc','Vitamin C'],['o3','Omega-3'],['fol','Folate'],['vd','Vitamin D']];
const LN=['','Low','Medium','High'];
let eid=1;const E=(d,n,k,nu,por,est)=>({id:eid++,d,n,k,nu,por:por||1,est:!!est});
let log=[E(0,'Chicken & chorizo traybake','plan',{prot:3,fib:1,iron:2,ca:0,vc:3,fol:1}),E(1,'Traybake leftovers','plan',{prot:3,fib:1,iron:2,ca:0,vc:3,fol:1},.5),E(2,'Veg lasagne','plan',{prot:2,fib:3,iron:1,ca:3,vc:2,fol:2}),E(3,'Beef ragu & wholewheat pasta','plan',{prot:3,fib:2,iron:3,ca:1,vc:1,fol:1}),E(4,'Pizza with Sam','out',{prot:2,ca:2,fib:1},1,1),E(5,'Salmon, sweet potato & greens','plan',{prot:3,fib:2,iron:1,ca:1,vc:3,o3:3,fol:2})];
const RECENT=[['Veg lasagne',{prot:2,fib:3,iron:1,ca:3,vc:2,fol:2}],['Beef ragu & pasta',{prot:3,fib:2,iron:3,ca:1,vc:1,fol:1}],['Chickpea & spinach curry',{prot:2,fib:3,iron:3,ca:2,vc:2,fol:3}],['Fish pie',{prot:3,ca:2,o3:2,fib:1}],['Homemade pizza',{prot:2,ca:2,fib:1}]];
const st={day:5,nut:'iron',open:new Set([5,6]),dockOpen:false};
const scope=()=>st.day==null?log:log.filter(e=>e.d===st.day);
function cover(es,n){const known=es.filter(e=>e.nu[n]!=null);if(!known.length)return{lv:null,k:0,t:es.length};
const days=new Set(es.map(e=>e.d)).size,pts=known.reduce((s,e)=>s+e.nu[n]*e.por,0),r=pts/(2*Math.max(1,days));
return{lv:r<.5?1:r<.9?2:3,k:known.length,t:es.length}}
const b3=lv=>lv==null?`<span class="b3 unk" aria-hidden="true"><i></i><i></i><i></i></span>`:`<span class="b3 l${lv}" aria-hidden="true">${[1,2,3].map(k=>`<i class="${k<=lv?'on':''}" style="--s:${k}"></i>`).join('')}</span>`;
const lvT=lv=>lv==null?'<span class="lv unk">Unknown</span>':`<span class="lv l${lv}">${LN[lv]}</span>`;
const lvA=lv=>lv==null?'unknown':LN[lv].toLowerCase();
const KIND={plan:'Planned',out:'Eating out',free:'Quick log'};
function entry(e,fresh){const kn=NUT.filter(([k])=>e.nu[k]!=null),hi=kn.filter(([k])=>e.nu[k]>=3).map(([,n])=>n),unk=NUT.length-kn.length;
return `<li class="card en ${fresh?'fresh':''}"><div class="en-h"><b>${esc(e.n)}</b><button class="rmb" data-k="x${e.id}" data-rm="${e.id}" aria-label="Remove ${esc(e.n)}">&times;</button></div><div class="en-m"><span class="bd ${e.k==='out'?'out':'eaten'}">${KIND[e.k]}</span>${e.por!==1?`<span>${e.por} portion</span>`:''}${e.est?'<span class="estl">estimate</span>':''}${e.pend?'<span class="pend">estimating...</span>':''}</div>${e.pend?'':`<div class="en-m kn">${hi.length?'High: '+esc(hi.join(', '))+'. ':''}${unk?unk+' of '+NUT.length+' nutrients unknown':'All nutrients estimated'}</div>`}</li>`}
function addEntry(n,nu,k,pend){const e=E(TODAY,n,k,nu,1,k!=='plan');if(pend){e.pend=true;e.nu={}}
e.fresh=1;log.push(e);st.day=TODAY;st.open.add(TODAY);render();
if(pend){setTimeout(()=>{e.nu=guess(n);e.pend=false;render();toast('Estimate ready for '+n)},1100)}return e}
function guess(n){const s=n.toLowerCase();if(/fish|salmon|cod|haddock/.test(s))return{prot:3,o3:3,vd:2};if(/pasta|spag|noodle/.test(s))return{prot:1,fib:1};if(/curry|dal|chickpea/.test(s))return{prot:2,fib:3,iron:2};if(/salad|veg|soup/.test(s))return{fib:2,vc:3};return{prot:2}}
function dockHTML(){return `<div class="dk-in" style="display:block"><form id="ate"><label class="sr" for="ateIn">What did you eat for dinner</label><input class="in" id="ateIn" name="t" maxlength="80" autocomplete="off" placeholder="I ate... (free text)"><button class="btn pri">Log it</button></form><div class="rec" aria-label="Recent dinners">${RECENT.map((r,i)=>`<button data-k="r${i}" data-rec="${i}">${esc(r[0])}</button>`).join('')}</div></div>`}
function dockDraw(){if(!$('#ateIn'))$('#dock').innerHTML=dockHTML()}
function render(){const f=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.k;const v=$('#ateIn')&&$('#ateIn').value;dockDraw();draw();if($('#ateIn')&&v)$('#ateIn').value=v;
if(f){const e=document.querySelector(`[data-k="${f}"]`);e&&e.focus()}log.forEach(e=>e.fresh=0)}
document.addEventListener('click',e=>{const c=e.target.closest('button');if(!c)return;const d=c.dataset;
if(d.rm){const x=log.find(y=>y.id==d.rm),k=log.indexOf(x);log.splice(k,1);render();toast('Removed '+x.n,()=>{log.splice(k,0,x);render()});return}
if(d.rec!==undefined){const r=RECENT[d.rec];addEntry(r[0],r[1],'plan');toast('Logged '+r[0],()=>{log.pop();render()});return}
if(d.day!==undefined){st.day=d.day===''?null:+d.day;render();return}
if(d.nut){st.nut=d.nut;render();return}
if(d.gopen){const k=+d.gopen;st.open.has(k)?st.open.delete(k):st.open.add(k);render();return}
if(d.dock!==undefined){st.dockOpen=!st.dockOpen;render();return}
vclick&&vclick(c,d)});
document.addEventListener('submit',e=>{if(e.target.id!=='ate')return;e.preventDefault();const t=new FormData(e.target).get('t').trim();if(!t)return;e.target.reset();addEntry(t,{},'free',true);toast('Logged "'+t+'", estimating',()=>{log.pop();render()})});
let vclick=null;
const LEG='<p class="leg">Coverage is an estimate from ingredient tags against the dinner share of your daily targets, not lab values. Unknown means no logged dinner carries that nutrient.</p>';

function draw(){const all=log,pick=NUT.find(n=>n[0]===st.nut)||NUT[0];
const g=NUT.map(([k,n])=>{const c=cover(all,k);return `<button class="tl2" data-k="n${k}" data-nut="${k}" aria-pressed="${st.nut===k}" aria-label="${n}: ${lvA(c.lv)}${c.lv?', estimated':''}"><b>${n}</b>${b3(c.lv)}<span>${lvT(c.lv)}</span></button>`}).join('');
const cp=cover(all,pick[0]);
const det=`<section class="card dt2" aria-live="polite"><h2>${pick[1]}: where it came from ${cp.lv?'<span class="estl">estimate</span>':''}</h2><ul>${all.length?all.map(e=>{const v=e.nu[pick[0]];return `<li><span>${DAYS[e.d].slice(0,3)} &middot; ${esc(e.n)}</span><span>${v==null?'<span class="lv unk">Unknown</span>':'<span class="lv l'+Math.max(1,v)+'">'+(v?LN[v]:'None')+'</span>'}</span></li>`}).join(''):'<li class="dim">No dinners logged yet.</li>'}</ul></section>`;
const days=DAYS.map((d,i)=>({d,i,es:log.filter(e=>e.d===i)})).reverse().map(({d,i,es})=>`<section class="${st.open.has(i)?'gopen':''}"><button class="gh" data-k="g${i}" data-gopen="${i}" aria-expanded="${st.open.has(i)}"><span>${d}${i===TODAY?' (today)':''}</span><span>${es.length?es.length+' dinner'+(es.length>1?'s':''):'nothing logged'} &#9662;</span></button><div class="gb"><div><ul class="ul">${es.length?es.map(e=>entry(e,e.fresh)).join(''):'<li class="emp">No dinner logged.</li>'}</ul></div></div></section>`).join('');
$('#panel').innerHTML=`<h2 class="sec" style="margin-top:0">This week's coverage</h2><div class="gr">${g}</div>${det}${LEG}<h2 class="sec">Dinner log</h2>${days}`}

render();
</script></body></html>
