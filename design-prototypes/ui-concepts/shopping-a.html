<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shopping A: aisle accordion</title>
<style>
:root,[data-theme="dark"]{--bg:#1c1410;--bg-2:#26190f;--surface:#241a13;--surface-alt:#2c2018;--text:#f3e6d4;--text-dim:#c9b79f;--accent:#d4633b;--accent-2:#7a9a6b;--butter:#e8b74a;--danger:#ff6b4a;--border:#4a382b;--shadow:rgba(15,9,5,.45);--radius:18px;--on-accent:#fff;--on-butter:#3a2a10;--accent-hover:#b94f2c;--accent-glow:rgba(212,99,59,.5);--on-cork:#fff6ea;--scrim:rgba(0,0,0,.55);--motion-base:180ms;--motion-exit:120ms;--ease-lift:cubic-bezier(.2,.9,.3,1.4);--tabbar-h:3.5rem;--ph-l:34%}
[data-theme="light"]{--bg:#6b4f3a;--bg-2:#7a5c44;--surface:#fdf6ec;--surface-alt:#f7ecda;--text:#2b1d14;--text-dim:#6b5847;--accent:#d4633b;--accent-2:#5c8a4c;--butter:#e8b74a;--danger:#c1421a;--border:#e3d3ba;--shadow:rgba(43,29,20,.18);--ph-l:62%}
*{box-sizing:border-box}
html{color-scheme:dark light}
body{margin:0;background:linear-gradient(var(--bg),var(--bg-2)) fixed;color:var(--text);font:16px/1.4 "Segoe UI Rounded",Nunito,"Trebuchet MS",system-ui,sans-serif;transition:background .4s,color .4s;padding-bottom:calc(var(--tabbar-h) + 1rem)}
h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.brand{font-weight:800;color:var(--on-cork);text-decoration:none;margin-right:auto}
.tabs{display:flex;gap:.25rem}

.ib:hover{transform:translateY(-1px) rotate(20deg)}.ib:active{transform:scale(.95)}
@media(max-width:639px){.nav{backdrop-filter:none}.tabs{position:fixed;inset:auto 0 0 0;height:var(--tabbar-h);z-index:40;justify-content:space-around;align-items:center;background:var(--bg-2);border-top:1px solid var(--border);padding:0 .25rem env(safe-area-inset-bottom)}.tabs a{padding:.5rem .5rem;font-size:.82rem;min-height:44px;display:flex;align-items:center}}

@keyframes rise{from{opacity:0;transform:translateY(8px)}}

.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.pri:hover:not(:disabled){background:var(--accent-hover)}
.btn.sm{min-height:44px;padding:.3rem .7rem;font-size:.85rem}
.btn[aria-pressed=true]{background:var(--butter);color:var(--on-butter);border-color:var(--butter)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 6px 16px var(--shadow)}
.ph{position:relative;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 50% var(--ph-l)),hsl(calc(var(--h) + 35) 45% calc(var(--ph-l) - 10%)));overflow:hidden}

.bd.locked,.bd.shop,.bd.busy,.bd.warn{border-color:var(--text-dim)}
.bd.shop{border-color:var(--accent-2)}.bd.busy{border-color:var(--butter)}.bd.warn{border-color:var(--danger);color:var(--danger)}
.dim{color:var(--text-dim)}
.acts{display:flex;flex-wrap:wrap;gap:.4rem}
.meter{display:grid;gap:.5rem .9rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mrow{display:grid;gap:.2rem;font-size:.8rem;font-weight:700}
.mrow .l{display:flex;justify-content:space-between}
.bar{height:.55rem;border-radius:99px;background:var(--surface-alt);border:1px solid var(--border);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent-2);border-radius:99px;transition:width .5s ease-out}
.bar i.low{background:var(--butter)}
.toast{position:fixed;width:max-content;left:50%;bottom:calc(var(--tabbar-h) + .75rem);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;display:flex;gap:.75rem;align-items:center;max-width:min(92vw,520px);background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:.8rem;padding:.6rem .9rem;box-shadow:0 8px 24px var(--shadow);transition:opacity var(--motion-base),transform var(--motion-base) var(--ease-lift)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media(min-width:640px){.toast{bottom:1.25rem}body{padding-bottom:1rem}}
.swapping .swapnote{display:flex}
.swapnote{display:none;align-items:center;gap:.6rem;margin-bottom:.75rem;padding:.5rem .8rem;border-radius:.8rem;background:var(--butter);color:var(--on-butter);font-weight:800}
.swapnote .btn{min-height:36px;padding:.1rem .6rem}
[data-pick]{scroll-margin-top:5rem}[data-drag]{cursor:grab}[data-drag].dragging{opacity:.4}[data-drag].over{outline:3px dashed var(--butter);outline-offset:3px}
.swapping [data-pick]{cursor:copy}
.swapsrc{outline:3px solid var(--butter);outline-offset:2px}
.grip{color:var(--text-dim);letter-spacing:-.1em;user-select:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-property:opacity,background,color!important;transition-duration:.15s!important;scroll-behavior:auto!important}.btn:hover,.ib:hover{transform:none!important}}


body{padding-bottom:calc(var(--tabbar-h) + var(--dock-h,0px) + 1.5rem)}
@media(min-width:640px){body{padding-bottom:calc(var(--dock-h,0px) + 1.5rem)}}
.toast{bottom:calc(var(--tabbar-h) + var(--dock-h,0px) + .75rem)}
@media(min-width:640px){.toast{bottom:calc(var(--dock-h,0px) + 1rem)}}
.dock{position:fixed;left:0;right:0;bottom:var(--tabbar-h);z-index:35;background:var(--bg-2);color:var(--on-cork);border-top:1px solid var(--border);padding:.6rem 1rem;box-shadow:0 -6px 16px var(--shadow)}
@media(min-width:640px){.dock{bottom:0}}
.dock[hidden]{display:none}
.dk-in{max-width:760px;margin:0 auto}
.in{min-height:44px;border-radius:.7rem;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:0 .8rem;font:inherit;min-width:0}
.in:focus-visible{outline:3px solid var(--butter);outline-offset:1px}
.seg{display:flex;gap:.25rem;padding:.25rem;border-radius:999px;background:var(--surface);border:1px solid var(--border);width:max-content;max-width:100%;margin-bottom:.9rem}
.seg button{min-height:44px;padding:0 1.1rem;border:0;border-radius:999px;background:none;font-weight:800;transition:background var(--motion-base),transform var(--motion-base)}
.seg button:active{transform:scale(.95)}
.seg [aria-selected=true]{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.m-in{animation:rise .3s ease-out both}
.xs{font-size:.78rem}

:root{--dock-h:5.6rem}
.shopbn{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .8rem;padding:.6rem .9rem;border-radius:.8rem;background:var(--butter);color:var(--on-butter);margin-bottom:.9rem;animation:rise .35s var(--ease-lift) both}
.shopbn span{flex:1 1 10rem;font-size:.9rem}
.shopbn .btn{background:transparent;border-color:currentColor;color:inherit}
.ln{list-style:none}
.tkb{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto auto;gap:.7rem;align-items:center;width:100%;min-height:52px;padding:.4rem .9rem;cursor:pointer;transition:background var(--motion-base)}
.tkb:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tkb:focus-visible{outline:3px solid var(--butter);outline-offset:-3px}
.box{position:relative;width:1.9rem;height:1.9rem;border-radius:.55rem;border:2.5px solid var(--text-dim);display:grid;place-items:center;transition:background var(--motion-base),border-color var(--motion-base),transform var(--motion-base) var(--ease-lift)}
.box svg{width:1.2rem;fill:none;stroke:var(--on-accent);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s .05s ease-out}
.got .box{background:var(--accent-2);border-color:var(--accent-2)}.got .box svg{stroke-dashoffset:0}
.tkb:active .box,.pbox:active .box{transform:scale(.85)}
.just .box{animation:pop .4s var(--ease-lift)}
.just .box::after{content:"";position:absolute;inset:-4px;border-radius:.8rem;border:2px solid var(--accent-2);animation:ping .5s ease-out forwards}
@keyframes pop{40%{transform:scale(1.25)}}@keyframes ping{to{transform:scale(1.9);opacity:0}}
.nm{position:relative;font-weight:700;justify-self:start;min-width:0}
.nm::after{content:"";position:absolute;left:0;right:0;top:55%;height:2px;background:var(--text-dim);transform:scaleX(0);transform-origin:left;transition:transform .25s ease-out}
.got .nm::after{transform:scaleX(1)}
.q,.pr{font-size:.85rem;color:var(--text-dim);font-weight:700}.pr{color:var(--text);min-width:3.2rem;text-align:right}
.got .nm,.got .pr{color:var(--text-dim)}
.adh{font-style:normal;font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;padding:.05rem .4rem;border-radius:99px;border:1px solid var(--butter);vertical-align:middle}
.have{display:flex;align-items:center;gap:.6rem;padding:.4rem .9rem;min-height:52px;color:var(--text-dim)}
.have .nm{flex:1}.have .nm::after{display:none}
.hv{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:.1rem .5rem;border-radius:99px;border:1.5px solid var(--accent-2);color:var(--accent-2)}
.add{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem;padding:.8rem;border-radius:var(--radius);border:1.5px dashed var(--on-cork);color:var(--on-cork)}
.add .in{flex:1 1 9rem}.add .in.p{flex:0 1 5rem}
.dk-l{display:grid;gap:.25rem;min-width:0;flex:1}
.dk-r{display:flex;gap:.5rem;align-items:center}
.dk-in{display:flex;gap:.8rem;align-items:center}
.dk-l b{font-size:1.25rem}
.bud{height:.55rem;border-radius:99px;background:color-mix(in srgb,var(--on-cork) 22%,transparent);overflow:hidden}
.bud i{display:block;height:100%;width:100%;background:var(--butter);border-radius:99px;transform-origin:left;transition:transform .5s ease-out,background .3s}
.bud i.over{background:var(--accent)}
.dk-l small{font-size:.78rem;opacity:.85}
.pnote{color:var(--on-cork);font-size:.9rem;margin-bottom:.7rem}
.pl{display:grid;gap:.5rem}
.pn{display:grid;grid-template-columns:auto 1fr auto auto;gap:.3rem;align-items:center;min-height:56px;padding:.2rem .3rem .2rem .4rem;border-radius:.9rem;background:var(--surface);border:1px solid var(--border);animation:rise .3s ease-out both;animation-delay:calc(var(--i,0)*25ms)}
.pn.out{animation:slideout .28s ease-in forwards}
@keyframes slideout{to{opacity:0;transform:translateX(40px)}}
.pbox{all:unset;box-sizing:border-box;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.pbox:focus-visible{outline:3px solid var(--butter)}
.pn .nm{padding:0 .3rem}
.qb{min-height:44px;min-width:4.2rem;border:1px dashed var(--border);background:none;border-radius:.6rem;padding:0 .6rem;font-weight:700;color:var(--text-dim)}
.qb:hover{border-color:var(--accent);color:var(--text)}
.qin{width:6.2rem}
.rm{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--text-dim);font-size:1.3rem;transition:transform var(--motion-base),color var(--motion-base)}
.rm:hover{color:var(--danger)}.rm:active{transform:scale(.9)}
.emp{padding:1.2rem;text-align:center;color:var(--on-cork)}

.aisle{margin-bottom:.7rem;overflow:hidden}
.ah{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto 4.5rem auto;gap:.6rem;align-items:center;width:100%;min-height:56px;padding:.5rem .9rem;cursor:pointer}
.ah:focus-visible{outline:3px solid var(--butter);outline-offset:-3px}
.an{font-weight:800}.ap{font-weight:800;font-size:.85rem;color:var(--text-dim)}
.pb{height:.5rem;border-radius:99px;background:var(--surface-alt);border:1px solid var(--border);overflow:hidden}
.pb i{display:block;height:100%;background:var(--accent-2);transform-origin:left;transition:transform .45s ease-out}
.chev{transition:transform .2s}.open .chev{transform:rotate(180deg)}
.ab{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease-out}.open .ab{grid-template-rows:1fr}.ab>div{overflow:hidden;min-height:0}
.aisle.done .an::after{content:" \00b7 done";color:var(--accent-2)}
.aisle.fin{animation:bump .5s var(--ease-lift)}@keyframes bump{40%{transform:scale(1.02)}}
.ln+.ln{border-top:1px dashed var(--border)}

</style></head><body>
<header class="nav"><a class="brand" href="#">Meal Planner</a>
<nav class="tabs" aria-label="Main"><a href="#">Browse</a><a href="#">Discover</a><a href="#">Plan</a><a href="#" aria-current="page">Shopping</a><a href="#">Eaten</a></nav>
<button class="ib" id="theme" aria-label="Toggle dark or light theme">&#9680;</button></header>
<main><div class="top"><div><h1>Shopping</h1><p>Sat 31 Oct &middot; one Asda shop for the fortnight</p></div></div>
<div id="banner"></div><div class="seg" role="tablist" aria-label="Shopping sections"><button role="tab" data-tab="list" aria-selected="true">Shopping list</button><button role="tab" data-tab="pantry" aria-selected="false">Pantry</button></div>
<div id="panel"></div></main><div class="dock" id="dock"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;function toast(m,undo){const t=$('#toast');t.innerHTML='<span></span>';t.firstChild.textContent=m;if(undo){const b=document.createElement('button');b.className='btn sm';b.textContent='Undo';b.onclick=()=>{undo();t.classList.remove('on')};t.append(b)}t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4500)}
$('#theme').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};
const money=n=>'£'+n.toFixed(2);

const BUD=60,AISLES=['Fruit & veg','Meat & fish','Dairy & eggs','Bakery','Tins & dry','Frozen','Household'];
let nid=1;const I=(a,n,q,p,h)=>({id:nid++,a,n,q,p,have:!!h,force:false,got:false,adhoc:false});
let items=[I(0,'Sweet potatoes','1 kg',1.4),I(0,'Baby spinach','240 g',1.5),I(0,'Broccoli','1 head',.85),I(0,'Onions','1 kg',1.1,1),I(0,'Garlic','2 bulbs',.6,1),I(0,'Carrots','1 kg',.7),I(0,'Lemons','3',.95),
I(1,'Chicken thighs','1.2 kg',4.8),I(1,'Chorizo','225 g',2.2),I(1,'Beef mince','500 g',3.75),I(1,'Salmon fillets','2',4.5),I(1,'Smoked haddock','300 g',3.4),
I(2,'Mozzarella','2 x 125 g',1.8),I(2,'Mature cheddar','400 g',3),I(2,'Semi-skimmed milk','2 L',1.55),I(2,'Butter','250 g',2.1,1),
I(3,'Pizza dough balls','2',1.1),I(3,'Wholemeal wraps','6',1.2),
I(4,'Chopped tomatoes','4 tins',2),I(4,'Chickpeas','2 tins',1),I(4,'Wholewheat pasta','500 g',.95),I(4,'Coconut milk','400 ml',1.05),I(4,'Basmati rice','1 kg',2.2,1),
I(5,'Garden peas','1 kg',1.6),I(5,'Fish pie mix','320 g',3.2),
I(6,'Kitchen foil','1 roll',1.2),I(6,'Washing-up liquid','1',1.1)];
const adh=I(4,'Tea bags','80',1.45);adh.adhoc=true;items.push(adh);
[0,1,5,7,8].forEach(k=>items[k].got=true);
let pid=1;const PP=(n,q)=>({id:pid++,n,q});
let pantry=[PP('Onions','5'),PP('Garlic','2 bulbs'),PP('Basmati rice','800 g'),PP('Butter','180 g'),PP('Olive oil','half a bottle'),PP('Plain flour','1 kg'),PP('Stock cubes','8'),PP('Soy sauce','1 bottle'),PP('Frozen peas','400 g'),PP('Cheddar','150 g')];
const st={tab:'list',edit:null,open:new Set([0,1]),aisle:0,just:null,fin:null,dis:false};
const need=()=>items.filter(i=>!i.have||i.force);
const total=()=>need().reduce((s,i)=>s+i.p,0);
const inTrolley=()=>need().filter(i=>i.got).reduce((s,i)=>s+i.p,0);
const aisleStat=a=>{const N=need().filter(i=>i.a===a);return{n:N.length,g:N.filter(i=>i.got).length}};
const row=i=>i.have&&!i.force?`<li class="ln have"><span class="hv">In pantry</span><span class="nm">${esc(i.n)}</span><span class="q">${esc(i.q)}</span><button class="btn sm" data-k="h${i.id}" data-need="${i.id}" aria-label="Need ${esc(i.n)} anyway">Need it</button></li>`:
`<li class="ln ${i.got?'got':''} ${st.just===i.id?'just':''}"><button class="tkb" role="checkbox" aria-checked="${i.got}" data-k="t${i.id}" data-t="${i.id}"><span class="box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span class="nm">${esc(i.n)}${i.adhoc?' <em class="adh">added</em>':''}</span><span class="q">${esc(i.q)}</span><span class="pr">${money(i.p)}</span></button></li>`;
const addForm=()=>`<form class="add" id="addf"><input class="in" name="n" required maxlength="40" placeholder="Add an item, e.g. bin bags" aria-label="Item name"><select class="in" name="a" aria-label="Aisle">${AISLES.map((a,k)=>`<option value="${k}" ${k===(st.aisle)?'selected':''}>${a}</option>`).join('')}</select><input class="in p" name="p" inputmode="decimal" placeholder="£ est." aria-label="Estimated price"><button class="btn pri">Add item</button></form>`;
function drawBanner(){$('#banner').innerHTML=st.dis||st.tab!=='list'?'':`<div class="shopbn" role="status"><b>Shop day: Sat 31 Oct</b><span>Asda click &amp; collect, 10:00 &middot; ${need().length} items for 14 dinners</span><button class="btn sm" data-dis>Got it</button></div>`}
function drawPantry(){const P=pantry;$('#panel').innerHTML=`<p class="pnote">Tick an item when it is used up. Tap a quantity to edit it.</p><ul class="pl">${P.length?P.map((p,i)=>`<li class="pn" style="--i:${Math.min(i,7)}" data-pid="${p.id}"><button class="pbox" role="checkbox" aria-checked="false" aria-label="Used up: ${esc(p.n)}" data-k="u${p.id}" data-used="${p.id}"><span class="box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></button><span class="nm">${esc(p.n)}</span>${st.edit===p.id?`<input class="in qin" data-k="e${p.id}" data-qin="${p.id}" value="${esc(p.q)}" maxlength="24" aria-label="Quantity of ${esc(p.n)}">`:`<button class="qb" data-k="q${p.id}" data-pe="${p.id}" aria-label="Edit quantity of ${esc(p.n)}: ${esc(p.q)}">${esc(p.q)}</button>`}<button class="rm" data-k="r${p.id}" data-pr="${p.id}" aria-label="Remove ${esc(p.n)}">&times;</button></li>`).join(''):'<p class="emp">Pantry is empty. Add what you have in.</p>'}</ul><form class="add" id="addp"><input class="in" name="n" required maxlength="40" placeholder="Add to pantry" aria-label="Pantry item"><input class="in p" name="q" maxlength="24" placeholder="Qty" aria-label="Quantity"><button class="btn pri">Add</button></form>`}
function drawDock(){const d=$('#dock'),t=total(),b=inTrolley(),N=need(),g=N.filter(i=>i.got).length,over=t>BUD;d.hidden=st.tab!=='list';
d.innerHTML=`<div class="dk-in"><div class="dk-l"><span><b>${money(t)}</b> <span class="xs">week total of ${money(BUD)} budget${over?' &middot; <b>'+money(t-BUD)+' over</b>':' &middot; '+money(BUD-t)+' left'}</span></span><div class="bud" role="img" aria-label="${Math.round(t/BUD*100)} percent of budget"><i class="${over?'over':''}" style="transform:scaleX(${Math.min(1,t/BUD)})"></i></div><small>In trolley ${money(b)} &middot; ${g} of ${N.length} ticked</small></div><div class="dk-r">${dockExtra(g===N.length)}</div></div>`}
function render(){const f=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.k;
$$('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===st.tab));
drawBanner();st.tab==='list'?drawList():drawPantry();drawDock();st.just=null;st.fin=null;
if(f){const e=document.querySelector(`[data-k="${f}"]`);e&&e.focus()}}
function tick(id){const i=items.find(x=>x.id==id),was=aisleStat(i.a);i.got=!i.got;st.just=i.got?i.id:null;const now=aisleStat(i.a);
if(i.got&&now.g===now.n&&was.g<was.n){st.fin=i.a;toast(AISLES[i.a]+' done')}render()}
document.addEventListener('click',e=>{const c=e.target.closest('button');if(!c)return;const d=c.dataset;
if(d.tab){st.tab=d.tab;st.edit=null;render();return}
if(d.t){tick(d.t);return}
if(d.dis!==undefined){st.dis=true;render();return}
if(d.need){const i=items.find(x=>x.id==d.need);i.force=true;render();toast(i.n+' added to the shop');return}
if(d.ai!==undefined){const k=+d.ai;st.open.has(k)?st.open.delete(k):st.open.add(k);render();return}
if(d.fin!==undefined){toast('Nice. Shop complete, pantry updated');return}
if(d.pe){st.edit=+d.pe;render();const x=document.querySelector('[data-qin]');x&&(x.focus(),x.select());return}
if(d.pr){const p=pantry.find(x=>x.id==d.pr),k=pantry.indexOf(p);pantry.splice(k,1);render();toast('Removed '+p.n,()=>{pantry.splice(k,0,p);render()});return}
if(d.used){const li=c.closest('.pn'),p=pantry.find(x=>x.id==d.used);li.classList.add('got','just');c.setAttribute('aria-checked','true');setTimeout(()=>li.classList.add('out'),380);setTimeout(()=>{const k=pantry.indexOf(p);pantry.splice(k,1);render();toast(p.n+' used up',()=>{pantry.splice(k,0,p);render()})},680);return}
vclick&&vclick(c,d)});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.qin){const p=pantry.find(x=>x.id==e.target.dataset.qin);if(p&&st.edit===p.id){p.q=e.target.value.trim()||p.q;st.edit=null;render();toast('Updated '+p.n+' to '+p.q)}}});
document.addEventListener('keydown',e=>{if(e.target.dataset&&e.target.dataset.qin){if(e.key==='Enter')e.target.blur();if(e.key==='Escape'){st.edit=null;render()}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);
if(e.target.id==='addf'){const a=+f.get('a'),p=parseFloat(f.get('p'))||1.5,it=I(a,f.get('n').trim(),'1',p);it.adhoc=true;items.push(it);st.open.add(a);st.aisle=a;st.just=it.id;e.target.reset();render();toast('Added '+it.n+' to '+AISLES[a])}
if(e.target.id==='addp'){const p=PP(f.get('n').trim(),f.get('q').trim()||'1');pantry.push(p);render();toast('Added '+p.n+' to pantry')}});
let vclick=null;

function drawList(){$('#panel').innerHTML=AISLES.map((a,ai)=>{const L=items.filter(i=>i.a===ai);if(!L.length)return'';const s=aisleStat(ai),open=st.open.has(ai);
return `<section class="card aisle ${open?'open':''} ${s.n&&s.g===s.n?'done':''} ${st.fin===ai?'fin':''}"><button class="ah" data-k="a${ai}" data-ai="${ai}" aria-expanded="${open}"><span class="an">${a}</span><span class="ap">${s.g}/${s.n}</span><span class="pb"><i style="transform:scaleX(${s.n?s.g/s.n:0})"></i></span><span class="chev" aria-hidden="true">&#9662;</span></button><div class="ab"><div><ul>${L.map(row).join('')}</ul></div></div></section>`}).join('')+addForm()}
function dockExtra(all){return `<button class="btn pri" data-fin ${all?'':'disabled'}>Finish shop</button>`}

render();
</script></body></html>
