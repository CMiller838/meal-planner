<style>

let tt;function toast(msg,act,fn){const t=$('#toast');t.textContent='';const s=document.createElement('span');s.textContent=msg;t.append(s);if(act){const b=document.createElement('button');b.className='btn sm';b.textContent=act;b.onclick=()=>{fn();t.classList.remove('on')};t.append(b)}t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),5000)}
const vv=window.visualViewport;if(vv){const f=()=>{const r=document.documentElement.style;r.setProperty('--kb',Math.max(0,innerHeight-vv.height-vv.offsetTop)+'px');r.setProperty('--vvh',vv.height+'px')};vv.addEventListener('resize',f);vv.addEventListener('scroll',f)}

const I=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const START=new Date(2026,9,29),D=i=>{const d=new Date(START);d.setDate(d.getDate()+i);return d};
const WD=i=>D(i).toLocaleDateString('en-GB',{weekday:'short'}),DL=i=>D(i).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TIERN=['','Budget','Mid','Treat'],EST=[0,4,7,11];
const POOL=[
{n:'Chicken & chorizo traybake',m:45,c:2,t:['Protein','Iron'],v:0,why:'Uses the chicken thighs and makes 4 portions for the next nights.'},
{n:'Prawn & veg noodles',m:20,c:2,t:['Protein','Vit C'],v:1,why:'Ready fast and light on washing up.'},
{n:'Veg lasagne',m:55,c:2,t:['Calcium','Fibre'],v:1,why:'Batch cook: two nights of leftovers follow.'},
{n:'Lentil dal & rice',m:30,c:1,t:['Fibre','Iron'],v:1,why:'Pantry staples, one pot, very cheap.'},
{n:'Beef ragu & wholewheat pasta',m:75,c:2,t:['Iron','Fibre','Protein'],v:0,why:'Fills your iron gap this week; freezes well.'},
{n:'Chicken wraps & slaw',m:20,c:1,t:['Protein','Vit C'],v:1,why:'Quick, and uses the cabbage that is going soft.'},
{n:'Salmon, sweet potato & greens',m:30,c:3,t:['Omega-3','Vit C','Fibre'],v:1,why:'Your omega-3 for the week in one tray.'},
{n:'Chickpea & spinach curry',m:35,c:1,t:['Fibre','Iron','Calcium'],v:1,why:'Cheapest dinner in the library, makes 4.'},
{n:'Homemade pizza night',m:45,c:2,t:['Calcium','Protein'],v:0,why:'A weekend treat that is still on budget.'},
{n:'Turkey meatballs & pasta',m:30,c:1,t:['Protein','Iron'],v:0,why:'Budget pick, 30 minutes.'},
{n:'Roast chicken & veg',m:90,c:3,t:['Protein','Vit C'],v:1,why:'Sunday roast; the carcass becomes soup.'},

const isBusy=i=>S.busy.has(D(i).getDay());
function renderWk(){const w=$('#wk');if(!w)return;let n=0,cost=0;
w.innerHTML=Array.from({length:S.days},(_,i)=>{const p=S.plan[i],st=p?'ok':S.pend===i?'pend':'';if(p){n++;cost+=EST[p.c]}

const m=$('#bar');if(m){m.style.width=(bt?Math.min(100,cost/bt*100):n/S.days*100)+'%';m.parentElement.classList.toggle('over',!!bt&&cost>bt)}}
function daysUI(){const e=h(`<div class="ctl"><div class="stp"><button type="button" class="ib" data-d="-1" aria-label="One fewer night">&minus;</button><output aria-live="polite"><b></b>nights</output><button type="button" class="ib" data-d="1" aria-label="One more night">+</button></div><div class="chips pre">${[7,14,21,28].map(n=>`<button type="button" class="tg" data-n="${n}">${n}</button>`).join('')}</div><p class="dim rtxt"></p></div>`);

e.onclick=ev=>{const b=ev.target.closest('[data-w]');if(!b)return;const d=+b.dataset.w;S.busy.has(d)?S.busy.delete(d):S.busy.add(d);b.setAttribute('aria-pressed',S.busy.has(d));renderWk()};return e}
function budgetUI(){const e=h(`<div class="ctl"><output class="big" aria-live="polite"></output><input type="range" min="0" max="100" step="5" aria-label="Weekly dinner budget in pounds"><p class="dim rtxt">Slide to 0 for no target.</p></div>`);
const r=e.querySelector('input'),o=e.querySelector('output');r.value=S.budget;const up=()=>{S.budget=+r.value;o.textContent=S.budget?`£${S.budget} a week`:'No target';renderWk()};r.oninput=up;up();return e}

e.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const p=b.textContent;S.prefs.has(p)?S.prefs.delete(p):S.prefs.add(p);b.setAttribute('aria-pressed',S.prefs.has(p))};return e}
const busyTxt=()=>S.busy.size?[...S.busy].sort((a,b)=>(a||7)-(b||7)).map(d=>DN[d].slice(0,3)).join(', '):'none';
const budTxt=()=>S.budget?`£${S.budget} a week`:'no budget target';
const prefTxt=()=>S.prefs.size?[...S.prefs].join(', '):'no preferences';
const summary=()=>`${S.days} nights from ${DL(0)}. Busy: ${busyTxt()}. Budget: ${budTxt()}. Preferences: ${prefTxt()}.`;
const thread=$('#thread');
const scr=()=>thread.lastElementChild&&thread.lastElementChild.scrollIntoView({block:'end',behavior:RM?'auto':'smooth'});
function say(t,w='h'){const l=document.createElement('li');l.className='msg '+w;l.textContent=t;thread.append(l);scr();return l}
function typing(){const l=h('<li class="msg h"><div class="dots" role="status" aria-label="Hermes is typing"><span></span><span></span><span></span></div></li>');thread.append(l);scr();return l}
function pickMeal(i,pred){const ok=m=>!S.used.has(m.n);let c=POOL.filter(m=>ok(m)&&(!pred||pred(m))&&(!isBusy(i)||m.m<=30||!S.prefs.has('Quick on busy days')));
if(!c.length)c=POOL.filter(ok);if(!c.length){S.used.clear();c=POOL.slice()}
if(S.prefs.has('More veg'))c=[...c.filter(m=>m.v),...c.filter(m=>!m.v)];if(S.prefs.has('Cheaper picks'))c.sort((a,b)=>a.c-b.c);return c[0]}
const nextDay=()=>{for(let i=0;i<S.days;i++)if(!S.plan[i]&&S.pend!==i)return i;return -1};
function card(i,m){const c=h(`<li class="card mc" data-d="${i}"><div class="mh"><b>${DL(i)}</b>${isBusy(i)?'<span class="chip busy">Busy day</span>':''}</div><h3>${m.n}</h3><p class="dim">${m.m} min &middot; ${TIERN[m.c]} &middot; about £${EST[m.c]}</p><div class="chips">${m.t.map(t=>`<span class="chip">${t}</span>`).join('')}</div><p class="why">${m.why}</p><div class="acts"></div></li>`);c._m=m;setSt(c,'pend');return c}
function setSt(c,st,r){c.dataset.st=st;const B=(a,t,k='btn')=>`<button type="button" class="${k}" data-act="${a}">${t}</button>`;
c.querySelector('.acts').innerHTML=st==='pend'?B('acc','Accept','btn pri')+B('rej','Reject'):st==='ok'?'<span class="bd ok">Accepted</span>'+B('undo','Undo','btn sm'):
st==='rejing'?'<span class="why">Why not?</span>'+['Too long','Had it lately','Too pricey','Not in the mood'].map(x=>`<button type="button" class="tg" data-act="why" data-r="${x}">${x}</button>`).join('')+B('back','Back','btn sm ghost'):
st==='no'?`<span class="bd no">Rejected: ${r}</span>`+B('undo','Undo','btn sm'):'<span class="bd">Replaced</span>'}
const cardOf=i=>[...thread.querySelectorAll(`.mc[data-d="${i}"]`)].pop();
function propose(pred){const i=nextDay();if(i<0)return wrap();const m=pickMeal(i,pred);S.pend=i;thread.append(card(i,m));renderWk();scr()}
let thinking=false;
async function hermes(txt,pred){while(thinking)await sleep(100);thinking=true;const t=typing();await sleep(RM?150:1000);t.remove();if(txt)say(txt);propose(pred);thinking=false}
function cont(){setTimeout(()=>{if(S.pend===null)hermes(nextDay()<0?'That fills every night.':'Next up.')},600)}
function accept(c){const i=+c.dataset.d,m=c._m;S.plan[i]=m;S.pend=null;S.used.add(m.n);S.last=i;setSt(c,'ok');renderWk();toast(`Added ${m.n} to ${DL(i)}`,'Undo',()=>undo(c));cont()}
function reject(c,r){const i=+c.dataset.d,m=c._m;S.pend=null;S.used.add(m.n);setSt(c,'no',r);renderWk();
hermes(`Fair, ${r.toLowerCase()}. Trying another.`,r==='Too long'?x=>x.m<=30:r==='Too pricey'?x=>x.c===1:null)}
function undo(c){const i=+c.dataset.d,m=c._m,was=c.dataset.st;if(was==='ok')delete S.plan[i];S.used.delete(m.n);
if(S.pend!==null&&S.pend!==i){const o=cardOf(S.pend);if(o)setSt(o,'rep')}S.pend=i;S.last=-1;setSt(c,'pend');renderWk();c.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'})}
function wrap(){S.pend=null;const ps=Object.entries(S.plan),cost=ps.reduce((a,[,m])=>a+EST[m.c],0),bt=S.budget?Math.round(S.budget*S.days/7):0;
const over=ps.filter(([i,m])=>isBusy(+i)&&m.m>30).length,veg=ps.filter(([,m])=>m.v).length;
const row=(ok,t)=>`<li class="${ok?'':'warn'}">${I(ok?'check':'bolt')}<span>${t}</span></li>`;
thread.append(h(`<li class="card wrapc"><h3>All ${S.days} nights planned</h3><ul>${row(true,ps.length+'/'+S.days+' dinners placed')}${row(!bt||cost<=bt,'Estimated £'+cost+(bt?' against £'+bt:''))}${row(!over,over?over+' busy night(s) over 30 min':'Every busy night is 30 minutes or under')}${row(veg>=ps.length/2,veg+' vegetable-led dinners')}</ul><button type="button" class="btn pri lg" data-act="save">Save plan</button></li>`));scr()}
function send(txt){say(txt,'u');const l=txt.toLowerCase();let pred=null,rep='Sure, another option.';
if(/quick|fast|short/.test(l)){pred=m=>m.m<=30;rep='Quicker it is, 30 minutes or under.'}
else if(/cheap|budget|pric/.test(l)){pred=m=>m.c===1;rep='Going for a budget pick.'}
else if(/veg/.test(l)){pred=m=>m.v;rep='More veg coming up.'}
else if(/fish|salmon|cod/.test(l)){pred=m=>m.t.includes('Omega-3');rep='Fish then.'}
else if(/surprise/.test(l))rep='Here is a wildcard.';
if(S.pend!==null){const pc=cardOf(S.pend);if(pc){S.used.add(pc._m.n);setSt(pc,'rep')}S.pend=null}
hermes(rep,pred)}
thread.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(a==='save'){b.disabled=true;b.textContent='Saved';toast('Plan saved. Shopping list updated.');return}
const c=b.closest('.mc');if(!c)return;
if(a==='acc')accept(c);else if(a==='rej')setSt(c,'rejing');else if(a==='back')setSt(c,'pend');else if(a==='why')reject(c,b.dataset.r);else if(a==='undo')undo(c)});
document.addEventListener('click',e=>{const b=e.target.closest('.cell');if(!b)return;const c=cardOf(+b.dataset.i);if(c){c.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1200)}else toast(DL(+b.dataset.i)+(isBusy(+b.dataset.i)?' is a busy day':' not planned yet'))});
$('#cf').addEventListener('submit',e=>{e.preventDefault();const i=$('#ci');const v=i.value.trim();if(!v)return;i.value='';send(v)});
$('#sug').addEventListener('click',e=>{const b=e.target.closest('button');if(b)send(b.textContent)});
function startChat(){renderWk();hermes('Planning '+summary()+' I will propose one night at a time. Accept, reject, or tell me what to change.')}
$('#back').onclick=()=>toast('Exit leaves your current plan untouched');
const ask=(prompt,build,fmt)=>new Promise(async res=>{const t=typing();await sleep(RM?100:700);t.remove();say(prompt);const w=h('<li class="msg h wid"></li>');w.append(build());const ok=h('<button type="button" class="btn pri sm">Done</button>');w.append(ok);thread.append(w);scr();
ok.onclick=()=>{w.querySelectorAll('button,input').forEach(x=>x.disabled=true);ok.remove();say(fmt(),'u');res()}});
(async()=>{await ask('How many nights shall I plan?',daysUI,()=>`${S.days} nights`);
await ask('Which evenings are busy?',busyUI,()=>`Busy: ${busyTxt()}`);
await ask('Any weekly budget?',budgetUI,()=>cap(budTxt()));
await ask('Anything I should lean towards?',prefsUI,()=>cap(prefTxt()));
$('#strip').hidden=false;$('#sug').hidden=false;$('#ci').disabled=false;$('#ci').placeholder='Tell Hermes what to change';startChat()})();
function cap(s){return s[0].toUpperCase()+s.slice(1)}
thread.addEventListener('pointerdown',e=>{const c=e.target.closest('.mc[data-st=pend]');if(!c||e.target.closest('button'))return;const x0=e.clientX;let dx=0;c.setPointerCapture(e.pointerId);c.style.transition='none';
const mv=ev=>{dx=ev.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`;c.dataset.sw=dx>40?'acc':dx<-40?'rej':''};
const up=()=>{c.removeEventListener('pointermove',mv);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);c.style.transition='';c.style.transform='';delete c.dataset.sw;if(dx>90)accept(c);else if(dx<-90)setSt(c,'rejing')};
c.addEventListener('pointermove',mv);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)});
const _card=card;window.card=function(i,m){const c=_card(i,m);if(!thread.querySelector('.hint'))c.querySelector('.acts').after(h('<p class="hint">Swipe right to accept, left to reject.</p>'));return c};
</script></body></html>
