<button type="button" class="btn pri lg" id="ate">I ate it</button>${back?'<button type="button" class="btn lg ghost" id="fb">Back to the last step</button>':''}</div>`);
const q=s=>e.querySelector(s),pl=n=>n+' portion'+(n===1?'':'s'),useBy=()=>F.store==='Fridge'?'Use by Sun 1 Nov':'Freezer: use within 3 months';
const up=()=>{F.k=Math.min(Math.max(F.k,0),max());q('#kl').textContent=pl(max())+' left after your portion.';q('#kn').textContent=F.k;q('[data-k="-1"]').disabled=F.k<=0;q('[data-k="1"]').disabled=F.k>=max();q('#kb').hidden=!F.keep;q('#kt').setAttribute('aria-pressed',F.keep);q('#ub').textContent=useBy()+'. Opens a Cooks record.';e.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.p===F.p));e.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===F.store))};
e.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.p){F.p=+b.dataset.p;F.k=max()}if(b.dataset.k)F.k+=+b.dataset.k;if(b.dataset.s)F.store=b.dataset.s;if(b.id==='kt'){F.keep=!F.keep}if(b.id==='fb')back();if(b.id==='ate')done();up()};
function done(){const keep=F.keep&&F.k>0;host.textContent='';const d=h(`<div class="fin"><div class="card fc hd"><span class="okc">${CHECK}</span><h2>Logged</h2><p>${pl(F.p)} added to Eaten.</p>${keep?`<p>${pl(F.k)} kept in the ${F.store.toLowerCase()}. ${useBy()}. Hermes can plan them as leftovers.</p>`:'<p class="dim">Leftovers are not tracked.</p>'}</div><div class="acts2"><button type="button" class="btn lg" id="un">Undo</button><button type="button" class="btn pri lg" id="hm">Back to Tonight</button></div></div>`);host.append(d);
d.querySelector('#un').onclick=()=>showFinish(host,back);d.querySelector('#hm').onclick=()=>toast('Would return to Tonight in the real app')}
host.append(e);up()}
addEventListener('keydown',e=>{if(e.target.matches('textarea,input:not([type=checkbox])'))return;if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key==='Escape')closeAll()});

const track=$('#track'),trays=$('#trays');let tsig='';
track.innerHTML=R.steps.map((s,i)=>`<section class="slide" aria-label="Step ${i+1} of ${N}"><p class="sn">Step ${i+1}</p><h1>${s.h}</h1><p class="sb">${s.b}</p>${needHTML(s)}${s.timer?`<button type="button" class="btn pri lg" data-tm="${i}"></button>`:''}</section>`).join('');
function sync(){$('#mt').textContent=`Step ${cur+1} of ${N}`;$('#sc').textContent=R.steps[cur].h;$('#mb').style.width=((cur+1)/N*100)+'%';$('#prev').style.visibility=cur?'visible':'hidden';$('#next').textContent=cur===N-1?'Finish':'Next step';$('#il').innerHTML=ingHTML();onHave();renderT()}
function renderT(){$$('[data-tm]').forEach(b=>{const i=+b.dataset.tm,t=T[i];b.textContent=t?(t.run?'Timer running in the tray':t.done?'Done. Restart in the tray':'Timer in the tray'):`Start ${fmt(R.steps[i].timer.s)} timer`;b.setAttribute('aria-disabled',!!t&&t.run)});
const ks=Object.keys(T),sg=ks.join();if(sg!==tsig){tsig=sg;trays.innerHTML=ks.map(i=>`<div class="card tr" data-i="${i}"><button type="button" class="tg" data-j="${i}" aria-label="Go to step ${+i+1}">${T[i].label}</button><output class="tv"></output><button type="button" class="btn sm" data-p="${i}"></button><button type="button" class="ib" data-x="${i}" aria-label="Remove ${T[i].label} timer">${I('x')}</button></div>`).join('')}
trays.querySelectorAll('.tr').forEach(r=>{const t=T[r.dataset.i];r.querySelector('output').textContent=fmt(t.left);r.querySelector('[data-p]').textContent=tlabel(t);r.classList.toggle('flashd',t.done)})}
track.onclick=e=>{const b=e.target.closest('[data-tm]');if(!b)return;const i=+b.dataset.tm;if(!T[i]){tm(i);T[i].run=true;trays.scrollIntoView&&0;renderT();toast(T[i].label+' timer started')}else toast('Control it in the timer tray below')};
trays.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.p)tgl(+b.dataset.p);if(b.dataset.j)go(+b.dataset.j);if(b.dataset.x){delete T[b.dataset.x];renderT()}};
let raf=0,lk=0;track.addEventListener('scroll',()=>{if(Date.now()<lk)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const i=Math.round(track.scrollLeft/track.clientWidth);if(i!==cur&&i>=0&&i<N){cur=i;sync()}})},{passive:true});
function go(i){cur=Math.max(0,Math.min(N-1,i));lk=Date.now()+(RM?100:700);track.scrollTo({left:cur*track.clientWidth,behavior:RM?'auto':'smooth'});sync()}
function next(){if(cur<N-1)go(cur+1);else openF()}function prev(){go(cur-1)}
$('#next').onclick=next;$('#prev').onclick=prev;
function onHave(){$('#gc').textContent=have.size+'/'+ING.length}
$('#acc').onclick=()=>{const a=$('#acc');a.setAttribute('aria-expanded',a.getAttribute('aria-expanded')!=='true')};
const fs=$('#fsheet'),ov=$('#ov');function openF(){showFinish($('#fhost'),closeAll);fs.classList.add('on');ov.classList.add('on')}function closeAll(){fs.classList.remove('on');ov.classList.remove('on')}
ov.onclick=closeAll;sheetDrag($('#gh'),fs,closeAll);
wake(true);sync();
