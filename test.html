<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Meal Planner — self-check</title>
</head>
<body>
<pre id="out">Running...</pre>

<script src="data.js"></script>
<script src="prefs.js"></script>
<script src="nutrition.js"></script>
<script src="shelf-life.js"></script>
<script src="generator.js"></script>
<script src="shopping-list.js"></script>
<script src="hermes-sync.js"></script>
<script src="products.js"></script>
<script src="exclusions.js"></script>
<script src="mealdb.js"></script>
<script src="plan-with-me.js"></script>
<script src="day-hints.js"></script>
<script src="ratings.js"></script>
<script src="plan-chat.js"></script>
<script src="cook-mode.js"></script>
<script src="plan.js"></script>
<script>
(async function () {
  "use strict";
  const lines = [];
  let pass = 0, fail = 0;

  function check(name, condition) {
    if (condition) { pass++; lines.push(`PASS ${name}`); }
    else { fail++; lines.push(`FAIL ${name}`); }
  }
  function deepEqual(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  const realPackData = await fetch("pack-sizes.json").then((r) => r.json());
  const tags = await fetch("ingredient-nutrient-tags.json").then((r) => r.json());
  const targets = await fetch("nutrition-targets.json").then((r) => r.json());
  const shelfData = await fetch("shelf-life.json").then((r) => r.json());
  const library = await fetch("meals.json").then((r) => r.json());

  // 1. weekendRuns from a known Monday
  check(
    "weekendRuns(Monday) === [[5,6,7],[12,13,14]]",
    deepEqual(MP.Generator.weekendRuns("2026-09-07"), [[5, 6, 7], [12, 13, 14]])
  );

  // 2. weekendRuns from a known Saturday
  check(
    "weekendRuns(Saturday) === [[1,2],[7,8,9],[14]]",
    deepEqual(MP.Generator.weekendRuns("2026-09-05"), [[1, 2], [7, 8, 9], [14]])
  );

  // 3. weekdayOf UTC-parse trap guard
  {
    const iso = "2026-09-07";
    const [y, m, d] = iso.split("-").map(Number);
    const expected = new Date(y, m - 1, d).getDay();
    check("weekdayOf(startDate, 1) matches a locally-constructed Date", MP.Generator.weekdayOf(iso, 1) === expected);
  }

  // 4/5/6 need a generated plan
  const plan = MP.Generator.generatePlan(library, tags, targets, shelfData, "2026-09-07");
  const mealsById = Object.fromEntries(library.map((m) => [m.id, m]));
  const runs = MP.Generator.weekendRuns("2026-09-07");


  // Phase 59: freezer-aware batch planning
  {
    const mk = (extra) => library.filter((m) => !["roast-chicken", "chorizo-pasta"].includes(m.id))
      .map((m) => (m.id === "chilli-con-carne" ? { ...m, servings: 5, ...extra } : m));
    const frozenSlots = (pl) => pl.days.filter((d) => d.slots.dinner && d.slots.dinner.frozenFrom).map((d) => ({ day: d.day, ...d.slots.dinner }));
    const fp = MP.Generator.generatePlan(mk({}), tags, targets, shelfData, "2026-09-07");
    const fz = frozenSlots(fp);
    check("freeze: 5-serving batch yields 2 frozen slots >= cookDay+5", fz.length === 2 && fz.every((s) => s.day >= s.frozenFrom + 5 && fp.days[s.frozenFrom - 1].slots.dinner.mealId === s.mealId));
    check("freeze: freezeBatches:false gives no frozen slots", frozenSlots(MP.Generator.generatePlan(mk({}), tags, targets, shelfData, "2026-09-07", undefined, {}, { freezeBatches: false })).length === 0);
    check("freeze: freezable:false gives no frozen slots", frozenSlots(MP.Generator.generatePlan(mk({ freezable: false }), tags, targets, shelfData, "2026-09-07")).length === 0);
    const fById = Object.fromEntries(mk({}).map((m) => [m.id, m]));
    const fw = MP.ShelfLife.checkPlanWarnings(fp, fById, shelfData);
    check("freeze: no shelf-life warning on frozen slots", fz.every((s) => !fw[`${s.day}-dinner`]));
    const notes = MP.ShelfLife.defrostNotes(fp, fById);
    check("freeze: defrost note the day before each frozen slot", fz.every((s) => (notes[s.day - 1] || []).some((n) => n.forDay === s.day)));
    const emptied = JSON.parse(JSON.stringify(fp));
    fz.forEach((s) => { emptied.days[s.day - 1].slots.dinner = { mealId: null }; });
    check("freeze: buildLists unchanged by frozen slots", JSON.stringify(MP.ShoppingList.buildLists(fp, fById, { items: {} })) === JSON.stringify(MP.ShoppingList.buildLists(emptied, fById, { items: {} })));
    const bad = JSON.parse(JSON.stringify(fp));
    bad.days[fz[0].frozenFrom - 1].slots.dinner = { mealId: "other" };
    check("freeze: frozenFrom ignored when the cook day no longer holds the meal", MP.frozenParentDay(bad, fz[0].day, bad.days[fz[0].day - 1].slots.dinner) === null);
    check("freeze: planMirror keeps frozenFrom", MP.Sync.planMirror(fp).days[fz[0].day - 1].slots.dinner.frozenFrom === fz[0].frozenFrom);
  }

  // 4. every run's first day holds an MP.isBatch meal; leftover days within
  // the parent's coverage (servings/fridge-life cap, same as generator.js's
  // `place()` loop) hold same id or a leadsTo child. Days beyond coverage
  // fall through to the normal top-up fill and are not leftover days.
  {
    let ok = true;
    for (const run of runs) {
      if (run.length < 2) continue;
      const first = mealsById[plan.days[run[0] - 1].slots.dinner.mealId];
      if (!first || !MP.isBatch(first)) { ok = false; break; }
      const coverage = Math.min(run.length, first.servings || 2, shelfData.cooked_leftovers.fridgeDays);
      for (let i = 1; i < coverage; i++) {
        const id = plan.days[run[i] - 1].slots.dinner.mealId;
        if (id !== first.id && !(first.leadsTo || []).includes(id)) { ok = false; break; }
      }
    }
    check("run-day-1 is MP.isBatch; leftover days within coverage are same id or leadsTo child", ok);
  }

  // 5. no dinner id appears on consecutive days outside a run
  {
    const runDays = new Set(runs.flatMap((r) => (r.length >= 2 ? r.slice(1) : [])));
    let ok = true;
    for (let day = 2; day <= 14; day++) {
      if (runDays.has(day)) continue;
      const prev = plan.days[day - 2].slots.dinner.mealId;
      const cur = plan.days[day - 1].slots.dinner.mealId;
      if (prev && cur && prev === cur) { ok = false; break; }
    }
    check("no dinner repeats on consecutive days outside a run", ok);
  }

  // 6. tiny library still fills all 14 days and alternates dinners
  {
    const tiny = [
      { id: "d1", mealTypes: ["dinner"], batchCook: false, prepEffort: "quick", ingredients: [] },
      { id: "d2", mealTypes: ["dinner"], batchCook: false, prepEffort: "quick", ingredients: [] },
      { id: "b1", mealTypes: ["breakfast"], batchCook: false, prepEffort: "quick", ingredients: [] },
      { id: "l1", mealTypes: ["lunch"], batchCook: false, prepEffort: "quick", ingredients: [] },
      { id: "s1", mealTypes: ["snack"], batchCook: false, prepEffort: "quick", ingredients: [] },
    ];
    let ok = true;
    let threw = false;
    let tinyPlan;
    try {
      tinyPlan = MP.Generator.generatePlan(tiny, tags, targets, shelfData, "2026-09-07");
    } catch (e) {
      threw = true;
    }
    if (!threw) {
      for (const d of tinyPlan.days) {
        if (!d.slots.breakfast.mealId || !d.slots.lunch.mealId || !d.slots.dinner.mealId || !d.slots.snack.mealId) ok = false;
      }
      for (let day = 2; day <= 14; day++) {
        if (tinyPlan.days[day - 2].slots.dinner.mealId === tinyPlan.days[day - 1].slots.dinner.mealId) ok = false;
      }
    }
    check("tiny library fills all 14 days without throwing, dinners alternate", !threw && ok);
  }

  // 7. rawSafeOn on real shelf-life.json values
  {
    const chorizo = mealsById["chorizo-pasta"];
    const roast = mealsById["roast-chicken"];
    const pantryOnly = { ingredients: [{ key: "pasta" }, { key: "gravy" }] };
    check("rawSafeOn(chorizo-pasta, day 5) === true", MP.ShelfLife.rawSafeOn(chorizo, 5, shelfData) === true);
    check("rawSafeOn(roast-chicken, day 5) === false", MP.ShelfLife.rawSafeOn(roast, 5, shelfData) === false);
    check("rawSafeOn(pantry-only meal, day 5) === true", MP.ShelfLife.rawSafeOn(pantryOnly, 5, shelfData) === true);
  }

  // 8. MP.filterMeals
  {
    check("filterMeals matches by name fragment", MP.filterMeals(library, "chicken fajitas").some((m) => m.id === "chicken-fajitas"));
    check("filterMeals matches by meal type", MP.filterMeals(library, "dinner").every((m) => m.mealTypes.includes("dinner")));
    check("filterMeals matches by ingredient", MP.filterMeals(library, "yogurt").some((m) => m.id === "oats-yogurt-banana"));
    check("filterMeals blank query returns full array", MP.filterMeals(library, "  ").length === library.length);
  }

  // 9a. aisleFor / groupByAisle
  {
    const SL = MP.ShoppingList;
    check('aisleFor chicken_breast = meat-fish', SL.aisleFor("chicken_breast", realPackData) === "meat-fish");
    check('aisleFor frozen_veg = frozen (longest match beats veg)', SL.aisleFor("frozen_veg", realPackData) === "frozen");
    check('aisleFor unknown = other', SL.aisleFor("zzz_widget", realPackData) === "other");
    check('aisleFor without aisles = other, no throw', SL.aisleFor("milk", { items: {} }) === "other");
    const lines = ["milk", "zzz_widget", "banana", "rice", "milk2"].map((key) => ({ key }));
    const groups = SL.groupByAisle(lines, realPackData);
    check('groupByAisle keeps every line once', groups.reduce((n, g) => n + g.lines.length, 0) === lines.length);
    check('groupByAisle store order, Other last', groups.map((g) => g.id).join() === "produce,chilled,cupboard,other");
  }

  // 9. MP.ShoppingList.parseQty
  {
    check('parseQty("500g") == {500,"g"}', deepEqual(MP.ShoppingList.parseQty("500g"), { value: 500, unit: "g" }));
    check('parseQty("2 slices") == {2,"slices"}', deepEqual(MP.ShoppingList.parseQty("2 slices"), { value: 2, unit: "slices" }));
    check('parseQty("1.5kg") == {1500,"g"}', deepEqual(MP.ShoppingList.parseQty("1.5kg"), { value: 1500, unit: "g" }));
    check('parseQty("1-2") == {1,"each"}', deepEqual(MP.ShoppingList.parseQty("1-2"), { value: 1, unit: "each" }));
    check('parseQty("") == null', MP.ShoppingList.parseQty("") === null);
    check('parseQty("handful, grated") == null', MP.ShoppingList.parseQty("handful, grated") === null);
    check('parseQty("Bisto") == null', MP.ShoppingList.parseQty("Bisto") === null);
    {
      const m = { servings: 4, ingredients: [{ key: "garlic", qty: "2 cloves" }, { key: "cheese", qty: "handful, grated" }] };
      check('scaleMeal own servings unchanged', deepEqual(MP.ShoppingList.scaleMeal(m, 4).map((l) => l.scaled), ["2 cloves", "handful, grated"]));
      const l = MP.ShoppingList.scaleMeal(m, 6);
      check('scaleMeal "2 cloves" x1.5 == "3 cloves"', l[0].scaled === "3 cloves" && !l[0].check);
      check('scaleMeal unparseable flagged, unchanged', l[1].check && l[1].scaled === "handful, grated");
    }
    check('parseQty("whole") == null', MP.ShoppingList.parseQty("whole") === null);
  }

  // 10. MP.ShoppingList.packsFor
  {
    const gPack = { packSize: 500, unit: "g" };
    check("packsFor(900g, 500g pack) == 2", MP.ShoppingList.packsFor({ value: 900, unit: "g" }, gPack) === 2);
    check("packsFor(500g, 500g pack) == 1", MP.ShoppingList.packsFor({ value: 500, unit: "g" }, gPack) === 1);
    check("packsFor(null, item) == 1", MP.ShoppingList.packsFor(null, gPack) === 1);
    check("packsFor(unit mismatch) == 1", MP.ShoppingList.packsFor({ value: 2, unit: "tbsp" }, gPack) === 1);
    check("packsFor(unknown item) == 1", MP.ShoppingList.packsFor({ value: 900, unit: "g" }, null) === 1);
  }

  const packData = {
    pricesAsOf: "2026-09",
    items: {
      beef_mince: { label: "Beef mince", packSize: 500, unit: "g", price: 4 },
      tortillas: { label: "Tortillas", packSize: 1, unit: "each", price: 1.3 },
      cheese: { label: "Cheese", packSize: 400, unit: "g", price: 3 },
      rice: { label: "Rice", packSize: 1000, unit: "g", price: 1.2 },
      peppers: { label: "Peppers", packSize: 1, unit: "each", price: 1.1 },
      onion: { label: "Onion", packSize: 1000, unit: "g", price: 0.85 },
      cannellini_beans: { label: "Cannellini beans", packSize: 1, unit: "tins", price: 0.65 },
      white_bread: { label: "White bread", packSize: 16, unit: "slices", price: 1.1 },
      gravy: { label: "Gravy", packSize: 1, unit: "each", price: 1.6, staple: true },
    },
  };

  function emptyPlanDays() {
    return Array.from({ length: 14 }, (_, i) => ({
      day: i + 1,
      slots: { breakfast: null, lunch: null, dinner: null, snack: null },
    }));
  }

  // 11. Batch dedupe: chilli-con-carne on days 5,6,7 -> beef_mince once
  {
    const days = emptyPlanDays();
    [5, 6, 7].forEach((d) => (days[d - 1].slots.dinner = { mealId: "chilli-con-carne" }));
    const plan = { startDate: "2026-09-07", days };
    const lists = MP.ShoppingList.buildLists(plan, mealsById, packData);
    const line = lists["1"].lines.find((l) => l.key === "beef_mince");
    check(
      "batch dedupe: chilli-con-carne days 5-7 yields beef_mince once at 1 pack",
      !!line && line.packs === 1 && deepEqual(line.needed, { value: 500, unit: "g" })
    );
  }

  // 12. Non-batch repeat is not deduped (both occurrences counted, not folded into one)
  {
    const days = emptyPlanDays();
    [1, 2].forEach((d) => (days[d - 1].slots.snack = { mealId: "egg-pb-toast-snack" }));
    const plan = { startDate: "2026-09-07", days };
    const eggPack = { items: { egg: { label: "Egg", packSize: 6, unit: "each", price: 1.75 } } };
    const lists = MP.ShoppingList.buildLists(plan, mealsById, eggPack);
    const line = lists["1"].lines.find((l) => l.key === "egg");
    check(
      "non-batchCook meal repeated on days 1-2 sums both occurrences (2 eggs)",
      !!line && deepEqual(line.needed, { value: 2, unit: "each" })
    );
  }

  // 13/14. Leftover exclusion, both forms
  {
    const days = emptyPlanDays();
    days[0].slots.dinner = { mealId: "roast-chicken" };
    days[1].slots.dinner = { mealId: "chicken-fajitas" };
    days[2].slots.lunch = { mealId: "toastie-chicken-cheese" };
    const plan = { startDate: "2026-09-07", days };
    const lists = MP.ShoppingList.buildLists(plan, mealsById, packData);
    const week1keys = [...lists["1"].lines, ...lists["1"].staples, ...lists["1"].estimated].map((l) => l.key);
    check("chicken-fajitas contributes tortillas", week1keys.includes("tortillas"));
    check("chicken-fajitas does not contribute leftover_chicken", !week1keys.includes("leftover_chicken"));
    check("toastie-chicken-cheese contributes white_bread and cheese", week1keys.includes("white_bread") && week1keys.includes("cheese"));
    check("toastie-chicken-cheese does not contribute chicken_breast (leftover, sliced)", !week1keys.includes("chicken_breast"));
  }

  // 15. Shop-day split
  {
    const days = emptyPlanDays();
    days[6].slots.dinner = { mealId: "salmon-rice-broccoli" };
    days[7].slots.dinner = { mealId: "salmon-rice-broccoli" };
    const plan = { startDate: "2026-09-07", days };
    const salmonPack = { items: { salmon: { label: "Salmon", packSize: 1, unit: "each", price: 4.5 } } };
    const lists = MP.ShoppingList.buildLists(plan, mealsById, salmonPack);
    check("day 7 dinner lands in shop list 1", lists["1"].lines.some((l) => l.key === "salmon"));
    check("day 8 dinner lands in shop list 8", lists["8"].lines.some((l) => l.key === "salmon"));
  }

  // 16. Unknown key unpriced, staple excluded, total matches hand-computed sum
  {
    const days = emptyPlanDays();
    days[0].slots.dinner = { mealId: "roast-chicken" }; // gravy (staple), carrots+potatoes (unpriced here), chicken_roast
    const plan = { startDate: "2026-09-07", days };
    const minimalPack = {
      items: {
        chicken_roast: { label: "Chicken", packSize: 1, unit: "each", price: 5.5 },
        gravy: { label: "Gravy", packSize: 1, unit: "each", price: 1.6, staple: true },
      },
    };
    const lists = MP.ShoppingList.buildLists(plan, mealsById, minimalPack);
    const carrotsLine = lists["1"].estimated.find((l) => l.key === "carrots");
    const gravyLine = lists["1"].staples.find((l) => l.key === "gravy");
    check("unknown key lands in estimated and contributes 0 (no categories fallback data)", !!carrotsLine && carrotsLine.lineCost === 0);
    check("staple:true lands in staples, excluded from total", !!gravyLine && lists["1"].total === 5.5);
  }

  // 17. Edge cases: null slots, missing mealId, empty ingredients
  {
    const days = emptyPlanDays();
    days[0].slots.dinner = { mealId: "does-not-exist" };
    days[1].slots.dinner = null;
    const plan = { startDate: "2026-09-07", days };
    let threw = false;
    let lists;
    try {
      lists = MP.ShoppingList.buildLists(plan, mealsById, packData);
    } catch (e) {
      threw = true;
    }
    check("missing mealId and null slots are skipped without throwing", !threw && lists["1"].lines.length === 0);
  }

  // 18. MP.Sync.decide — last-write-wins
  {
    const { decide, needsPlan } = MP.Sync;
    check(
      'decide(null, remote) === "pull" (Trap 1: unstamped seed never beats a real library)',
      decide(null, { updatedAt: "2026-09-01T00:00:00Z", meals: [] }) === "pull"
    );
    check('decide(null, null) === "push" (first-ever bootstrap)', decide(null, null) === "push");
    check('decide(stamped, null) === "push"', decide("2026-09-02T00:00:00Z", null) === "push");
    check(
      'decide(newer local, older remote) === "push"',
      decide("2026-09-02T00:00:00Z", { updatedAt: "2026-09-01T00:00:00Z", meals: [] }) === "push"
    );
    check(
      'decide(older local, newer remote) === "pull"',
      decide("2026-09-01T00:00:00Z", { updatedAt: "2026-09-02T00:00:00Z", meals: [] }) === "pull"
    );
    check(
      "decide(identical timestamps) === \"noop\" (must not thrash KV on every poll)",
      decide("2026-09-01T00:00:00Z", { updatedAt: "2026-09-01T00:00:00Z", meals: [] }) === "noop"
    );
    check(
      'decide(local, garbage remote updatedAt) === "push"',
      decide("2026-09-01T00:00:00Z", { updatedAt: "not a date", meals: [] }) === "push"
    );
  }

  // 19. MP.Sync.needsPlan
  {
    const { needsPlan } = MP.Sync;
    check("needsPlan(null, null) === false", needsPlan(null, null) === false);
    check("needsPlan({}, null) === false", needsPlan({}, null) === false);
    check(
      "needsPlan(unacked flag, null) === true",
      needsPlan({ requestedAt: "2026-09-03T10:00:00Z", ackedAt: null }, null) === true
    );
    check(
      "needsPlan(ackedAt after requestedAt) === false",
      needsPlan({ requestedAt: "2026-09-03T10:00:00Z", ackedAt: "2026-09-03T11:00:00Z" }, null) === false
    );
    check(
      "needsPlan(unacked flag, localAckedAt after requestedAt) === false (KV propagation suppression)",
      needsPlan({ requestedAt: "2026-09-03T10:00:00Z", ackedAt: null }, "2026-09-03T11:00:00Z") === false
    );
    check(
      "needsPlan(new requestedAt after both acks) === true",
      needsPlan({ requestedAt: "2026-09-03T12:00:00Z", ackedAt: "2026-09-03T11:00:00Z" }, "2026-09-03T11:00:00Z") === true
    );
  }

  // 20. MP.Exclusions.hasMushroom
  {
    const { hasMushroom } = MP.Exclusions;
    check('hasMushroom([{key:"mushrooms"}]) === true', hasMushroom([{ key: "mushrooms" }]) === true);
    check(
      'hasMushroom([{key:"beef", label:"Mushroom Soup Mix"}]) === true (label checked too)',
      hasMushroom([{ key: "beef", label: "Mushroom Soup Mix" }]) === true
    );
    check('hasMushroom([{key:"chicken_breast"}]) === false', hasMushroom([{ key: "chicken_breast" }]) === false);
  }

  // 21. MP.Exclusions.isStandaloneEgg
  {
    const { isStandaloneEgg } = MP.Exclusions;
    check('isStandaloneEgg(bare egg) === true', isStandaloneEgg({ ingredients: [{ key: "eggs" }] }) === true);
    check(
      'isStandaloneEgg(egg + bread) === true',
      isStandaloneEgg({ ingredients: [{ key: "egg" }, { key: "white_bread" }] }) === true
    );
    check("isStandaloneEgg(seed french-toast) === false", isStandaloneEgg(mealsById["french-toast"]) === false);
    check(
      "isStandaloneEgg(seed egg-pb-toast-snack) === false (the loud one)",
      isStandaloneEgg(mealsById["egg-pb-toast-snack"]) === false
    );
  }

  // 22. MP.Exclusions.hasVegInToastie
  {
    const { hasVegInToastie } = MP.Exclusions;
    check(
      'hasVegInToastie(toastie + onions) === true',
      hasVegInToastie({ id: "toastie-x", ingredients: [{ key: "onions" }] }) === true
    );
    check("hasVegInToastie(seed toastie-ham-cheese) === false", hasVegInToastie(mealsById["toastie-ham-cheese"]) === false);
    check(
      "hasVegInToastie(non-toastie with onions) === false (rule is veg-in-toasties, not veg dislike)",
      hasVegInToastie({ id: "beef-mince-baked-beans", ingredients: [{ key: "onions" }] }) === false
    );
  }

  // 23. every meal in meals.json passes check().ok
  {
    const failing = library.filter((m) => !MP.Exclusions.check(m).ok);
    check(
      "every meal in meals.json passes check().ok (best single check in this phase)",
      failing.length === 0
    );
  }

  // 24. MP.Exclusions.sanitize
  {
    const { sanitize } = MP.Exclusions;
    const mushroomMeal = {
      id: "m1",
      ingredients: [{ key: "mushrooms", label: "Mushrooms", qty: "200g" }, { key: "rice", qty: "" }],
    };
    const subs = { mushroom: { key: "courgette", label: "Courgette" } };
    const result = sanitize(mushroomMeal, subs);
    check("sanitize(mushroom meal) result has no mushroom", !!result && !MP.Exclusions.hasMushroom(result.meal.ingredients));
    check("sanitize(mushroom meal) substituted.length === 1", !!result && result.substituted.length === 1);
    check(
      "sanitize does not mutate its input (original still has mushroom)",
      MP.Exclusions.hasMushroom(mushroomMeal.ingredients)
    );

    check(
      "sanitize(standalone-egg meal) === null",
      sanitize({ ingredients: [{ key: "egg" }] }, subs) === null
    );

    const cleanMeal = { id: "c1", ingredients: [{ key: "rice" }] };
    const cleanResult = sanitize(cleanMeal, subs);
    check(

      check("applyPlacements: rejects day 15", badDay2.rejected[0].reason === "bad-slot");
      const badSlot = applyPlacements(p, [{ day: 2, slot: "brunch", mealId: "m2" }], lib);
      check("applyPlacements: rejects a bogus slot name", badSlot.rejected[0].reason === "bad-slot");

      const mixed = applyPlacements(p, [
        { day: 2, slot: "dinner", mealId: "m2" },
        { day: 1, slot: "dinner", mealId: "m2" },
      ], lib);
      check("applyPlacements: a mixed queue yields both applied and rejected", mixed.applied.length === 1 && mixed.rejected.length === 1);
    }

    // Phase 80: leftover placements
    {
      const lib = [{ id: "m1", name: "Meal One", servings: 4, ingredients: [{ key: "beef_mince", qty: "500g" }] }];
      const p = { startDate: "2026-09-07", days: [{ day: 1, slots: { dinner: null } }, { day: 2, slots: { dinner: null } }] };
      const r = applyPlacements(p, [{ day: 1, slot: "dinner", mealId: "m1", leftover: true, portions: 3 }, { day: 2, slot: "dinner", mealId: "m1" }], lib);
      check("leftover: slot is flagged with its portions", r.plan.days[0].slots.dinner.leftover === true && r.plan.days[0].slots.dinner.leftoverPortions === 3);
      check("leftover: a normal placement is not flagged", !r.plan.days[1].slots.dinner.leftover);
      check("leftover: applied entry says leftover", r.applied[0].leftover === true && !r.applied[1].leftover);
      const fx = { startDate: "2026-09-07", days: Array.from({ length: 14 }, (_, i) => ({ day: i + 1, slots: {} })) };
      const mine = (leftover) => { const pl = JSON.parse(JSON.stringify(fx)); pl.days[4].slots.dinner = { mealId: "chilli-con-carne", ...(leftover ? { leftover: true } : {}) }; return pl; };
      const mince = (pl) => { const l = MP.ShoppingList.buildLists(pl, mealsById, packData); return Object.values(l).flatMap((x) => x.lines).filter((x) => x.key === "beef_mince").length; };
      check("leftover: control, a normal chilli slot buys mince", mince(mine(false)) === 1);
      check("leftover: a leftover chilli slot buys no mince", mince(mine(true)) === 0);
      const baseline = MP.Cooks.all().length;
      const slotted = { ...r.plan, days: r.plan.days.map((d) => ({ ...d, slots: { ...d.slots } })) };
      const changed = MP.Plan.openLeftoverCooks(slotted, lib);
      check("leftover: opens one Cooks record with the portions", changed && MP.Cooks.all().length === baseline + 1 && MP.Cooks.openFor("m1")[0].portionsLeft === 3);
      check("leftover: a second pass opens nothing", !MP.Plan.openLeftoverCooks(slotted, lib) && MP.Cooks.all().length === baseline + 1);
      MP.Cooks.discard(MP.Cooks.openFor("m1")[0].id);
    }

    // methodOf / fillMethods (cooking-mode steps)
    {
      const st = [{ text: " Boil ", minutes: 10 }, { text: "Serve" }];
      check("methodOf: no method is none", deepEqual(MP.methodOf({}), { status: "none", steps: [] }));
      check("methodOf: null meal is none", MP.methodOf(null).status === "none");
      check("methodOf: steps without a status read as accepted, text trimmed, missing minutes null",
        deepEqual(MP.methodOf({ method: st }), { status: "accepted", steps: [{ text: "Boil", minutes: 10 }, { text: "Serve", minutes: null }] }));
      check("methodOf: drafted status is kept", MP.methodOf({ method: st, methodStatus: "drafted" }).status === "drafted");
      check("methodOf: bad shapes read as none",
        [{ method: "x" }, { method: [] }, { method: [{ text: "" }, null, { text: 5 }] }, { method: {} }].every((m) => MP.methodOf(m).status === "none"));
      check("methodOf: bad minutes become null", MP.methodOf({ method: [{ text: "a", minutes: -3 }, { text: "b", minutes: "5" }] }).steps.every((x) => x.minutes === null));
      const seed = [{ id: "a", method: st, methodStatus: "drafted" }, { id: "b", method: st, methodStatus: "drafted" }];
      const lib = [{ id: "a" }, { id: "b", method: [{ text: "mine" }], methodStatus: "accepted" }, { id: "c" }];
      check("fillMethods: fills only a meal with none", MP.fillMethods(lib, seed) === true && lib[0].methodStatus === "drafted" && lib[2].method === undefined);
      check("fillMethods: never overwrites an edited method", lib[1].method[0].text === "mine" && lib[1].methodStatus === "accepted");
      check("fillMethods: second pass changes nothing", MP.fillMethods(lib, seed) === false);
    }

    // matchEatRequests (assistant "I ate X" queue)
    {
      const lib = [{ id: "m1", name: "Meal One" }, { id: "m2", name: "Meal Two" }];
      const p = { startDate: "2026-09-07", days: [
        { day: 1, slots: { lunch: { mealId: "m1" }, dinner: { mealId: "m1" } } },
        { day: 2, slots: { dinner: { mealId: "m2", eatenAt: "2026-09-08T19:00:00.000Z" } } },
      ] };
      const clone = JSON.parse(JSON.stringify(p));
      const at = (d, h) => new Date(2026, 8, d, h).toISOString();
      const r = (mealId, iso) => ({ id: `${mealId}:${iso}`, mealId, eatenAt: iso, requestedAt: iso });
      const two = MP.Plan.matchEatRequests(p, [r("m1", at(7, 12)), r("m1", at(7, 19)), r("m1", at(7, 20))], lib);
      check("matchEatRequests: lands on the first un-eaten slot with that meal, then the next",
        deepEqual(two.applied.map((a) => [a.day, a.slotType]), [[1, "lunch"], [1, "dinner"]]));
      check("matchEatRequests: a third eat of the same meal that day is rejected as already eaten",
        two.rejected.length === 1 && two.rejected[0].reason === "eaten");
      check("matchEatRequests: keeps the request's eatenAt and id", two.applied[0].eatenAt === at(7, 12) && two.applied[0].id === `m1:${at(7, 12)}`);
      check("matchEatRequests: input plan is not mutated", deepEqual(p, clone));
      check("matchEatRequests: an eaten slot is never overwritten",
        MP.Plan.matchEatRequests(p, [r("m2", at(8, 20))], lib).rejected[0].reason === "eaten");
      check("matchEatRequests: a library meal not on that day's plan goes off-plan, not rejected",
        (() => { const o = MP.Plan.matchEatRequests(p, [r("m2", at(7, 12))], lib); return o.offPlan.length === 1 && o.offPlan[0].mealId === "m2" && !o.rejected.length && !o.applied.length; })());
      check("matchEatRequests: a date outside the plan goes off-plan",
        MP.Plan.matchEatRequests(p, [r("m1", at(20, 12))], lib).offPlan.length === 1);
      check("matchEatRequests: an off-plan replay (id in the eaten log) is eaten",
        (() => { const q = r("m2", at(7, 12)); const o = MP.Plan.matchEatRequests(p, [q], lib, [{ id: q.id }]); return !o.offPlan.length && o.rejected[0].reason === "eaten"; })());
      check("matchEatRequests: the same off-plan request twice in a batch applies once",
        (() => { const q = r("m2", at(7, 12)); const o = MP.Plan.matchEatRequests(p, [q, q], lib); return o.offPlan.length === 1 && o.rejected[0].reason === "eaten"; })());
      check("matchEatRequests: an unknown meal is rejected",
        MP.Plan.matchEatRequests(p, [r("zzz", at(7, 12))], lib).rejected[0].reason === "unknown-meal");
      {
        const dup = [{ id: "m1", name: "Meal One" }];
        const p2 = { startDate: "2026-09-07", days: [{ day: 1, slots: { lunch: { mealId: "m1" }, dinner: { mealId: "m1" } } }] };
        const once = MP.Plan.matchEatRequests(p2, [r("m1", at(7, 12)), r("m1", at(7, 12))], dup);
        check("confirm-cook: two identical queue entries apply once, the duplicate is reported eaten",
          once.applied.length === 1 && once.rejected.length === 1 && once.rejected[0].reason === "eaten");
        p2.days[0].slots.lunch.eatenAt = at(7, 12);
        const replay = MP.Plan.matchEatRequests(p2, [r("m1", at(7, 12))], dup);
        check("confirm-cook: replay after eatenAt is set does not take the other slot",
          replay.applied.length === 0 && replay.rejected[0].reason === "eaten");
        check("confirm-cook: a different eatenAt still takes the free slot",
          MP.Plan.matchEatRequests(p2, [r("m1", at(7, 19))], dup).applied.length === 1);
      }
      localStorage.setItem("mp_foodLog", "garbage");
      check("localFoodLog: a malformed mirror is []", deepEqual(MP.Sync.localFoodLog(), []));
      localStorage.setItem("mp_foodLog", JSON.stringify({ entries: [{ id: "f1", kind: "eat" }, null] }));
      check("localFoodLog: returns entries, dropping junk", MP.Sync.localFoodLog().length === 1);
      localStorage.removeItem("mp_foodLog");
      {
        const g = MP.Sync.groupFoodLog([{ id: "a" }, { id: "m:0", group: "m", meal: "Burger" }, { id: "b" }, { id: "m:1", group: "m", meal: "Burger" }]);
        check("groupFoodLog: a meal's entries are one row at first sight", g.length === 3 && g[1].meal === "Burger" && g[1].entries.length === 2 && g[0].meal === null);
      }
      {
        const tg = { protein_g: 50, vitC_mg: 80 };
        const fe = MP.Nutrition.foodAsEaten({ id: "f1", name: "x", when: "2026-09-07T12:00:00Z", nutrients: { vitC_mg: { value: 40 } } }, tg, 0.1);
        const wg = MP.Nutrition.weekGaps([fe], {}, ["2026-09-07"], {}, tg, () => "2026-09-07");
        check("gap strip: a food-log entry marks its day logged", wg.days[0].logged && wg.nutrients.length > 0);
      }
      check("newSince: only entries after the ack, ascending",
        deepEqual(MP.Sync.newSince([r("b", at(7, 13)), r("a", at(7, 11)), r("c", at(7, 9))], at(7, 10)).map((x) => x.mealId), ["a", "b"]));
      check("newSince: a missing list is []", deepEqual(MP.Sync.newSince(undefined, null), []));
    }

    // GET /shopping parity: the Worker runs buildLists over the /plan mirror;
    // it must equal the shopping page's list over the full local plan.
    {
      const p2 = JSON.parse(JSON.stringify(plan));
      const firstDinner = p2.days.find((d) => d.slots.dinner && d.slots.dinner.mealId);
      const dm = library.find((m) => m.id === firstDinner.slots.dinner.mealId);
      firstDinner.slots.dinner.subs = [{ from: dm.ingredients[0].key, to: "parity_swap", label: "Parity Swap" }];
      firstDinner.slots.dinner.cookNote = "local-only field";
      const byId = Object.fromEntries(library.map((m) => [m.id, m]));
      const pantry = { items: [{ name: "onion", qty: "2" }] };
      const local = MP.ShoppingList.buildLists(p2, byId, realPackData, pantry);
      const worker = MP.ShoppingList.buildLists(MP.Sync.planMirror(p2), byId, realPackData, pantry);
      check("buildLists parity: /plan mirror (Worker) === full local plan (browser)", deepEqual(worker, local));
      check("buildLists parity: the mirror carries subs, so the swap is on the list",
        [1, 8].some((d) => worker[d].lines.concat(worker[d].staples).some((l) => l.key === "parity_swap")));
    }

    // MP.Prefs.bump / score
    {
      const backup = localStorage.getItem("mp_prefs");
      const dirtyBackup = localStorage.getItem("mp_prefs_dirty");
      try {
        localStorage.removeItem("mp_prefs");
        MP.Prefs.bump({ id: "m1", name: "Meal One" }, "liked");
        check("MP.Prefs.bump: creates a record", MP.Prefs.get().m1.liked === 1);
        MP.Prefs.bump({ id: "m1" }, "liked");
        check("MP.Prefs.bump: increments", MP.Prefs.get().m1.liked === 2);
        check("MP.Prefs.bump: sets lastAt", typeof MP.Prefs.get().m1.lastAt === "string");
        MP.Prefs.bump({ id: "m1" }, "nonsense");
        check("MP.Prefs.bump: no-ops on an unknown field", MP.Prefs.get().m1.liked === 2 && MP.Prefs.get().m1.nonsense === undefined);
        localStorage.setItem("mp_prefs", "not json{{{");
        check("MP.Prefs.get: survives corrupt mp_prefs", deepEqual(MP.Prefs.get(), {}));
        MP.Prefs.bump({ id: "m2", name: "M2" }, "eaten");
        check("MP.Prefs.bump: survives corrupt mp_prefs and still writes", MP.Prefs.get().m2.eaten === 1);
      } finally {
        if (backup === null) localStorage.removeItem("mp_prefs"); else localStorage.setItem("mp_prefs", backup);
        if (dirtyBackup === null) localStorage.removeItem("mp_prefs_dirty"); else localStorage.setItem("mp_prefs_dirty", dirtyBackup);
      }
    }

    // orderByTaste
    {
      const meals = [
        { id: "a", ingredients: [{ key: "chicken_breast" }, { key: "rice" }] },
        { id: "b", ingredients: [{ key: "beef_mince" }] },
        { id: "c", ingredients: [{ key: "rice" }] },
      ];
      const emptyPrefs = {};
      const identity = MP.Prefs.orderByTaste(meals, emptyPrefs, meals);
      check("orderByTaste: identity permutation when prefs is empty", deepEqual(identity.map((m) => m.id), ["a", "b", "c"]));

      const prefs = { a: { liked: 5, dismissed: 0, eaten: 0 } };
      const ordered = MP.Prefs.orderByTaste(meals, prefs, meals);
      check("orderByTaste: output is a permutation of the input", deepEqual([...ordered.map((m) => m.id)].sort(), ["a", "b", "c"]));
      check("orderByTaste: a meal sharing tokens with a well-liked meal outranks one that doesn't",
        ordered.findIndex((m) => m.id === "c") < ordered.findIndex((m) => m.id === "b"));
    }

    // Worker validators (re-declared here since worker/worker.js is an ES module, not a <script>)
    {
      function planError(parsed) {
        if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) return "expected an object";
        if (!Array.isArray(parsed.days)) return "days must be an array";
        return null;
      }
      function placementsError(parsed) {
        if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) return "expected an object";
        if (!Array.isArray(parsed.placements)) return "placements must be an array";
        return null;
      }
      function prefsError(parsed) {
        if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) return "expected an object";
        if (typeof parsed.prefs !== "object" || parsed.prefs === null || Array.isArray(parsed.prefs)) return "prefs must be a plain object";
        return null;
      }
      check("planError: rejects a bare string", typeof planError("nope") === "string");
      check("planError: rejects null", typeof planError(null) === "string");
      check("planError: accepts a minimal valid body", planError({ days: [] }) === null);
      check("placementsError: rejects a bare string", typeof placementsError("nope") === "string");
      check("placementsError: rejects null", typeof placementsError(null) === "string");
      check("placementsError: accepts a minimal valid body", placementsError({ placements: [] }) === null);
      check("prefsError: rejects a bare string", typeof prefsError("nope") === "string");
      check("prefsError: rejects null", typeof prefsError(null) === "string");
      check("prefsError: rejects array-shaped prefs", typeof prefsError({ prefs: [] }) === "string");
      check("prefsError: accepts a minimal valid body", prefsError({ prefs: {} }) === null);
    }
  }

  // ---- Group 33: Phase 14 (meal variants) ----
  {
    // effectiveMeal / findVariant / variantLabel
    const base = {
      id: "m1", name: "Base Meal", instructions: "base instructions",
      ingredients: [{ key: "pasta", qty: "200g" }],
      variants: [
        { id: "v1", name: "cream sauce", ingredients: [{ key: "cream", qty: "100ml" }], instructions: "cream instructions" },
        { id: "v2", name: "no ingredients variant" }, // missing `ingredients` on purpose
      ],
    };
    const baseNoVariants = { id: "m2", name: "Plain Meal", ingredients: [{ key: "rice", qty: "100g" }] };
    const baseEmptyVariants = { id: "m3", name: "Empty Variants Meal", ingredients: [{ key: "rice", qty: "100g" }], variants: [] };

    check("effectiveMeal: same object for null variantId", MP.effectiveMeal(base, null) === base);
    check("effectiveMeal: same object for undefined variantId", MP.effectiveMeal(base, undefined) === base);
    check("effectiveMeal: same object for an unknown variantId", MP.effectiveMeal(base, "nope") === base);
    check("effectiveMeal: survives a meal with variants: []", MP.effectiveMeal(baseEmptyVariants, "v1") === baseEmptyVariants);
    check("effectiveMeal: no throw for a meal with no variants key", MP.effectiveMeal(baseNoVariants, "v1") === baseNoVariants);
    {
      const merged = MP.effectiveMeal(base, "v1");
      check("effectiveMeal: merges ingredients for a known variant", deepEqual(merged.ingredients, base.variants[0].ingredients));
      check("effectiveMeal: merges instructions for a known variant", merged.instructions === "cream instructions");
      check("effectiveMeal: keeps meal.id", merged.id === "m1");
      check("effectiveMeal: never mutates the base meal", deepEqual(base.ingredients, [{ key: "pasta", qty: "200g" }]));
    }
    check("effectiveMeal: falls back to base for a variant missing ingredients", MP.effectiveMeal(base, "v2") === base);

    check("findVariant: null for the base (no variantId)", MP.findVariant(base, null) === null);
    check("findVariant: null for an unknown variantId", MP.findVariant(base, "nope") === null);
    check("findVariant: no throw for a meal with no variants key", MP.findVariant(baseNoVariants, "v1") === null);
    check("findVariant: finds a known variant", MP.findVariant(base, "v1") === base.variants[0]);
    check("variantLabel: \"\" for the base", MP.variantLabel(base, null) === "");
    check("variantLabel: correct label for a known variant", MP.variantLabel(base, "v1") === "cream sauce");

    // Variety-guard / filterMeals regressions: exercised against the real seed
    // library + generated plan from the top of this file, which now carries
    // a chorizo-pasta variant (D3: variants must not affect either path).
    {
      const chorizo = library.find((m) => m.id === "chorizo-pasta");
      check("seed fixture: chorizo-pasta carries a variant to regress against", !!(chorizo && chorizo.variants && chorizo.variants.length));
      // Same shape as check #5 above (no dinner repeats outside a run), scoped
      // to the one meal in the seed library that now carries a variant.
      const runDays = new Set(runs.flatMap((r) => (r.length >= 2 ? r.slice(1) : [])));
      let ok = true;
      for (let day = 2; day <= 14; day++) {
        if (runDays.has(day)) continue;
        const prev = plan.days[day - 2].slots.dinner.mealId;
        const cur = plan.days[day - 1].slots.dinner.mealId;
        if (prev === "chorizo-pasta" && cur === "chorizo-pasta") { ok = false; break; }
      }
      check("variety guard: a meal with variants still can't repeat on consecutive non-batch days", ok);
      check("filterMeals: a family with variants returns exactly one row", MP.filterMeals(library, "chorizo").length === 1);
    }

    // Slot handling: changing a slot's meal clears variantId; applyPlacements
    // with an unknown variantId applies against the base rather than rejecting.
    {
      const lib = [
        { id: "m1", name: "Meal One" },
        { id: "m2", name: "Meal Two", variants: [{ id: "v1", name: "V1", ingredients: [] }] },
      ];
      const p = { days: [{ day: 1, slots: { dinner: { mealId: "m1", variantId: "stale" } } }] };
      const swapped = MP.Plan.applyPlacements(p, [{ day: 1, slot: "dinner", mealId: "m2" }], lib);
      check("applyPlacements: changing a slot's meal clears variantId",
        !("variantId" in swapped.plan.days[0].slots.dinner));

      const unknownVariant = MP.Plan.applyPlacements(p, [{ day: 1, slot: "dinner", mealId: "m2", variantId: "nope" }], lib);
      check("applyPlacements: an unknown variantId applies against the base, doesn't reject",
        unknownVariant.applied.length === 1 && !("variantId" in unknownVariant.plan.days[0].slots.dinner));

      const knownVariant = MP.Plan.applyPlacements(p, [{ day: 1, slot: "dinner", mealId: "m2", variantId: "v1" }], lib);
      check("applyPlacements: a known variantId is applied",
        knownVariant.plan.days[0].slots.dinner.variantId === "v1");
    }

    // mealsError (re-declared here since worker/worker.js is an ES module, not a <script>)
    {
      function mealsError(parsed) {
        if (!Array.isArray(parsed.meals)) return "meals must be an array";
        const seenIds = new Set();
        for (const meal of parsed.meals) {
          if (typeof meal !== "object" || meal === null || Array.isArray(meal)) return "each meal must be an object";
          if (typeof meal.id !== "string" || !meal.id) return "each meal needs a non-empty id";
          if (typeof meal.name !== "string" || !meal.name) return "each meal needs a non-empty name";
          if (!Array.isArray(meal.ingredients)) return "each meal needs an ingredients array";
          if (meal.variants !== undefined) {
            if (!Array.isArray(meal.variants)) return "meal variants must be an array";
            const seenVariantIds = new Set();
            for (const v of meal.variants) {
              if (typeof v !== "object" || v === null || Array.isArray(v)) return "each variant must be an object";
              if (typeof v.id !== "string" || !v.id) return "each variant needs a non-empty id";
              if (typeof v.name !== "string" || !v.name) return "each variant needs a non-empty name";
              if (!Array.isArray(v.ingredients)) return "each variant needs an ingredients array";
              if (seenVariantIds.has(v.id)) return "duplicate variant id: " + v.id;
              seenVariantIds.add(v.id);
            }
          }
          if (seenIds.has(meal.id)) return "duplicate meal id: " + meal.id;
          seenIds.add(meal.id);
        }
        return null;
      }
      const okMeal = { id: "a", name: "A", ingredients: [] };
      check("mealsError: accepts a meal with no variants", mealsError({ meals: [okMeal] }) === null);
      check("mealsError: accepts a valid variants array",
        mealsError({ meals: [{ ...okMeal, variants: [{ id: "v1", name: "V1", ingredients: [] }] }] }) === null);
      check("mealsError: rejects a non-array variants",
        typeof mealsError({ meals: [{ ...okMeal, variants: {} }] }) === "string");
      check("mealsError: rejects a variant with no id",
        typeof mealsError({ meals: [{ ...okMeal, variants: [{ name: "V1", ingredients: [] }] }] }) === "string");
      check("mealsError: rejects a variant with no ingredients array",
        typeof mealsError({ meals: [{ ...okMeal, variants: [{ id: "v1", name: "V1" }] }] }) === "string");
      check("mealsError: rejects duplicate variant ids",
        typeof mealsError({ meals: [{ ...okMeal, variants: [
          { id: "v1", name: "V1", ingredients: [] }, { id: "v1", name: "V2", ingredients: [] },
        ] }] }) === "string");
    }
  }

  // ---- Group 34: Phase 15 (eaten log) ----
  {
    const tags = { pasta: { fibre: "med" }, cream: { calcium: "high" }, milk: { calcium: "low", vitD: "low" } };
    check("tagsForMeal: dedupes + sorts across ingredients",
      deepEqual(MP.Nutrition.tagsForMeal({ ingredients: [{ key: "cream" }, { key: "milk" }] }, tags), ["calcium", "vitD"]));
    check("tagsForMeal: unknown key contributes nothing",
      deepEqual(MP.Nutrition.tagsForMeal({ ingredients: [{ key: "nope" }] }, tags), []));
    check("tagsForMeal: no ingredients => []", deepEqual(MP.Nutrition.tagsForMeal({ ingredients: [] }, tags), []));
    check("tagsForMeal: null meal doesn't throw", deepEqual(MP.Nutrition.tagsForMeal(null, tags), []));
    check("tagsForMeal: a low-level tag still appears",
      deepEqual(MP.Nutrition.tagsForMeal({ ingredients: [{ key: "milk" }] }, tags), ["calcium", "vitD"]));

    // localEatenLog / logEaten (against a stubbed localStorage-backed MP.Sync)
    {
      const store = {};
      const realGetItem = localStorage.getItem.bind(localStorage);
      const realSetItem = localStorage.setItem.bind(localStorage);
      localStorage.getItem = (k) => (k === "mp_eatenLog" ? (store.log ?? null) : realGetItem(k));
      localStorage.setItem = (k, v) => { if (k === "mp_eatenLog") store.log = v; else realSetItem(k, v); };

      check("localEatenLog: [] for a missing key", deepEqual(MP.Sync.localEatenLog(), []));
      store.log = "{not json";
      check("localEatenLog: [] for a corrupt value", deepEqual(MP.Sync.localEatenLog(), []));

      store.log = "[]";

    {
      function eatenLogError(parsed) {
        if (!Array.isArray(parsed)) return "expected an array";
        if (parsed.length > 200) return "at most 200 entries";
        const seenIds = new Set();
        const ALLOWED_KEYS = new Set(["id", "mealId", "name", "eatenAt", "tags"]);
        for (const entry of parsed) {
          if (typeof entry !== "object" || entry === null || Array.isArray(entry)) return "each entry must be an object";
          for (const key of Object.keys(entry)) {
            if (!ALLOWED_KEYS.has(key)) return "unknown entry key: " + key;
          }
          for (const field of ["id", "mealId", "name", "eatenAt"]) {
            if (typeof entry[field] !== "string" || !entry[field]) return "each entry needs a non-empty " + field;
          }
          if (!Array.isArray(entry.tags) || entry.tags.some((t) => typeof t !== "string")) {
            return "each entry needs a tags array of strings";
          }
          if (seenIds.has(entry.id)) return "duplicate entry id: " + entry.id;
          seenIds.add(entry.id);
        }
        return null;
      }
      const okEntry = { id: "a:1", mealId: "a", name: "A", eatenAt: "1", tags: ["fibre"] };

      check("eatenLogError: rejects tags as a string", typeof eatenLogError([{ ...okEntry, tags: "fibre" }]) === "string");
      check("eatenLogError: rejects a non-string inside tags", typeof eatenLogError([{ ...okEntry, tags: [1] }]) === "string");
      check("eatenLogError: rejects duplicate ids", typeof eatenLogError([okEntry, okEntry]) === "string");
      check("eatenLogError: rejects an unknown extra key", typeof eatenLogError([{ ...okEntry, extra: 1 }]) === "string");
    }

    check("chipHits: keyword on meal name", G.rankSlot([mA, mC], 1, [], { tags: flatTags, targets: noTargets, prefs: { chips: ["bake"], vocab: preferVocab } })[0].id === "mA");

    const tagVocab = { chips: [{ id: "fib", kind: "prefer", tags: ["fibre"] }] };

    const effortVocab = { chips: [{ id: "batchy", kind: "prefer", prepEffort: "batch" }] };

    // Empty-prefs regression at the generatePlan level
    const planOmitted = G.generatePlan(library, tags, targets, shelfData, "2026-09-07");
    const planEmptyPrefs = G.generatePlan(library, tags, targets, shelfData, "2026-09-07", undefined, undefined, {});

  // ---- Group 41: Phase 23 ("Plan with me" setup screen) ----

    const mKeyHit = { id: "mK", name: "Dinner", ingredients: [{ key: "bakedbeans" }] };

    check("chipHits: keyword hit on ingredient key", G.chipHits(mKeyHit, bakeChip, {}) === true);
    check("chipHits: no match -> false", G.chipHits(mNoHit, bakeChip, {}) === false);

    const fibChip = { id: "fib", kind: "prefer", tags: ["fibre"] };
    const mHighFibre = { id: "mF", name: "X", ingredients: [{ key: "oats" }] };
    const mLowFibre = { id: "mL", name: "Y", ingredients: [{ key: "rice" }] };

      const log = [ent("a", "2026-10-01"), ent("a", "2026-10-01"), ent("b", "2026-10-02"),
        ent("gone", "2026-10-04", { tags: ["fibre"] }), { mealId: "a" }, { mealId: "a", eatenAt: "nope" }];
      const g = N.weekGaps(log, byId, ["2026-10-01", "2026-10-02", "2026-10-03", "2026-10-04"], tg, tr, dk);
      const gn = (n) => g.nutrients.find((x) => x.nutrient === n);
      check("weekGaps: notLogged lists the empty day", deepEqual(g.notLogged, ["2026-10-03"]));
      check("weekGaps: loggedDays excludes empty day, bad entries skipped", gn("fibre").loggedDays === 3);

    // Synthetic budget fixture: 5 nutrition-neutral meals (bE far cheapest, 5th-ranked).
    const bA = { id: "bA", name: "A", ingredients: [{ key: "a" }] };
    const bB = { id: "bB", name: "B", ingredients: [{ key: "b" }] };
    const bC = { id: "bC", name: "C", ingredients: [{ key: "c" }] };

    const bpNoCfg = G.rankSlot(budgetPool, 1, [], { tags: flatBudgetTags, targets: noBudgetTargets, budget: noCfg, halfKeys: freshHalfKeys(), pressure: 1 });

    {

      const leftover1 = { id: "leftover1", ingredients: [] };

      const f4 = { id: "f4", mealTypes: ["dinner"], ingredients: [] };
      const f5 = { id: "f5", mealTypes: ["dinner"], ingredients: [] };
      const leftoverLibrary = [bigroast, leftover1, f1, f2, f3, f4, f5];
      const leftoverShelfData = { cooked_leftovers: { fridgeDays: 3 } };
      const leftoverCostIndex = {
        "big-roast": { cost: 5, keys: [] }, leftover1: { cost: 1000, keys: [] },
        f1: { cost: 2.10, keys: [] }, f2: { cost: 2.20, keys: [] }, f3: { cost: 2.30, keys: [] },
        f4: { cost: 2.40, keys: [] }, f5: { cost: 0.10, keys: [] },
      };
      const leftoverBudget = { costIndex: leftoverCostIndex, shortlistSize: 4, reuseCredit: 0, budgetTarget: { max: 120, step: 5, default: 0, maxShortlist: 10 } };
      // Saturday start -> weekendRuns [[1,2],[7,8,9],[14]]: a 2-day run at the very
      // start leaves days 3-7 in the same half to reveal a leaked leftover cost.
      const leftoverPlan = G.generatePlan(leftoverLibrary, {}, {}, leftoverShelfData, "2026-09-05", leftoverBudget, {}, { budgetTarget: 50 });
      check("leftover day (£1000, uncounted) doesn't inflate week-1 pressure: day 3 still picks the narrow-shortlist winner",
        leftoverPlan.days[2].slots.dinner.mealId === "f1");
    }

    // Per-half reset (D2): the documented pressure formula reads only its own
    // half's `spent[half]` — a blown week 1 (huge spent.first) cannot leak
    // into day 8's pressure, because day 8 reads spent.second alone.
    {
      const pressureFormula = (spent, half, target, dayInHalf) => {
        const expected = target * (dayInHalf - 1) / 7;
        return Math.min(1, Math.max(0, (spent[half] - expected) / target));
      };
      const blownWeek1 = { first: 1000, second: 0 };
      const cheapWeek1 = { first: 0, second: 0 };
      check("per-half reset: day 8's pressure formula ignores a blown week 1",
        pressureFormula(blownWeek1, "second", 50, 1) === pressureFormula(cheapWeek1, "second", 50, 1)
        && pressureFormula(blownWeek1, "second", 50, 1) === 0);

      localStorage.setItem("mp_drafts", JSON.stringify({ drafts: [draft] }));

      const planD = MP.Generator.generatePlan(library, tags, targets, shelfData, "2026-09-07");

      localStorage.removeItem("mp_library");
      check("Sync.fetchDrafts: sync off -> empty, never throws", deepEqual(await MP.Sync.fetchDrafts(), { drafts: [] }) && (await MP.Sync.deleteDraft("x")) === false);

    // Phase 51: MP.Ratings + rankSlot rating layer / never filter.
    {
      const R = MP.Ratings;
      localStorage.removeItem("mp_ratings");
      const rp = [1, 2, 3, 4].map((i) => ({ id: "r" + i, name: "r" + i, prepEffort: "quick", mealTypes: ["dinner"], ingredients: [] }));

      const base = ids(undefined);
      check("ratings: empty map = today's order", deepEqual(ids({}), base) && deepEqual(ids({ r1: { rating: null, never: false } }), base));
      const ord = ids({ [base[0]]: { rating: "down" }, [base[3]]: { rating: "up" } });
      check("ratings: up before neutral before down, pure reorder",
        ord[0] === base[3] && ord[3] === base[0] && deepEqual(ord.slice(1, 3), base.slice(1, 3)) && ord.length === 4);
      // Phase 74: a chat reject with a reason is MP.Ratings.set(down + note); that meal then ranks last
      R.set(base[0], { rating: "down", note: "too fiddly" });
      const rej = ids(R.get());
      check("Phase 74: reject with reason writes down+note and ranks the meal lower",
        R.get()[base[0]].rating === "down" && R.get()[base[0]].note === "too fiddly" && rej[rej.length - 1] === base[0]);
      localStorage.removeItem("mp_ratings");
      check("ratings: never drops the meal, even from a pool of one",
        !ids({ r2: { never: true } }).includes("r2") && deepEqual(MP.Generator.rankSlot([rp[0]], 1, [], { ...rc, ratings: { r1: { never: true } } }), []));
      const lib = library.map((m) => ({ ...m }));
      const dinners = lib.filter((m) => (m.mealTypes || []).includes("dinner"));
      const victim = dinners[0].id;
      let seen = false;
      for (let i = 0; i < 5; i++) {
        const pl = MP.Generator.generatePlan(lib, tags, targets, shelfData, undefined, null, {}, {}, { [victim]: { never: true } });
        if (pl.days.some((d) => Object.values(d.slots).some((sl) => sl.mealId === victim))) seen = true;
      }
      check("ratings: a never meal never appears in generatePlan", !seen);
      // Phase 62: taste profile
      {
        const mk = (id, keys, eff) => ({ id, name: id, prepEffort: eff || "quick", mealTypes: ["dinner"], ingredients: keys.map((k) => ({ key: k })) });
        const tm = [mk("t1", ["lime", "salt"]), mk("t2", ["lime", "salt"]), mk("t3", ["lime"]), mk("t4", ["beef", "salt"]), mk("t5", ["beef"]), mk("t6", ["beef", "salt"]),
          mk("c1", ["lime"]), mk("c2", ["beef"]), mk("n1", ["rice"]), mk("n2", ["rice"]), mk("n3", ["rice"]), mk("n4", ["rice"])];
        const rat = { t1: { rating: "up" }, t2: { rating: "up" }, t3: { rating: "up" }, t4: { rating: "down" }, t5: { rating: "down" }, t6: { rating: "down" } };
        check("taste: inert below 3 rated meals", Object.keys(R.tasteProfile({ t1: { rating: "up" }, t2: { rating: "up" } }, tm).tokens).length === 0);
        check("taste: ids not in library are not counted", R.tasteProfile({ ...rat, gone: { rating: "up" } }, tm).n === 6);
        const prof = R.tasteProfile(rat, tm);
        check("taste: candidate sharing 👍 ingredients outscores one sharing 👎", R.tasteScore(prof, tm[6]) > R.tasteScore(prof, tm[7]) && R.tasteScore(R.tasteProfile({}, tm), tm[6]) === 0);
        const order = (taste) => MP.Generator.rankSlot(tm.slice(6), 1, [], { ...rc, taste }).map((m) => m.id);
        const none = order(undefined);
        const withT = order(prof);
        check("taste: rankSlot permutation of no-taste, liked ahead", deepEqual([...withT].sort(), [...none].sort()) && withT.indexOf("c1") < withT.indexOf("c2"));
        check("taste: inert profile = identical order", deepEqual(order(R.tasteProfile({}, tm)), none));
        const rr = MP.Generator.rankSlot(tm, 1, [], { ...rc, ratings: rat, taste: prof }).map((m) => m.id);
        check("taste: rating groups keep up/neutral/down order", rr.slice(0, 3).every((id) => rat[id] && rat[id].rating === "up") && rr.slice(-3).every((id) => rat[id] && rat[id].rating === "down"));
        const pm = [mk("d1", ["lime"]), mk("d2", ["beef"])];
        const small = MP.Generator.rankSlot(pm, 1, [], { ...rc, taste: prof });
        check("taste: pool smaller than window still fills", small.length === 2);
        const dl = MP.Prefs.orderByTaste(tm.slice(6), {}, tm, prof).map((m) => m.id);
        check("orderByTaste: ratings profile puts liked first; absent = today's", dl.indexOf("c1") < dl.indexOf("c2") && deepEqual(MP.Prefs.orderByTaste(tm.slice(6), {}, tm).map((m) => m.id), tm.slice(6).map((m) => m.id)));
      }
      R.set("r1", { rating: "up", note: " hi " });
      check("Ratings.set: record shaped, note trimmed, neverIds", R.get().r1.rating === "up" && R.get().r1.note === "hi" && R.get().r1.never === false && R.neverIds().size === 0);

      check("Ratings.set: merge keeps rating, caps note, never flagged", R.get().r1.rating === "up" && R.get().r1.note.length === 120 && R.neverIds().has("r1"));
      R.merge({ r1: { rating: "down", note: "old", never: false, at: "2000-01-01T00:00:00.000Z" }, r9: { rating: "up", note: "", never: false, at: "2000-01-01T00:00:00.000Z" } });
      check("Ratings.merge: newest at wins per meal", R.get().r1.rating === "up" && R.get().r9.rating === "up");
      R.merge({ r1: { rating: "down", note: "new", never: false, at: "2999-01-01T00:00:00.000Z" } });
      check("Ratings.merge: newer remote replaces", R.get().r1.rating === "down" && R.get().r1.note === "new");
      localStorage.removeItem("mp_ratings");
    }

    // Phase 37: MP.DayHints resolve/merge/dismiss + generator freeDays reorder.
    {
      const H = MP.DayHints;
      const hints = { updatedAt: "T1", days: {
        "2026-10-20": { effort: "busy" }, "2026-10-22": { effort: "busy", why: "<b>x</b>" },
        "2026-10-23": { effort: "free" }, "2026-10-24": { effort: "normal" }, "2026-10-25": { effort: "bogus" },

      const m = H.merge({ busyDays: [3, 5], chips: ["a"] }, { busyDays: [2, 5], freeDays: [3, 4] });
      check("DayHints.merge: busy union, user-busy beats free", deepEqual(m.busyDays, [2, 3, 5]) && deepEqual(m.freeDays, [4]) && deepEqual(m.chips, ["a"]));

      const pool = [
        { id: "q1", name: "q1", prepEffort: "quick", mealTypes: ["dinner"], ingredients: [] },
        { id: "b1", name: "b1", prepEffort: "batch", mealTypes: ["dinner"], ingredients: [] },

      const other = MP.Generator.rankSlot(pool, 4, [], { ...ctx, prefs: { freeDays: [3] } }).map((x) => x.id);

        free[0] === "b1" && free.length === base.length
        && deepEqual(free.filter((i) => i !== "b1"), base.filter((i) => i !== "b1")) && deepEqual(other, base));
    }

    // MP.PlanPrefs.get()/save() budgetTarget coercion.
    {
      const P = MP.PlanPrefs;
      const KEY = P.KEY;
      localStorage.removeItem(KEY);
      check("PlanPrefs.get(): no key -> budgetTarget 0", P.get().budgetTarget === 0);

      check("PlanPrefs.save(): return value carries budgetTarget", saved.budgetTarget === 75);

      localStorage.removeItem(KEY);

  }

  // ---- Group 45: Phase 28 (ingredient-substitution groups) ----
  {
    const G = MP.Generator;
    const SL = MP.ShoppingList;

    // groupIndex
    check("groupIndex({}) -> {}", deepEqual(SL.groupIndex({}), {}));
    check("groupIndex(null) -> {}", deepEqual(SL.groupIndex(null), {}));
    check("groupIndex({groups:[]}) -> {}", deepEqual(SL.groupIndex({ groups: [] }), {}));

      deepEqual(SL.groupIndex({ groups: [{ id: "solo", members: [{ key: "a", label: "A" }] }] }), {}));

        groups: [
          { id: "first", members: [{ key: "x", label: "X1" }, { key: "y", label: "Y1" }] },

      check("applySubs: does not mutate input", meal.ingredients[0].key === "onion");
      check("applySubs(meal, undefined) -> unchanged", MP.applySubs(meal, undefined) === meal);
      check("applySubs(meal, []) -> unchanged", MP.applySubs(meal, []) === meal);
      check("applySubs(meal, 'nonsense') -> unchanged, no throw", MP.applySubs(meal, "nonsense") === meal);
      check("applySubs: unmatched from -> unchanged", deepEqual(MP.applySubs(meal, [{ from: "nope", to: "x", label: "X" }]), meal));
    }

    // MP.effectiveMeal(meal, variantId, subs)
    {
      const variant = { id: "v1", name: "Spicy", ingredients: [{ key: "peppers", qty: "1", label: "Peppers" }] };
      const meal = { id: "m2", ingredients: [{ key: "onion", qty: "1", label: "Onion" }], variants: [variant] };

      const bA = { id: "bA", ingredients: [{ key: "a" }] };

      const noCredit = { costIndex, groups, shortlistSize: 4, reuseCredit: 0.6, subCredit: 0 };

      const poolNoOnion = [bA, bB, bC, mPepper];
      const rWith = G.rankSlot(poolNoOnion, 1, [], { tags: flatTags, targets: noTargets, budget: withCredit, halfKeys: half, pressure: 0 });
      const rWithout = G.rankSlot(poolNoOnion, 1, [], { tags: flatTags, targets: noTargets, budget: noCredit, halfKeys: half, pressure: 0 });
      const rNoGroups = G.rankSlot(poolNoOnion, 1, [], { tags: flatTags, targets: noTargets, budget: noGroups, halfKeys: half, pressure: 0 });
      check("rankSlot: subCredit set pulls the swap-only meal to the head", rWith[0].id === "mPepper");
      check("rankSlot: subCredit 0 leaves ordering identical to groups absent", deepEqual(rWithout.map((m) => m.id), rNoGroups.map((m) => m.id)));
      check("rankSlot: subCredit 0 does NOT pull the swap-only meal to the head", rWithout[rWithout.length - 1].id === "mPepper");
      check("rankSlot: returns every meal in the pool regardless of groups/subCredit",
        deepEqual([...rWith.map((m) => m.id)].sort(), [...poolNoOnion.map((m) => m.id)].sort()));

      check("rankSlot: an exact-overlap meal still outranks a swap-only meal of the same cost", rExact[0].id === "mOnion");

    {

        shortlistSize: 4, reuseCredit: 0.6, subCredit: 0.3,

    // Exclusion gate: a swap is rejected, never the meal.
    {

      const hamToastie = { id: "ham-toastie", name: "Ham Toastie", mealTypes: ["dinner"], ingredients: [{ key: "cheese" }] };

    {

      const garlicMeal = { id: "garlic-meal", name: "Garlic Meal", mealTypes: ["dinner"], ingredients: [{ key: "garlic" }] };

      const groups = SL.groupIndex({
        groups: [
          { id: "gA", members: [{ key: "tomato", label: "Tomato" }, { key: "carrot", label: "Carrot" }] },
          { id: "gB", members: [{ key: "onion", label: "Onion" }, { key: "pepper", label: "Pepper" }] },
        ],
      });

  // Phase 43: cookable, storage, leftovers, quick

  }

  {
    // Phase 79: cooking mode
    const CM = MP.CookMode;
    check("cook: timerLeft counts down from endAt and clamps at 0", CM.timerLeft({ endAt: 5000 }, 2000) === 3000 && CM.timerLeft({ endAt: 5000 }, 9000) === 0);
    const ov = document.createElement("div"); ov.id = "cook-overlay"; ov.className = "hidden";
    ov.innerHTML = '<div id="cook-sheet"></div>'; document.body.appendChild(ov);
    const mk = (extra) => ({ id: "cm1", name: "Cook <b>Test</b>", ingredients: [{ name: "Rice", qty: "100g" }], ...extra });
    let confirmed = 0;
    CM.open(mk({ method: [{ text: "Boil", minutes: 10 }, { text: "Serve" }] }), mk(), () => confirmed++);
    const sh = document.getElementById("cook-sheet");
    sh.querySelector(".cook-timer-btn").click();
    const before = CM._state().timers[0].endAt;
    sh.querySelector(".cook-next").click();
    sh.querySelector(".cook-back").click();
    check("cook: timer survives step changes", CM._state().timers[0] && CM._state().timers[0].endAt === before && /Cancel timer/.test(sh.innerHTML));
    check("cook: meal text escaped", !sh.querySelector("h2 b"));
    sh.querySelector(".cook-next").click();
    check("cook: last step offers Confirm cook, step 2 has no timer button", sh.querySelector(".cook-next").textContent === "Confirm cook" && !sh.querySelector(".cook-timer-btn"));
    const nextBtn = sh.querySelector(".cook-next");
    nextBtn.click(); nextBtn.click();
    check("cook: Confirm cook twice calls onConfirm once and closes", confirmed === 1 && CM._state() === null);
    CM.open(mk(), mk(), () => confirmed++);
    check("cook: no-method meal shows ingredients, no Back, Confirm cook offered", /Rice/.test(sh.innerHTML) && !sh.querySelector(".cook-back") && sh.querySelector(".cook-next").textContent === "Confirm cook");
    CM.close();
    check("cook: close without confirm calls nothing", confirmed === 1);
    ov.remove();
  }

  { // Phase 90a: fromCook, bulk, 28-day shop lists
    const SL = MP.ShoppingList, PCx = MP.PlanChat;
    const sh = { cooked_leftovers: { fridgeDays: 3, frozenMonths: 3 }, raw_chicken: { fridgeDays: 2, frozenMonths: 9 }, tinned: { ambient: true } };
    const mk = (id, o) => ({ id, name: id, mealTypes: ["dinner", "lunch"], servings: 1, ingredients: [{ key: "chicken_thighs", qty: "500g" }], ...o });
    const byId = { a: mk("a"), b: mk("b", { ingredients: [{ key: "chicken_thighs", qty: "500g" }, { key: "tomato_tin", qty: "1 tin" }] }) };
    const pack = { items: { chicken_thighs: { label: "Chicken thighs, 600g", packSize: 600, unit: "g", price: 3, bulk: { packSize: 1000, price: 4.2, label: "chicken thighs" } }, tomato_tin: { packSize: 1, unit: "tins", price: 0.5 } } };
    const days = (n, f) => Array.from({ length: n }, (_, i) => ({ day: i + 1, slots: f(i + 1) }));
    const plan = { startDate: "2026-09-07", days: days(14, (d) => (d === 1 || d === 9 ? { dinner: { mealId: "a" } } : {})) };
    check("90a: buildLists covers a 28 and a 21 day plan", Object.keys(SL.buildLists({ ...plan, days: days(28, () => ({})) }, byId, pack)).length === 4 && Object.keys(SL.buildLists({ ...plan, days: days(21, () => ({})) }, byId, pack)).length === 3);
    const plain = SL.buildLists(plan, byId, pack, null);
    check("90a: no bulk = unchanged output", deepEqual(plain, SL.buildLists({ ...plan, bulk: [] }, byId, pack, null)) && plain[1].lines[0].packs === 1 && !plain[1].lines[0].bulk);
    const withB = SL.buildLists({ ...plan, bulk: [{ key: "chicken_thighs", shopDay: 1 }] }, byId, pack, null);
    const bl = withB[1].lines[0];
    check("90a: bulk moves later shop to the first with freeze", bl.packs === 1 && bl.packSize === 1000 && bl.lineCost === 4.2 && bl.bulk.freeze === 500 && deepEqual(bl.bulk.coversDays, [8]) && withB[8].lines.length === 0);
    const opts = SL.bulkOptions(plan, byId, pack, sh);
    check("90a: bulkOptions saving and kept", opts.length === 1 && opts[0].shopDay === 1 && opts[0].normal === 6 && opts[0].bulk === 4.2 && opts[0].kept === 0 && opts[0].saving === 1.8);
    check("90a: bulkOptions skips accepted keys, single-shop keys and fridge-only", SL.bulkOptions({ ...plan, bulk: [{ key: "chicken_thighs", shopDay: 1 }] }, byId, pack, sh).length === 0
      && SL.bulkOptions({ ...plan, days: days(14, (d) => (d === 1 ? { dinner: { mealId: "a" } } : {})) }, byId, pack, sh).length === 0);
    // fromCook
    const cook = { id: "a:2026-09-07", mealId: "a", name: "a", cookedAt: "2026-09-07T10:00:00Z", portionsLeft: 1, storage: "freezer" };
    const ctx = { terms: [], cooks: [cook], shelfData: sh };
    const p2 = { startDate: "2026-09-07", days: days(6, () => ({})) };
    let r = MP.placeSlots(p2, [{ day: 2, slot: "dinner", mealId: "a", cookId: cook.id }], byId, ctx);
    check("90a: placeSlots cookId accepted", r.refused.length === 0 && r.plan.days[1].slots.dinner.fromCook === cook.id);
    const why = (x) => (x.refused[0] || {}).why || "";
    check("90a: placeSlots cookId over-allocation refused", /only 1 portion left/.test(why(MP.placeSlots(r.plan, [{ day: 3, slot: "dinner", mealId: "a", cookId: cook.id }], byId, ctx))));
    check("90a: placeSlots cookId wrong meal, unknown, snack, breakfast refused", /different meal/.test(why(MP.placeSlots(p2, [{ day: 2, slot: "dinner", mealId: "b", cookId: cook.id }], byId, ctx))) && /no such cook/.test(why(MP.placeSlots(p2, [{ day: 2, slot: "dinner", mealId: "a", cookId: "zz" }], byId, ctx))) && /snack/.test(why(MP.placeSlots(p2, [{ day: 2, slot: "snack", mealId: "a", cookId: cook.id }], byId, ctx))));
    check("90a: placeSlots cookId past eat-by refused", /eat-by/.test(why(MP.placeSlots({ ...p2, days: days(300, () => ({})) }, [{ day: 290, slot: "dinner", mealId: "a", cookId: cook.id }], byId, ctx))));
    const pf = { startDate: "2026-09-07", days: days(14, (d) => (d === 2 ? { dinner: { mealId: "a", fromCook: cook.id } } : d === 10 ? { dinner: { mealId: "a" } } : {})) };
    check("90a: purchaseOccurrences skips fromCook", SL.buildLists(pf, byId, pack, null)[1] === undefined || SL.buildLists(pf, byId, pack, null)[1].lines.length === 0);
    check("90a: defrostNotes with a freezer cook", deepEqual(MP.ShelfLife.defrostNotes(pf, byId, [cook])[1], [{ mealId: "a", forDay: 2 }]) && !MP.ShelfLife.defrostNotes(pf, byId, [])[1]);
    const mir = MP.Sync.planMirror({ ...pf, bulk: [{ key: "k", shopDay: 1, junk: 1 }] });
    check("90a: planMirror keeps fromCook and bulk", mir.days[1].slots.dinner.fromCook === cook.id && deepEqual(mir.bulk, [{ key: "k", shopDay: 1 }]));
    // roll
    const rolled = MP.rollPlan({ ...plan, bulk: [{ key: "x", shopDay: 8 }, { key: "y", shopDay: 1 }] }, "2026-09-14", (l, t) => ({ startDate: t, days: days(14, () => ({})) }));
    check("90a: roll shifts plan.bulk and drops below day 1", rolled && deepEqual(rolled.plan.bulk, [{ key: "x", shopDay: 1 }]));
    // validateReply
    const vr = (list) => PCx.validateReply({ edits: list }, {}, "2026-01-01").reply.edits;
    const ve = vr([{ type: "bulk", key: "rice", shopDay: 1 }, { type: "bulk", key: "", shopDay: 1 }, { type: "bulk", key: "rice", shopDay: 40 }, { type: "place", day: 1, slot: "dinner", mealId: "a", cookId: "c1" }]);
    check("90a: validateReply bulk and cookId", ve.length === 2 && ve[0].key === "rice" && ve[1].cookId === "c1");
    check("90a: validateReply bulk max 5", vr(Array.from({ length: 8 }, () => ({ type: "bulk", key: "rice", shopDay: 1 }))).length === 5);
    // applyBulkEdits
    const pl = { ...plan }; const bk = MP.Plan.applyBulkEdits([{ type: "bulk", key: "chicken_thighs", shopDay: 1 }, { type: "bulk", key: "nope", shopDay: 1 }], { plan: pl, byId, packData: pack, shelfData: sh });
    check("90a: applyBulkEdits card text, refusal, accept and undo", bk.cards.length === 1 && bk.refused.length === 1 && /Buy 1 kg chicken thighs on shop 1, freeze 500 g, saves £1.80/.test(bk.cards[0].text) && !pl.bulk && (bk.cards[0].accept(), pl.bulk.length === 1) && (bk.cards[0].undo(), !pl.bulk));
  }

  lines.push("", `${pass} passed, ${fail} failed`);
  document.getElementById("out").textContent = lines.join("\n");
})();
</script>
</body>
</html>
