<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meal Planner — Shopping List</title>
<meta name="theme-color" content="#121212" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Meals" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="nav">
  <span class="brand">🍽 Meal Planner</span>
  <div class="nav-links hscroll">
    <a href="index.html">Browse & Add</a>
    <a href="discover.html">Discover</a>
    <a href="plan.html">2-Week Plan</a>
    <a href="shopping.html" class="active">Shopping</a>
  </div>
  <button id="theme-toggle" class="icon-btn" title="Toggle dark/light mode">🌓</button>
</nav>

<main>
  <div class="tab-bar" role="tablist">
    <button class="tab-btn active" role="tab" id="tab-planned"
            aria-controls="panel-planned" aria-selected="true">Shopping list</button>
    <button class="tab-btn" role="tab" id="tab-adhoc"
            aria-controls="panel-adhoc" aria-selected="false">Ad-hoc list</button>
  </div>

  <section id="panel-planned" class="tab-panel" role="tabpanel" aria-labelledby="tab-planned">
    <p id="shopping-meta" class="muted"></p>
    <div id="shopping-root"></div>
  </section>

  <section id="panel-adhoc" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-adhoc">
    <div id="adhoc-root"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="prefs.js"></script>
<script src="shelf-life.js"></script>
<script src="shopping-list.js"></script>
<script src="hermes-sync.js"></script>
<script src="shopping.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
