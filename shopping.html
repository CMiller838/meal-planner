<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meal Planner — Shopping List</title>
<meta name="theme-color" content="#121212" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Meals" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="nav">
  <span class="brand">🍽 Meal Planner</span>
  <div class="nav-links hscroll">
    <a href="plan.html"><svg class="tab-ic" aria-hidden="true"><use href="nav-icons.svg#i-tonight"/></svg><span class="tab-l">Tonight</span></a>
    <a href="index.html"><svg class="tab-ic" aria-hidden="true"><use href="nav-icons.svg#i-browse"/></svg><span class="tab-l">Browse</span></a>
    <a href="discover.html"><svg class="tab-ic" aria-hidden="true"><use href="nav-icons.svg#i-disc"/></svg><span class="tab-l">Discover</span></a>
    <a href="shopping.html" class="active"><svg class="tab-ic" aria-hidden="true"><use href="nav-icons.svg#i-shop"/></svg><span class="tab-l">Shopping</span></a>
    <a href="eaten.html"><svg class="tab-ic" aria-hidden="true"><use href="nav-icons.svg#i-eaten"/></svg><span class="tab-l">Eaten</span></a>
  </div>
  <button id="theme-toggle" class="icon-btn" title="Toggle dark/light mode">🌓</button>
</nav>

<main>
  <div class="tab-bar" role="tablist">
    <button class="tab-btn active" role="tab" id="tab-planned"
            aria-controls="panel-planned" aria-selected="true">Shopping list</button>
    <button class="tab-btn" role="tab" id="tab-pantry"
            aria-controls="panel-pantry" aria-selected="false">Pantry</button>
  </div>

  <section id="panel-planned" class="tab-panel" role="tabpanel" aria-labelledby="tab-planned">
    <p id="shopping-meta" class="muted"></p>
    <div id="shopping-root"></div>
    <form id="adhoc-form" class="adhoc-add">
      <input type="text" id="adhoc-name" placeholder="Add an item" aria-label="Item name" required>
      <input type="text" id="adhoc-qty" placeholder="qty (optional)" aria-label="Quantity">
      <button type="submit" id="adhoc-add-btn" class="ghost">Add</button>
    </form>
  </section>

  <section id="panel-pantry" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-pantry">
    <div id="pantry-root"></div>
  </section>
</main>

<div id="shop-dock" class="shop-dock" hidden></div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal-sheet" class="modal-sheet" role="dialog" aria-modal="true"></div>
</div>

<script src="data.js"></script>
<script src="prefs.js"></script>
<script src="exclusions.js"></script>
<script src="shelf-life.js"></script>
<script src="shopping-list.js"></script>
<script src="products.js"></script>
<script src="hermes-sync.js"></script>
<script src="ratings.js"></script>
<script src="plan-chat.js"></script>
<script src="bar-chat.js"></script>
<script src="ate-box.js"></script>
<script src="plan-with-me.js"></script>
<script src="meal-sheet.js"></script>
<script src="shopping.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
