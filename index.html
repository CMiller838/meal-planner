<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meal Planner — Browse & Add</title>
<meta name="theme-color" content="#121212" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Meals" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="nav">
  <span class="brand">🍽 Meal Planner</span>
  <a href="index.html" class="active">Browse & Add</a>
  <a href="discover.html">Discover</a>
  <a href="plan.html">2-Week Plan</a>
  <a href="shopping.html">Shopping</a>
  <button id="theme-toggle" class="icon-btn" title="Toggle dark/light mode">🌓</button>
</nav>

<main>
  <section class="section">
    <h2>Your Library</h2>
    <input type="search" id="library-search" class="search-input"
           placeholder="Search your library — name, meal type or ingredient"
           aria-label="Search your library">
    <div id="library-grid" class="card-grid"></div>
  </section>

  <section class="section">
    <h2>Discover <span style="font-weight:400;color:var(--text-dim);font-size:.85rem;">swipe suggestions from TheMealDB</span></h2>
    <div id="swipe-deck" class="swipe-deck"></div>
    <p class="swipe-hint">Swipe right to like · swipe left to skip · tap to view</p>
  </section>

  <section class="section">
    <details id="sync-settings">
      <summary>Hermes sync</summary>
      <p id="sync-status" class="muted">Not set up</p>
      <label class="sync-field">Worker URL
        <input type="url" id="sync-url" placeholder="https://....workers.dev">
      </label>
      <label class="sync-field">Secret token
        <input type="password" id="sync-token" autocomplete="off">
      </label>
      <button id="sync-save" class="btn">Save &amp; sync now</button>
    </details>
  </section>
</main>

<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal-sheet" class="modal-sheet"></div>
</div>
<div id="toast-root"></div>

<script src="data.js"></script>
<script src="nutrition.js"></script>
<script src="shelf-life.js"></script>
<script src="swipe.js"></script>

<script src="exclusions.js"></script>
<script src="mealdb.js"></script>
<script src="hermes-sync.js"></script>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
